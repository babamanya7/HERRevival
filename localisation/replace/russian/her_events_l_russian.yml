  news.339.t:0 "Хорти отстранен от власти!"
  news.339.d:0 "Лидер Венгрии регент Миклош Хорти был отстранен от власти силой после того, как группа спецназа во главе с Отто Скорцени захватила Хорти и его сына, взяв их под стражу, и Хорти был вынужден отказаться от власти из-за угрозы жизни его сыновей. Лидер партии «Скрещенных стрел» Ференц Салаши занял место Хорти и должен продолжать войну до самого конца."
  news.339.a:0 "Венгрия будет боротся!"

  ww2_germany.45.t:0 "Клюге найден мертвым"
  ww2_germany.45.d:0 "Фельдмаршал Гюнтер фон Клюге был найден мертвым сегодня, он покончил с собой таблеткой цианида после того, как фюрер отозвал его в Берлин после провала чудовищного покушения, в котором Клюге играл второстепенную роль, но значительную в предательстве Рейха и его народа."
  ww2_germany.45.a:0 "Нелояльная свинья"

  sov_armor.806.t:0 "Сообщение 'Рамзая'"
  sov_armor.806.d:0 "[GetDateText] Рихард Зорге сообщил в Ставку о принятом на сверхсекретном совещании у японского императора 6 сентября 1941 решении Японии не вступать в войну с СССР до конца 1941 года и в начале 1942 года. Если мы прислушаемся к этому донесению, то можно будет снять с восточных границ свежие дивизии и перебросить их под Москву, предотвратив захват столицы Гитлеровскими войсками."
  sov_armor.806.a:0 "Стоит прислушаться"
  sov_armor.806_tt:0 "§GНалёты на дальний восток полностью прекратятся, держать войска там более не требуется§!"

















  #################################################################################### Events ####################################################################################

  ger_armor.305.t:0 "Русская Зима"
  ger_armor.305.d:0 "Выпал первый снег. Началась русская зима, известная как одна из причин поражения Наполеона в 1812 году. Другим фактором, затрудняющим военное маневрирование, является «распутица», или «генерал грязь», явление, происходящее в России с осенними дождями и весенними оттепелями, когда движение по неулучшенным дорогам затруднено из-за распутицы."
  ger_armor.305.a:0 "Вот незадача!"

  finland.10.t:0 "Мирные переговоры с СССР"
  finland.10.d:0 "Наша вторая война с советским режимом оказалась не такой успешной, как мы надеялись. В Москве назначена встреча, на которой нам будет предложена возможность заключить мир, но нам придется уступить любую завоеванную территорию и легализовать коммунизм в обмен на сохранение суверенитета Финляндии. \n\nФинские силы быстро истощаются, и мы больше не можем рассчитывать на помощь Германии. Возможно, это наша единственная надежда на мирное разрешение конфликта, однако нам придется провести демилитаризацию и выплатить военные репарации."
  finland.10.a_tt:0 "§YЕсли СССР согласится\n§!"
  finland.10.a:0 "В этой войне не победить"

  finland.11.t:0 "Финляндия просит мира"
  finland.11.d:0 "Война с Германией обошлась дорого, но, поскольку мы смогли оттеснить гитлеровскую армию, мы получили убедительное предложение из Финляндии. Мы сохраняем контроль над нашей территорией, завоеванной в ходе зимней войны, а Финляндия уходит из Оси и сохраняет нейтралитет, взамен мы выводим свои войска и прекращаем дальнейшие боевые действия.\nЭто завершит наше наступление на Финляндию без полного контроля над регионом, но, в свою очередь, позволит нам сосредоточиться на войне против Германии."
  finland.11.a:0 "это терпимые условия"

  chi_armor.802.t:0 "Инцидент в Ояме"
  chi_armor.802.d:0 "Вскоре после события Марко-Поло в Шанхае произошел еще один инцидент, в результате которого от рук китайцев погиб японский лейтенант. Несмотря на то, что вина лежит на Японии, мы получили диковинные требования о деэскалации ситуации, мы ожидаем, что это будет дымовой завесой, пока японская армия не сможет отправить подкрепление, мы должны сделать то же самое."
  chi_armor.802.a:0 "Война на горизонте"

  fra_armor.814.t:0 "Кабинет министров уходит в отставку"
  fra_armor.814.d:0 "Палата депутатов избрала Рейно премьер-министра, но только одним голосом, при этом большая часть его собственной партии воздержалась. Новое правительство особенно неустойчиво; многие правые требовали, чтобы Рейно напал не на Германию, а на Советский Союз. Палата также вынудила Даладье, которого Рейно лично считал ответственным за слабость Франции, стать министром национальной обороны и войны Рейно."
  fra_armor.814.a:0 "Пол Рейно возглавит новое правительство."

  fra_armor.815.t:0 "Провинции меняют верность!"
  fra_armor.815.d:0 "Провинции Центральной Африки, Индии, Китая и Тихого океана заявили о своей поддержке свободного французского режима. Этот акт уже дестабилизировал как легитимность нашего правительства, так и доверие народа к нам. Если мы хотим вернуть эти колонии, то присоединение к Оси может быть нашей лучшей надеждой."
  fra_armor.815.a:0 "Мы – истинное правительство!"
  fra_armor.815.b:0 "Мы будем ждать, пока война закончится."

  fra_armor.73.t:0 "Повстанцы Северной Африки!"
  fra_armor.73.d:0 ""
  fra_armor.73.a:0 "Мы – истинное правительство!"

  fra_armor.804.t:0 "Париж объявлен открытым городом"
  fra_armor.804.d:0 "С приближением немецкой армии к Парижу наше правительство потеряло веру в способность наших военных выиграть войну. Для того, чтобы спасти Париж от полного разрушения, французское правительство решило объявить Париж открытым городом."
  fra_armor.804.a:0 "Эвакуируйте столицу!"

  fra_armor.805.t:0 "Париж объявлен открытым городом"
  fra_armor.805.d:0 "С французским правительством, полностью разъединенным, наша военная победа убедила их, что дальнейшие бои бесполезны, и, увидев нашу военную машину, они решили объявить Париж открытым городом, позволяющим нашим войскам свободный вход. У нас есть узкое окно, чтобы воспользоваться этой возможностью в случае, если французские военные бросают вызов правительственным приказам и решают сделать Париж прифронтовым городом."
  fra_armor.805.a:0 "Война выиграна"

  fra_armor.806.t:0 "Франция формирует Европейскую коалицию"
  fra_armor.806.d:0 "Французское правительство объявило о своем намерении объединить Европу под одним знаменем, чтобы противостоять «растущей угрозе враждебных сил и укрепить нашу собственную безопасность». Хотя в последние годы мощь Франции резко возросла, до сих пор неясно, каковы их реальные намерения. Мы все еще должны сделать выбор. Должны ли мы присоединиться к ним или отказаться от интеграции проекта Франции?"
  fra_armor.806.a:0 "Мы должны присоединиться к ним."
  fra_armor.806.b:0 "У нас есть другие дела."

  fra_armor.807.t:0 "[From.GetName] присоединяется к Европейской коалиции"
  fra_armor.807.d:0 "[From.GetName] присоединяется к Европейской коалиции"
  fra_armor.807.a:0 "Они выбрали правильный выбор."

  fra_armor.808.t:0 "[From.GetName] отказывается вступать в Европейскую коалицию"
  fra_armor.808.d:0 "[From.GetName] отказывается вступать в Европейскую коалицию"
  fra_armor.808.a:0 "Слишком плохо для них."

  fra_armor.809.t:0 "Обширная воинская повинность"
  fra_armor.809.d:0 "Планирование крупной войны позволило нам немедленно начать приписывать большое количество нашего населения для развертывания на передовой."
  fra_armor.809.a:0 "Это даст нам много рабочей силы."

  fra_armor.810.t:0 "[FRA.GetName] просит денежной поддержки"
  fra_armor.810.d:0 "[FRA.GetName] просит помощи в борьбе с врагами. Большую часть предыдущих лет Франция находилась на ранней стадии мобилизации, что привело к нехватке средств для долгосрочной войны. Должны ли мы им помочь?"
  fra_armor.810.a:0 "Помогать им в наших интересах"
  fra_armor.810.b:0 "Мы не заинтересованы в ситуации с Францией."

  fra_armor.811.t:0 "[USA.GetName] отправляет помощь!"
  fra_armor.811.d:0 ""
  fra_armor.811.a:0 "Спасибо американцам!"

  fra_armor.812.t:0 "[USA.GetName] отказался от помощи"
  fra_armor.812.d:0 ""
  fra_armor.812.a:0 "Огромное разочарование"

  fra_armor.894.t:0 "Бейрутская конференция"
  fra_armor.894.d:0 "Поскольку война в Европе идет быстрыми темпами, настало время для неизбежных победителей подумать о будущем Германии. Мы можем предложить [beirut_partner.GetNameDef] конференцию по разделению [GER.GetNameDef] после войны, чтобы очертить наши сферы влияния на континенте. Наши «друзья» в [beirut_partner.GetNameDef] указали, что они будут заинтересованы в такой конференции. Несомненно, они захотят получить какую-то награду за свои жертвы."
  fra_armor.894.a:0 "Нам нужна конференция о будущем Германии."
  fra_armor.894.b:0 "Мы не можем сотрудничать с [yalta_partner.GetNameDef]."

  fra_armor.895.t:0 "Бейрутская конференция"
  fra_armor.895.d:0 "После того, как война против [GER.GetNameDef] подошла к своему неизбежному завершению, [yalta_origin.GetNameDef] обратился к нам с докладом о будущем Германии. \n\n Они предлагают разделение [GER.GetNameDef] между востоком и западом. Это позволило бы нашей сфере влияния распространиться вглубь Европы, что компенсировало бы некоторые потери, которые мы понесли в этой ужасной борьбе."
  fra_armor.895.a:0 "Во имя долгосрочного сотрудничества."
  fra_armor.895.b:0 "Мы будем диктовать свой мир."

  FRA_rhineland_puppet_tt:0 "§YРейнская область перейдёт под прямой контроль Франции, а в остальной Германии будет установлен дружественный Франции режим.§!"

  italy.1.a:0 "Присоединение их к империи"
  italy.1.b:0 "Создайте марионеточное государство"

  ita_armor.817.t:0 "Италия в кризисе"
  ita_armor.817.d:0 "С нашими большими территориальными потерями в Африке и на Сицилии наш народ требует прекращения войны, и по всем нашим городам начались протесты с появлением слухов о восстании на юге. Чтобы восстановить веру народа, мы должны вернуть Сицилию и показать, что Италия не падет!"
  ita_armor.817.a:0 "Мы должны немедленно контратаковать!"

  ita_armor.811.t:0 "Война с Эфиопией продолжается"
  ita_armor.811.d:0 "Наш народ устал и не уверен в нашем правительстве из-за отсутствия завершения войны в Эфиопии. Из наших пропагандистских усилий они рассматривают Эфиопию как легкую цель, с которой наши военные могут легко победить. Мы должны удвоить наши усилия, чтобы быстро положить конец войне, прежде чем люди потеряют веру в нас."
  ita_armor.811.a:0 "Мы теряем поддержку народа."

  ita_armor.812.t:0 "Война с Эфиопией продолжается"
  ita_armor.812.d:0 "Наш народ удивлен тем, что мы все еще находимся в состоянии войны с Эфиопией, а заголовки призывают провести расследование в отношении нашего военного персонала. Народ теряет веру в способность наших военных вести войны."
  ita_armor.812.a:0 "Мы должны удвоить наши усилия."

  ita_armor.813.t:0 "Война с Эфиопией продолжается"
  ita_armor.813.d:0 "Население шокировано тем, что война еще не закончилась! У них есть серьезные сомнения относительно нашей военной и любой агрессивной внешней политики, которую мы могли бы использовать в других странах."
  ita_armor.813.a:0 "Нам нужен новый план"

  ita_armor.814.t:0 "Война с Эфиопией продолжается"
  ita_armor.814.d:0 "Народ призывает к прекращению военных действий с Эфиопией. Увидев, сколько стоит долгая война с такой маленькой нацией, мы полностью деморализовали всех у себя дома."
  ita_armor.814.a:0 "Мы должны закончить войну сейчас."

  ita_armor.815.t:0 "Война с Эфиопией продолжается"
  ita_armor.815.d:0 "По всей стране продолжаются массовые протесты, к которым присоединяются наши военные и полиция, а не останавливают их! Массовые беспорядки обязательно появятся"
  ita_armor.815.a:0 "Население деморализовано"

  ita_armor.818.t:0 "Италия предлагает защиту"
  ita_armor.818.d:0 "Италия обратилась к нам с предложением гарантировать нашу независимость в обмен на оборудование. С нашим уязвимым положением, зажатым между многими странами, такое предложение может оказать большую помощь. Для этого в Италии требуется много веры."
  ita_armor.818.a:0 "Мы согласимся"
  ita_armor.818.b:0 "Мы в порядке сами по себе"

  ita_armor.819.t:0 "Чехословакия согласилась на наше предложение"
  ita_armor.819.d:0 "Чехословакия видела, что наше предложение о защите было мудрым выбором, и мы, несомненно, являемся ценным союзником. Они договорились о поставках нам оружия, которое должно помочь нам модернизировать нашу армию."
  ita_armor.819.a:0 "Превосходно"

  ita_armor.820.t:0 "Чехословакия отклонила наше предложение"
  ita_armor.820.d:0 "Чехословакия не считает нас ценным союзником и отвергла наше предложение о защите. Как бы это ни было печально, это не помешает нам стать европейской сверхдержавой."
  ita_armor.820.a:0 "Неважно"

  ita_armor.821.t:0 "Итальянский ультиматум"
  ita_armor.821.d:0 "Итальянские дипломаты предъявили нам ультиматум с требованием подчиниться их оккупации! Мы были обмануты, думая, что итальянцы будут уважать нашу независимость, несмотря на их союз с нами. Мало надежды, что мы сможем противостоять вторжению в одиночку."
  ita_armor.821.a:0 "Мы должны представить"
  ita_armor.821.b:0 "Сопротивление на вершине"

  ita_armor.822.t:0 "Урожай Болгарии"
  ita_armor.822.d:0 "Оценивая ситуацию, болгарское правительство справедливо пришло к выводу, что наша воля не может быть оспорена. Мы уже отдали приказ начать переброску войск в Болгарию и теперь удерживаем их ключевые города. Это еще один шаг к восстановлению Великой Римской империи."
  ita_armor.822.a:0 "Превосходно"

  ita_armor.823.t:0 "Болгария отказалась от ультиматума"
  ita_armor.823.d:0 "Несмотря на огромную разницу в силе, Болгария отвергла оккупацию и разорвала с нами связи. Если мы хотим их оккупировать, нужна более агрессивная дипломатия."
  ita_armor.823.a:0 "Мы будем применять силу тогда"

  ita_armor.824.t:0 "Италия требует Стамбула"
  ita_armor.824.d:0 "Италия пришла к нам с совершенно диковинным требованием передать ценный город Стамбул, ссылаясь на то, что они хотят восстановить Римскую империю. Хотя они могут считать себя непобедимыми, они серьезны. Можем ли мы позволить себе пойти на войну?"
  ita_armor.824.a:0 "Мы плохо подготовлены к войне."
  ita_armor.824.b:0 "Они никогда этого не получат!"

  ita_armor.825.t:0 "Турция переносит территорию"
  ita_armor.825.d:0 "К нашему удивлению, Турция приняла наши требования, скорее всего, потому, что они не хотят быть втянутыми в более широкий конфликт. Это большая победа для нас!"
  ita_armor.825.a:0 "Превосходно"

  ita_armor.826.t:0 "Турция отклонила претензии Италии"
  ita_armor.826.d:0 "Турция отвергла любые наши претензии на город и готова защищать там территорию. Хотя это не самый удивительный результат, он все же нежелателен."
  ita_armor.826.a:0 "Это был небольшой шанс."

  ita_armor.827.t:0 "Стамбул был завоеван"
  ita_armor.827.d:0 "С завоеванием Стамбула многие политики и общественность сами оказали поддержку восстановлению города до его первоначального наследия, начиная с его названия."
  ita_armor.827.a:0 "Возроди старую столицу!"

  ita_armor.828.t:0 "Германия переходит к аншлюсу"
  ita_armor.828.d:0 "Несмотря на нашу гарантию независимости Австрии, она не помешала Германии искать аншлюса с австрийским народом. Это ставит нас в сложную ситуацию, независимо от того, поддерживаем ли мы свои обязательства и рискуем ли войной или отступаем."
  ita_armor.828.a:0 "Мы не можем надеяться на победу"
  ita_armor.828.b:0 "Мы выполняем свои обязательства"

  ita_armor.829.t:0 "Италия отказалась от поддержки Австрии"
  ita_armor.829.d:0 "Из-за того, что мы начали с Аншлюса, Италия довольно неловко отозвала гарантии независимости Австрии. Это серьезный удар по репутации итальянцев и, вероятно, вызвало нестабильность в их стране. Однако для нас это большой успех, и мы должны быть в состоянии продолжить Аншлюс, не опасаясь итальянской оппозиции. Они не видят будущего так, как мы."
  ita_armor.829.a:0 "Мы объединим немецкий народ!"

  ita_armor.830.t:0 "Италия предупреждает"
  ita_armor.830.d:0 "Благодаря нашему сотрудничеству с Аншлюсом Италия подтвердила свою позицию по сохранению мира в Европе. Более вероятная причина заключается в том, что они рассматривают немецкую экспансию как угрозу. Таким образом, мы, левые, имеем потенциальную войну с итальянцами и значительно усиливаем напряженность, если мы продолжим Аншлюс, который может быть дорогостоящим для Рейха."
  ita_armor.830.a:0 "Никто не остановит нас"

  ita_armor.831.t:0 "Муссолини уволен с поста главы правительства"
  ita_armor.831.d:0 "Вчера утром король штурмовал здание парламента Муссолини и потребовал смещения главы государства и его подчиненных. Это включало удаление нескольких генералов и начальника штабов. Имея высшую власть, а также поддержку со стороны народа и многих членов фашистского совета, Муссолини был арестован, и король Виктор Эммануил принял нынешнее руководство Италии. В речи, чтобы заверить народ Италии, король раскрыл планы Муссолини сформировать Римскую империю, которая приведет Италию к катастрофе и поражению. Имея полный контроль над Италией, мир задается вопросом, что будет дальше для Италии."
  ita_armor.831.a:0 "Только король может править"
  ita_armor.831.b:0 "Мы должны двигаться к истинной демократии."
  Vatican_attitude_tt:0 "£faction_ita_vatican Ватикан становится §Gдружелюбнее§!."

  ita_armor.832.t:0 "Муссолини сбежал из тюрьмы!"
  ita_armor.832.d:0 "После смещения Муссолини с поста премьер-министра его эскорт в тюрьму попал в засаду, несомненно, из-за черных рубашек, которые остаются верными ему. Полиция опоздала, чтобы предотвратить его побег, и расследование с участием пропавших без вести сотрудников показало, что в стране и ее правительстве по-прежнему существует глубокая поддержка фашизма."
  ita_armor.832.a:0 "Начни охоту за Дуче!"

  ita_armor.833.t:0 "Проблемы на севере"
  ita_armor.833.d:0 "Несколько офицеров сообщили о проблемах в своих рядах. Многие солдаты по-прежнему политически связаны с Муссолини, и многие офицеры ушли в отставку в знак протеста против его увольнения. Высокое командование очень беспокоится о нашем сердце на Севере, которое видело большой успех при правлении Муссолини и, по слухам, укрывает Иль Дуче."
  ita_armor.833.a:0 "Мы должны противостоять его влиянию."

  ita_armor.834.t:0 "Италия требует Савойю"
  ita_armor.834.d:0 "Италия, ссылаясь на итальянское население Савойи, стремится расширить свою приграничную зону вокруг области, чтобы укрепить Италию. Но мы те, кто это решит."
  ita_armor.834.a:0 "Полагаю, они могут иметь Савойя."
  ita_armor.834.b:0 "Им нужно больше, чем несколько тысяч погибших."

  ita_armor.835.t:0 "Италия требует Корсику"
  ita_armor.835.d:0 "Италия, ссылаясь на итальянское население Корсики, стремится расширить свою приграничную зону вокруг области, чтобы укрепить Италию. Но мы те, кто это решит."
  ita_armor.835.a:0 "Корсика полезнее там под контролем"
  ita_armor.835.b:0 "Им нужно больше, чем несколько тысяч погибших."

  ita_armor.836.t:0 "Италия требует Мальту"
  ita_armor.836.d:0 "Италия, ссылаясь на итальянское население Мальты, стремится расширить свою приграничную зону вокруг области, чтобы укрепить Италию. Но мы те, кто это решит."
  ita_armor.836.a:0 "Я ожидаю от Мальты больших успехов."
  ita_armor.836.b:0 "Такой приз должен остаться у нас."

  ita_armor.837.t:0 "Италия требует Далмацию"
  ita_armor.837.d:0 "Итальянское население Далмации стремится расширить свою приграничную зону вокруг области, чтобы укрепить Италию. Но мы те, кто это решит."
  ita_armor.837.a:0 "Далмация не имеет значения, пусть она у них есть."
  ita_armor.837.b:0 "Им нужно больше, чем несколько тысяч погибших."

  ita_armor.838.t:0 "Италия требует Тичино"
  ita_armor.838.d:0 "Италия, ссылаясь на итальянское население Тичино, стремится расширить свою приграничную зону вокруг области, чтобы укрепить Италию. Но мы те, кто это решит."
  ita_armor.838.a:0 "У них может быть Тичино, если это делает их счастливыми."
  ita_armor.838.b:0 "Им нужно больше, чем несколько тысяч погибших."

  ita_armor.839.t:0 "[From.GetName]Принять наши требования"
  ita_armor.839.d:0 "[From.GetName] увидел мудрость поддержки наших требований к нашей законной территории и сдал Савойю нам."
  ita_armor.839.a:0 "Превосходно"

  ita_armor.840.t:0 "[From.GetName]Отклонить наши требования"
  ita_armor.840.d:0 "[From.GetName] сочла нужным помешать нашим скромным, справедливым и разумным требованиям к нашей законной территории."
  ita_armor.840.a:0 "Неприемлемо."

  ita_armor.841.t:0 "[ITA.GetName]Предлагается план захвата Гибралтера"
  ita_armor.841.d:0 "[ITA.GetName] предложил собрать наших самых радикальных националистов и спровоцировать беспорядки и саботаж в Гибралтере, чтобы ослабить его. Это откроет скалу для наших сил, чтобы захватить наши законные претензии. Этот план опасен и, вероятно, приведет к войне с [ENG.GetName], если они не откажутся от Скалы. Если война неизбежна, то это ставит нас в наиболее благоприятное положение."
  ita_armor.841.a:0 "Давайте дадим этому нашу печать одобрения."
  ita_armor.841.b:0 "Война с [ENG.GetName] слишком опасна"

  ita_armor.842.t:0 "[SPR.GetName] согласился с нашим планом"
  ita_armor.842.d:0 ""
  ita_armor.842.a:0 "Блестяще"

  ita_armor.843.t:0 "[SPR.GetName] отклонил наш план"
  ita_armor.843.d:0 ""
  ita_armor.843.a:0 "Они не считают войну неизбежной."

  ita_armor.844.t:0 "Проблемы в Гибралтере"
  ita_armor.844.d:0 "Радикалы из Испании начали собираться вокруг Гибралтера, и, хотя они протестовали мирно, ситуация переросла в беспорядки. Появляются сообщения о том, что люди пересекают воду, и целостность нашей военной базы потенциально может быть скомпрометирована."
  ita_armor.844.a:0 "Мы должны немедленно укрепить скалу."

  ita_armor.845.t:0 "Успех в Гибралтере"
  ita_armor.845.d:0 "Поступают сообщения о нашем успехе в саботаже фортов и баз Гибралтера. Британские войска дезорганизованы и заняты сдерживанием созданного нами хаоса, если и было время нанести удар, то сейчас."
  ita_armor.845.a:0 "Мы их хорошо напугали, но передумали."
  ita_armor.845.b:0 "Пришло время забастовки!"

  ita_armor.846.t:0 "Выборы [?global.year|0]"
  ita_armor.846.d:0 "Спустя месяц после окончания нашей гражданской войны народ проголосовал и с небольшой победой одержал победу."
  ita_armor.846.a:0 "Выиграл Партито Пополаре Италано"
  ita_armor.846.b:0 "Национале Монархико победил"
  ita_armor.846.c:0 "Выиграл Партито Комуниста Италано"
  ita_elections_requirment_tt:0 "Прошли новые выборы"

  ita_armor.847.t:0 "Король Виктор Эммануил III Шаги вниз"
  ita_armor.847.d:0 "После победы на выборах, когда-либо скромный король Эммануэль предпринял свой первый шаг в качестве главы Италии, чтобы поставить своего двоюродного брата Фердинандо Адальберто во главе страны. Он подчеркнул, что Италии необходимо сильное и популярное руководство, чтобы проложить сильный путь вперед, и выразил полную уверенность в новом лидере."
  ita_armor.847.a:0 "Да здравствует новый король!"

  ita_armor.848.t:0 "Отправить Ультиматий?"
  ita_armor.848.d:0 "Югославия не может рассчитывать на победу в бою между нашими странами, если мы пошлем им требование о нашей законно заявленной земле в Далмации, они могут просто передать ее без боя."
  ita_armor.848.a:0 "Do it"
  ita_armor.848.b:0 "Сейчас не самое подходящее время"

  ita_armor.849.t:0 "Италия требует Далмацию"
  ita_armor.849.d:0 "Итальянские войска концентрируются по другую сторону нашей границы, и их дипломаты потребовали, чтобы мы уступили им всю Далмацию! Должны ли мы сопротивляться?"
  ita_armor.849.a:0 "Нет. Это безнадёжно."
  ita_armor.849.c:0 "Да! Мы не отдадим свою территорию без боя!"

  ita_armor.850.t:0 "[YUG.GetName] сдает Далмацию"
  ita_armor.850.d:0 "Югославы мудро подчинились нашим требованиям и вывели все свои силы из Далмации. Мы включим эту территорию в Союз как Молдавскую Советскую Социалистическую Республику. Теперь его граждане будут пользоваться благами социализма."
  ita_armor.850.a:0 "Превосходно"

  ita_armor.851.t:0 "[YUG.GetName] отказывается от своих требований"
  ita_armor.851.d:0 "Югославы отказались подчиниться нашим требованиям! Похоже, нам придется силой изгнать их оккупационные силы из Далмации."
  ita_armor.851.a:0 "Они пожалеют об этом"

  ita_armor.852.t:0 "Разрушение Центральной Европы"
  ita_armor.852.d:0 "Наши цели находятся в поле зрения, однако планировщики настаивают на том, что мы ищем Францию и Германию, поскольку мы рискуем их военной оппозицией, чтобы разделить Центральную Европу. Должны ли мы разделить добычу или рискнуть пойти на это в одиночку?"
  ita_armor.852.a:0 "Найти общие цели безопаснее"
  ita_armor.852.b:0 "Нам не нужно сотрудничать"
  ita_armor.852.c:0 "Нет никого"

  ita_armor.853.t:0 "[ITA.GetName]Предлагается вырезать центральную Европу"
  ita_armor.853.d:0 "Италия пришла к нам с самыми амбициозными планами, чтобы разделить Центральную Европу среди наших сфер влияния и распустить Швейцарию, Австрию и Венгрию. Такой шаг сделает нас мишенью для других великих держав в Европе, а также создаст беспорядки в Европе. Мы достаточно сильны, но готовы ли мы изменить Европу?"
  ita_armor.853.a:0 "Малые государства служат только нашим врагам."
  ita_armor.853.b:0 "Наши интересы не одинаковы"

  ita_armor.854.t:0 "[ITA.GetName]Предлагается вырезать центральную Европу"
  ita_armor.854.d:0 "Италия пришла к нам с самыми амбициозными планами, чтобы разделить Центральную Европу среди наших сфер влияния и распустить Швейцарию, Австрию и Венгрию. Такой шаг сделает нас мишенью для других великих держав в Европе, а также создаст беспорядки в Европе. Мы достаточно сильны, но готовы ли мы изменить Европу?"
  ita_armor.854.a:0 "Малые государства служат только нашим врагам."
  ita_armor.854.b:0 "Мы не согласны, но не можем вмешиваться"
  ita_armor.854.c:0 "Наши интересы не одинаковы"

  ita_armor.855.t:0 "[FROM.GetName] принимает предложение"
  ita_armor.855.d:0 ""
  ita_armor.855.a:0 "Теперь были в легком режиме"

  ita_armor.856.t:0 "[FROM.GetName] отклоняет предложение"
  ita_armor.856.d:0 ""
  ita_armor.856.a:0 "Будем надеяться, что они не помешают"

  ita_armor.857.t:0 "Разрезание Восточной Европы"
  ita_armor.857.d:0 "Наши войска готовы завоевать Восточную Европу."
  ita_armor.857.a:0 "Найти общие цели безопаснее"
  ita_armor.857.b:0 "Нам не нужно сотрудничать"
  ita_armor.857.c:0 "Нет никого"

  ita_armor.858.t:0 "[ITA.GetName]Предлагается вырезать Восточную Европу"
  ita_armor.858.d:0 "Италия пришла к нам с самыми амбициозными планами, чтобы разделить Центральную Европу среди наших сфер влияния и распустить Швейцарию, Австрию и Венгрию. Такой шаг сделает нас мишенью для других великих держав в Европе, а также создаст беспорядки в Европе. Мы достаточно сильны, но готовы ли мы изменить Европу?"
  ita_armor.858.a:0 "Малые государства служат только нашим врагам."
  ita_armor.858.b:0 "Наши интересы не одинаковы"

  ita_armor.859.t:0 "[FROM.GetName] принимает предложение"
  ita_armor.859.d:0 ""
  ita_armor.859.a:0 ""

  ita_armor.860.t:0 "[FROM.GetName] отклоняет предложение"
  ita_armor.860.d:0 ""
  ita_armor.860.a:0 ""

  ita_armor.861.t:0 "[From.GetNameDefCap] приглашает [Root.GetNameDef] в [alliance_inviter.GetFactionName]"
  ita_armor.861.d.a:0 "С подозрительным взглядом на последние события в мировой политике [alliance_inviter.GetNameDef] протягивает нам руку дружбы, предлагая нам свою защиту и призывая нас встать с ними в защиту принципов свободы и демократии. Как член [alliance_inviter.GetFactionName], свобода нашего народа вполне может быть защищена. Чтобы поощрить наше принятие, [alliance_inviter.GetNameDef] предложил нам наши исторические территории Воеводина и Западный Банат."
  ita_armor.861.d.b:0 "Признавая, что иногда даже сильные союзники нуждаются, [alliance_inviter.GetAdjective] пригласил нас присоединиться к [alliance_inviter.GetFactionName]. Если мы решим принять это, это вполне может предоставить нам прекрасную возможность найти свое место под солнцем. Чтобы поощрить наше принятие, [alliance_inviter.GetNameDef] предложил нам наши исторические территории Воеводина и Западный Банат."
  ita_armor.861.d.c:0 "Наши идеологические союзники в [alliance_inviter.GetNameDef] отметили наш ценный вклад в дело рабочих, и сегодня утром мы получили приглашение присоединиться к [alliance_inviter.GetFactionName]. Вместе с другими социалистическими республиками мы могли бы с новой силой распространить революцию. Чтобы поощрить наше принятие, [alliance_inviter.GetNameDef] предложил нам наши исторические территории Воеводина и Западный Банат."
  ita_armor.861.d.e:0 "Похоже, что [alliance_inviter.GetAdjective] считает нас стратегическими интересами для них, и они считают более выгодным, чтобы мы работали вместе, чем чтобы мы позволили себе быть разделенными нашими идеологическими различиями. Сегодня утром посол [alliance_inviter.GetAdjective] пригласил нас стать членом [alliance_inviter.GetFactionName]. Чтобы поощрить наше принятие, [alliance_inviter.GetNameDef] предложил нам наши исторические территории Воеводина и Западный Банат."
  ita_armor.861.a:0 "Мы будем стоять вместе с ними."
  ita_armor.861.b:0 "Нам нужно всего несколько тысяч погибших..."
  ita_armor.861.c:0 "Мы будем сражаться вместе с нашими товарищами!"
  ita_armor.861.e:0 "Это выгодный выбор."
  ita_armor.861.f:0 "Нам лучше без них."
  ita_armor.861.g:0 "У нас уже есть союзники, которые нам нужны."

  ita_armor.862.t:0 "[From.GetNameDefCap] приглашает [Root.GetNameDef] в [alliance_inviter.GetFactionName]"
  ita_armor.862.d.a:0 "С подозрительным взглядом на последние события в мировой политике [alliance_inviter.GetNameDef] протягивает нам руку дружбы, предлагая нам свою защиту и призывая нас встать с ними в защиту принципов свободы и демократии. Как член [alliance_inviter.GetFactionName], свобода нашего народа вполне может быть защищена. Чтобы поощрить наше принятие, [alliance_inviter.GetNameDef] предложил нам наши исторические территории Фракии."
  ita_armor.862.d.b:0 "Признавая, что иногда даже сильные союзники нуждаются, [alliance_inviter.GetAdjective] пригласил нас присоединиться к [alliance_inviter.GetFactionName]. Если мы решим принять это, это вполне может предоставить нам прекрасную возможность найти свое место под солнцем. Чтобы поощрить наше принятие, [alliance_inviter.GetNameDef] предложил нам наши исторические территории Фракии."
  ita_armor.862.d.c:0 "Наши идеологические союзники в [alliance_inviter.GetNameDef] отметили наш ценный вклад в дело рабочих, и сегодня утром мы получили приглашение присоединиться к [alliance_inviter.GetFactionName]. Вместе с другими социалистическими республиками мы могли бы с новой силой распространить революцию. Чтобы поощрить наше принятие, [alliance_inviter.GetNameDef] предложил нам наши исторические территории Фракии."
  ita_armor.862.d.e:0 "Похоже, что [alliance_inviter.GetAdjective] считает нас стратегическими интересами для них, и они считают более выгодным, чтобы мы работали вместе, чем чтобы мы позволили себе быть разделенными нашими идеологическими различиями. Сегодня утром посол [alliance_inviter.GetAdjective] пригласил нас стать членом [alliance_inviter.GetFactionName]. Чтобы поощрить наше принятие, [alliance_inviter.GetNameDef] предложил нам наши исторические территории Фракии."
  ita_armor.862.a:0 "Мы будем стоять вместе с ними."
  ita_armor.862.b:0 "Нам нужно всего несколько тысяч погибших..."
  ita_armor.862.c:0 "Мы будем сражаться вместе с нашими товарищами!"
  ita_armor.862.e:0 "Это выгодный выбор."
  ita_armor.862.f:0 "Нам лучше без них."
  ita_armor.862.g:0 "У нас уже есть союзники, которые нам нужны."


  ita_armor.892.t:0 "Итальянская гражданская война"
  ita_armor.892.d:0 "Оригинальное название: 5: 00 Сегодня утром, ровно через день после потери связи с северными гарнизонами, по всей Испании была начата хорошо подготовленная военная операция с целью получения контроля над всеми правительственными учреждениями и стратегическими местами в крупных городах. Большая часть армии, флота и военно-воздушных сил перестала отвечать на правительственные приказы, в то время как фашистские ополченцы восстали на севере страны. Полный успех этой попытки переворота был предотвращен только оставшейся армией, которая пообещала свою лояльность нашему королю и благодаря быстрым действиям смогла сохранить контроль над Югом и многими другими целями по всей стране. Этот мятеж, как и предсказывали, возглавляет Муссолини, который после побега из тюрьмы замышляет свой захват власти, путь впереди не что иное, как общенациональная гражданская война."
  ita_armor.892.a:0 "Что под руководством нашего короля мы победим!"
  ita_armor.892.b:0 "Что, как единый народ, мы победим!"
  death_to_the_fascists:1 "Смерть фашистам!\n"

  ita_armor.893.t:0 "Увольнение Муссолини"
  ita_armor.893.d:0 "После наших катастрофических поражений многие в нашей партии и стране открыто высказались против продолжения войны. Во главе с фельдмаршалом Пьетро Бадольо и королем Эммануэлем главный адвокат выпустил официальное увольнение Муссолини и фашистского режима. Несомненно, вскоре после этого они планируют подписать перемирие с союзниками. У нас есть два возможных варианта: отказаться и позволить Италии присоединиться к союзникам, предавшим Германию, или собрать оставшихся союзников, предупредить Германию и положить конец этому восстанию. В любом случае наше будущее выглядит мрачно."
  ita_armor.893.a:0 "Мы будем отступать"
  ita_armor.893.b:0 "Мы должны уничтожить предателей!"

  ITA_on_the_brink:0 "§R станет причиной гражданской войны §!"
  ITA_not_on_the_brink:0 "§G Избежит Гражданской войны §!"

  ita_armor.894.t:0 "WW2 подходит к концу"
  ita_armor.894.d:0 "С окончанием WW2 мы можем сосредоточиться на восстановлении. Нашим первым шагом будет возвращение столицы в Рим."
  ita_armor.894.a:0 "Время восстанавливать"

  ita_armor.895.t:0 "Италия требует перемирия"
  ita_armor.895.d:0 "После нашей победы в Северной Африке и вторжения в Италию итальянское правительство свергло Муссолини и осудило фашизм. Теперь они стремятся к перемирию с нами и готовы перейти на другую сторону и сражаться с нами против бывших союзников. Это очень хорошая возможность разорвать союз Оси и навсегда ослабить ось на Средиземноморском театре. Подписав это перемирие, Италия соглашается передать нам контроль над Северной Африкой, а также всей союзной землей под контролем там, а взамен мы отдаем всю землю на итальянском полуострове."
  ita_armor.895.a:0 "Мы можем принять эти условия"
  ita_armor.895.b:0 "Мы принимаем только безоговорочную капитуляцию."

  ita_armor.896.t:0 "Италия обещает лояльность"
  ita_armor.896.d:0 "Мы только что услышали новость о том, что великий итальянский совет арестовал Муссолини и взял под свой контроль итальянское правительство. Хотя этот шаг явно отталкивает Италию от фашизма, новый глава итальянского правительства заверяет нас, что Италия останется верной Оси. Однако было бы абсурдно думать, что итальянцы не пытаются подписать перемирие за закрытыми дверями. Поэтому мы должны немедленно отправить войска в Италию, чтобы обеспечить контроль Оси и подготовить операцию по спасению Муссолини, если итальянцы нападут на нас."
  ita_armor.896.a:0 "Мы видим сквозь их ложь"

  ita_armor.897.t:0 "Союзники подписали перемирие"
  ita_armor.897.d:0 "Союзники согласились с нашими условиями и подписали с нами перемирие. Мы должны немедленно ожидать ответных действий Германии, наша единственная надежда — на наших новых союзников."
  ita_armor.897.a:0 "Превосходно"
  ita_armor.897.b:0 "Мы опоздали..."

  ita_armor.898.t:0 "Союзники отказываются от перемирия"
  ita_armor.898.d:0 "Союзники отвергли наше мирное предложение и заявили, что примут только безоговорочную капитуляцию. Это довольно неожиданно, учитывая, насколько договор благоприятствовал союзникам, но, тем не менее, мы остаемся в ужасном положении, и наша единственная надежда заключается в победе оси."
  ita_armor.898.a:0 "Мы будем сражаться до самой смерти."

  ita_armor.899.t:0 "Конец гражданской войны в Италии"
  ita_armor.899.d:0 "Долгий и кровавый конфликт завершился победой республиканцев. Благодаря этой победе рябь стала трясти фашизм, поскольку его родина была очищена. Основное внимание итальянских народов сосредоточено на восстановлении страны, но еще более важным является решение о том, в каком направлении страна должна двигаться дальше."
  ita_armor.899.a:0 "С силой мы восстанавливаемся"

  jap_armor.800.t:0 "Инцидент на мосту Марко Поло"
  jap_armor.800.d:0 "Японские солдаты готовятся к наступлению на стратегический мост Марко Поло по приказу наших военных генералов без разрешения правительства. при полной поддержке японской армии у нас остается только два очень сложных варианта, но выбор очевиден..."
  jap_armor.800.a:0 "У нас нет выбора"
  jap_armor.800.b:0 "Заставить их развернуться"

  JAP_ask_for_peace_USA_TT:0 "Должен контролировать все союзные тихоокеанские острова и территорию в Океании."

  jap_armor.801.t:0 "Япония предлагает мир"
  jap_armor.801.d:0 "Япония пришла к нам с мирным соглашением о прекращении военных действий на Тихом океане. После японских побед на тихоокеанских островах и завоевания Океании у них есть очень прочный плацдарм, в котором можно отразить любые атаки со стороны нас. Хотя победа не является невозможной и мы не готовы сдаться, несколько лет мира могут дать нам время для восстановления нашего флота и армий для нового вторжения в Тихий океан."
  jap_armor.801.a:0 "Мы принимаем"
  jap_armor.801.b:0 "Мы никогда не примем поражение."

  jap_armor.802.t:0 "Союзники остаются непоколебимыми"
  jap_armor.802.d:0 "Даже с нашими огромными достижениями на Тихом океане союзники не принимают наши мирные условия. Возможно, есть планы вторжения, о которых мы не знаем, или они просто обмануты. Какой бы ни была причина, похоже, что только вторжение в Соединенные Штаты и победа оси в Европе могут принести мир сейчас."
  jap_armor.802.a:0 "Мы победим"

  jap_armor.810.t:0 "Инцидент в Ояме"
  jap_armor.810.d:0 "Вскоре после события Марко-Поло в Шанхае произошел еще один инцидент, в результате которого от рук китайцев погиб японский лейтенант. Поскольку наши попытки деэскалации ситуации потерпели неудачу, японская армия запросила немедленную отправку подкреплений, если китайцы не уйдут из Шанхая.."
  jap_armor.810.a:0 "На этот раз мы готовы"

  jap_armor.812:0 "Китай отказался от соглашения He-Umezu"
  jap_armor.812.d:0 "Китай начал свой путь возвращения Севера, что привело к прямому конфликту с нашими холдингами в Восточном Хэбэе. Вопреки нашему Соглашению они вернули войска КМТ обратно в регион Шаньдун/Хэбэй и требуют от нас отказаться от наших китайских владений. Наши военные готовы, если мы будем соблюдать условия соглашения и противостоять Китаю на границе. Скорее всего, это приведет к войне. Если мы когда-нибудь даже рассмотрим возможность подписания соглашения, кто знает, послушают ли наши военные..."
  jap_armor.812.a:0 "Это нарушение не будет допускаться"
  jap_armor.812.b:0 "Пора уходить из Китая"

  jap_armor.813.t:0 "Япония предлагает мир"
  jap_armor.813.d:0 "Когда Япония завоевала наш Дальний Восток, мы больше не можем надеяться отвоевать наши потерянные земли, которые лежат за пределами труднопроходимой местности и недоступны для нашего флота. С этим мирным соглашением мы уступим наши дальневосточные территории и Монголию Японии, отрезав наш доступ к Тихому океану. Это, несомненно, трагический результат... возможно, несколько лет мира могут помочь нам восстановиться, чтобы подготовить нашу месть и окончательную победу над Японией."
  jap_armor.813.a:0 "Сейчас у нас будет мир..."
  jap_armor.813.b:0 "Мы никогда не примем поражение."

  jap_armor.814.t:0 "Переворот молодых офицеров подавлен"
  jap_armor.814.desc:0 "Группе молодых офицеров не удалось захватить власть. Однако было убито много офицеров и политиков, а также бывших премьер-министров. Атаки на город Токио и Императорский дворец потрясли нас, но быстрые действия Сугиямы, сплотившего большие силы против повстанцев, предотвратили дальнейшую эскалацию. В сочетании с указом Императора о том, что повстанческая армия должна сдаться, у повстанцев было мало надежды на успех, и многие впоследствии покончили жизнь самоубийством."
  jap_armor.814.a:0 "Наша воля непоколебима"

  jap_armor.815.t:0 "Катастрофа молодого офицера"
  jap_armor.815.desc:0 "Группа молодых офицеров не смогла взять на себя управление нынешним правительством. Однако многие офицеры и политики были убиты, а также бывшие премьер-министры. Нападения на Токийский город и Императорский дворец оставили нацию потрясенной большим ущербом и боевыми действиями, несмотря на указ императора о том, что повстанческая армия должна сдаться, его воля не могла пройти к повстанческой армии и без единого ответа последовала кровавая баня."
  jap_armor.815.a:0 "Наши военные были разобщены"

  jap_armor.816.t:0 "[MEN.GetName] запрашивает контроль над [927.GetName]"
  jap_armor.817.t:0 "[MEN.GetName] запрашивает контроль над [621.GetName]"
  jap_armor.818.t:0 "[MEN.GetName] запрашивает контроль над [941.GetName]"
  jap_armor.819.t:0 "[MEN.GetName] запрашивает контроль над [926.GetName]"
  jap_armor.820.t:0 "[MEN.GetName] запрашивает контроль над [746.GetName]"
  jap_armor.821.t:0 "[MEN.GetName] запрашивает контроль над [948.GetName]"
  jap_armor.822.t:0 "[MEN.GetName] запрашивает контроль над [756.GetName]"
  jap_armor.823.t:0 "[MEN.GetName] запрашивает контроль над [788.GetName]"
  jap_armor.824.t:0 "[MEN.GetName] запрашивает контроль над [330.GetName]"
  jap_armor.825.t:0 "[MEN.GetName] запрашивает контроль над [789.GetName]"
  jap_armor.816.d:0 "Менцзяну были обещаны все монгольские территории, когда он присоединился к нам против китайцев, было бы мудро, если бы мы почтили нашу договоренность, предоставив им обещанную землю, которую мы только что взяли."
  jap_armor.816.a:0 "Мы дадим им это"
  jap_armor.816.b:0 "Мы выполним требования позже."

  jap_armor.826.t:0 "Сиамский вопрос"
  jap_armor.826.d:0 "Благодаря нашему недавнему союзу с Сиамом мы обладаем абсолютной властью над ними. Чтобы лучше служить Сфере совместного процветания Восточной Азии, мы можем либо превратить их в одного из наших подданных, либо сделать полное вторжение, чтобы привести Сиам в Японскую империю."
  jap_armor.826.a:0 "Сделайте их нашей темой"
  jap_armor.826.b:0 "полностью включить их в состав империи."

  jap_armor.827.t:0 "[MAN.GetName] предложил создать правительство национального сотрудничества"
  jap_armor.827.d:0 "Теперь, когда реорганизованное национальное правительство Китая полностью создано, Пуйи предложил объединить две страны, чтобы лучше организовать китайскую промышленность и выполнить обещание, которое мы дали ему, став императором Китая. Если мы примем это предложение, это, несомненно, приведет к более сильной китайской марионетке, но может открыть дверь для более автономного государства."
  jap_armor.827.a:0 "Китай должен оставаться расколотым"
  jap_armor.827.b:0 "Сильный Китай — сильная Япония"

  jap_armor.828.t:0 "[JAP.GetName] отказался от правительства национального сотрудничества"
  jap_armor.828.d:0 "Япония, вероятно, опасаясь сильного Китая, не дала нам головы в этом объединении."
  jap_armor.828.a:0 "Наше будущее в Японии"

  jap_armor.829.t:0 "[JAP.GetName]Утверждает Правительство национального сотрудничества"
  jap_armor.829.d:0 ""
  jap_armor.829.a:0 "Превосходно"


  ss_recruitment_event.9.t:0 "Рекрутинговая кампания в Германии"
  ss_recruitment_event.9.desc:0 "В этой титанической борьбе за национальное выживание мы должны использовать все активы и все преимущества. СС хочет вербовать непосредственно из отечества, где есть много тех, кто с радостью взял бы в руки оружие и сражался бы на нашей стороне против угрозы глобального большевизма.\n\nВ то время как Вермахт в принципе согласен с тем, что набор подходящих добровольцев может быть полезен, Генералы ОКВ очень твердо убеждены в том, что любые иностранные добровольцы должны подчиняться военному, а не эсэсовскому командованию."
  ss_recruitment_event.9.a:0 "Теперь у нас есть своя личная армия."


  ger_armor.001.t:0 "Офицеры вермахта бросают вызов Гитлеру"
  ger_armor.001.d:0 "Скрытое недовольство правлением Гитлера достигло апогея с нынешним кризисом, вызванным шагом администрации по ремилитаризации Рейнской области. Ряд генералов вермахта сплотились вокруг известного фельдмаршала Августа фон Макенсена, который ввел в действие планы, направленные на свержение Гитлера и удаление нацистской партии из Германии. Поскольку раскол в немецком высшем командовании становится очевидным даже за рубежом, иностранные державы решили не протестовать против ремилитаризации, более обеспокоенной растущей внутренней немецкой нестабильностью. Стареющий фельдмаршал быстро сдвинулся с места, уже создав временное правительство, к которому стекались десятки противников нацистского правительства. \n\n Военный переворот уже идет полным ходом."
  ger_armor.001.a:0 "Избавьтесь от этих нацистских подонков с наших земель!"

  ger_armor.857.t:0 "Гитлер найден мертвым"
  ger_armor.857.d:0 "С потерей Берлина Гитлер, непреклонно повторявший, что он не оставит город, решил покончить с собой, предпочтя смерть наблюдению за тем, как антифашистские элементы захватывают власть в стране.Вместо него Карл Дениц теперь возглавил Германию, надеясь спасти армию и нацию, он советует вести переговоры о частичной сдаче ее врагам вместо капитуляции"
  ger_armor.857.a:0 "Мы потеряли всякую надежду"

  ger_armor.858.t:0 "Советский Союз требует Востока"
  ger_armor.858.d:0 "Советский Союз стремится подтвердить претензии на Восточную Польшу после того, как мы их завоевали, предполагая, что новая Европа принадлежит как Германии, так и Советскому Союзу. Такие высокие требования подкреплены возможным применением силы. Похоже, наша агрессивность на востоке заставила коммунистов опасаться, что мы можем напасть на них следующими. Обычно уступить большевикам было бы легко, но Советский Союз далеко не единственная наша забота. Если мы согласимся с их требованиями, это может дать нам время для борьбы с Западом, хотя это также значительно расставит восточный фронт дальше на запад."
  ger_armor.858.a:0 "Откажитесь от Востока мирно."
  ger_armor.858.b:0 "Мы предъявляем требования"

  ger_armor.859.t:0 "Амбициозный Porsche"
  ger_armor.859.d:0 "В будущем новые танки Tiger будут иметь дизайн Henschel, а не Porsche. Это не помешало Porsche уже начать производство своей версии Tiger, и теперь у нас есть корпуса 50, которые в настоящее время не используются."
  ger_armor.859.a:0 "Мы должны превратить их в тяжелые танки."

  ger_armor.860.t:0 "Новый тяжелый танк-разрушитель"
  ger_armor.860.d:0 "Фердинанд Порше вернулся к нам с завершенным дизайном нового эсминца для тяжелых танков на основе их корпусов Tiger. Он способен оснащаться более длинным 88mm и имеет толстую броню, но его надежность вызывает сомнения в его эффективности."
  ger_armor.860.a:0 "Мы назовем их в честь Фердинанда."
  ger_armor.860.a_tt:0 "Добавить технологию§YФердинанд§!и добавить§G50§!Фердинанд к запасам"

  ger_armor.861.t:0 "Амбициозный Porsche"
  ger_armor.861.d:0 "В будущем новые танки Tiger будут иметь дизайн Porsche, а не Henschel. До нашего решения Porsche уже начал производство своей версии Tiger, и теперь у нас есть корпуса 50. К счастью для нас, это означает, что у нас есть готовые танки 50, и мы можем официально начать производство с бонусом к эффективности."
  ger_armor.861.a:0 "К счастью для нас"

  ger_armor.862.t:0 "Зачем умирать за Данцига?"
  ger_armor.862.d:0 "С нашим продвижением вперед война была объявлена Польше, и началось завоевание немецкой территории. Как бы мы ни были шокированы, союзники выполнили свои обязательства и в ответ объявили нам войну. Это приводит к тому, что большая часть наших войск оказывается на польской границе, и у нас нет планов продолжать войну за Польшу. Нам потребуется некоторое время, чтобы организовать наше высшее командование для продолжения борьбы."
  ger_armor.862.a:0 "Если они хотят войны, мы ее отдадим."

  ger_armor.863.t:0 "Германия предлагает мир"
  ger_armor.863.d:0 "С достижением оси полной победы в Европе и с Советским Союзом в руинах Германия предлагает союзникам мирные условия. К сожалению, без какого-либо важного плацдарма в Европе наши шансы на победу невелики, и, возможно, несколько лет мира могут помочь нам подготовиться к возможной победе над Осью."
  ger_armor.863.a:0 "Мы принимаем"
  ger_armor.863.b:0 "Мы никогда не примем поражение."

  ger_armor.864.t:0 "Союзники непреклонны"
  ger_armor.864.d:0 "Даже при полной победе США готовы вести войну против нас. Хотя полномасштабное вторжение из них не исключено, оно крайне маловероятно, и вместо этого мы должны начать подготовку к вторжению в США."
  ger_armor.864.a:0 "Глупцы"



  ger_armor.866.t:0 "Германия предлагает прекратить огонь"
  ger_armor.866.d:0 "С толчком оси мы миновали Урал, отняв почти всю нашу промышленность, мы не можем продолжать военные усилия, что бы мы ни делали, мы не можем надеяться вернуть наши потерянные территории. Германия предложила прекратить огонь, позволив нам оставить все к востоку от Урала в обмен на прекращение боевых действий. Наши шансы на победу на этом этапе невелики, и, честно говоря, мы не получим лучших условий, чем это... Возможно, несколько лет мира могут помочь нам восстановиться, чтобы подготовить нашу месть и окончательную победу против оси."
  ger_armor.866.a:0 "Сейчас у нас будет мир..."
  ger_armor.866.b:0 "Мы никогда не примем поражение."

  ger_armor.867.t:0 "Советские непокорные"
  ger_armor.867.d:0 ""
  ger_armor.867.a:0 "Глупцы"

  ger_armor.801.t:0 "Германия предложила союз"
  ger_armor.801.d:0 "После наших территориальных потерь в зимней войне немцы обратились к нам с приглашением присоединиться к их фракции. С вторжением в Советский Союз нам была предоставлена возможность вернуть наши земли и расширить наше влияние на всю Северную Скандинавию. Это прекрасная возможность, но мы должны быть уверены, что Германия победит. Есть также шанс, что, если мы не примем, мы будем открываться для вторжения в Оси в будущем. Каким бы ни было наше решение, после него пути назад нет..."
  ger_armor.801.a:0 "Мы примем их предложение"
  ger_armor.801.b:0 "Мы не будем втягиваться в новую войну."

  ger_armor.802.t:0 "Финляндия присоединилась к оси"
  ger_armor.802.d:0 "Хотя между нашими правительствами есть разногласия, наша цель та же — уничтожение советского бедствия. Наши отношения затянулись еще до Зимней войны, и нашим народам пора объединиться против Советов, чтобы восстановить и установить то, что по праву должно быть. Немцы предлагают союз против Советского Союза ради величия наших народов и для того, чтобы отомстить за тех, кто был потерян для Советов."
  ger_armor.802.a:0 "Мы обещали отомстить"

  ger_armor.803.t:0 "Финляндия отказалась от нашего предложения"
  ger_armor.803.d:0 "Финны отказались и остаются нейтральными по отношению к тем, кто когда-то их обидел. Как могло их правительство быть настолько слабым, чтобы не воспользоваться возможностью отомстить им!"
  ger_armor.803.a:0 "Мы должны удвоить наши усилия на Севере."

  ger_armor.804.t:0 "Смерть Вальтера фон Рейхенау"
  ger_armor.804.d:0 "3 дня назад у Рейхенау произошло кровоизлияние в мозг после охоты под Полтавой при 40-градусном морозе, а сегодня он умер во время перелёта из Полтавы в Лейпциг на лечение."
  ger_armor.804.a:0 "Мы будем оплакивать эту потерю"
  GER_friedrich_paulus_available_tt:0 "§YФридрих Паулюс§! будет доступен в качестве генерала"

  ger_armor.805.t:0 "Смерть Фрица Тодта"
  ger_armor.805.d:0 "8 февраля 1942 года, вскоре после взлета с аэродрома Вольфшанце под Растенбургом в Восточной Пруссии, самолет Тодта внезапно разбился.\n\nВ Берлине были проведены полные похороны, и теперь партия ищет замену в качестве нового министра вооружений. Многие смотрят на Альберта Шпеера как на многообещающего и амбициозного человека, который хорошо подходит для этой роли."
  ger_armor.805.a:0 "Мы будем оплакивать эту потерю"

  ger_armor.806.t:0 "Смерть Эрнста Удета"
  ger_armor.806.d:0 "После неудач воздушного блицкрига против Великобритании руководство Третьего Рейха поняло изъяны основной ставки на авиацию тактический поддержки сухопутных войск и Геринг, обвиняя во всех бедах, ограничил полномочия Удета. После нападения на СССР, Эрнст Удет, генерал-полковник авиации, ощущая неспособность обеспечить ведение воздушной войны на два фронта, покончил с собой 17 ноября 1941 года."
  ger_armor.806.a:0 "Мы будем оплакивать эту потерю"

  ger_armor.807.t:0 "Германия приглашает нас на ось"
  ger_armor.807.d:0 "С войной, бушующей на Балканах, Германия обратилась к нам за согласием с обещаниями новой земли для нас, чтобы владеть от Греции и Югославии, если мы присоединимся к оси."
  ger_armor.807.a:0 "Мы принимаем их приглашение"
  ger_armor.807.b:0 "Мы должны оставаться нейтральными"

  ger_armor.808.t:0 "Болгария сокращается"
  ger_armor.808.d:0 "Болгария отвергла наше предложение, и новый Балканский фронт вряд ли откроется, если мы не заставим его сделать это."
  ger_armor.808.a:0 "Мы предоставили им простой вариант."
  ger_armor.808.b:0 "Вероятно, для лучшего"

  ger_armor.809.t:0 "[JAP.GetName] предлагает исследовательский обмен"
  ger_armor.809.d:0 "Япония просит об обмене технологиями, чтобы помочь модернизировать наш флот и помочь модернизировать их армию."
  ger_armor.809.a:0 "Мы принимаем их предложение"
  ger_armor.809.b:0 "Нам не нужен такой обмен."

  ger_armor.810.t:0 "[GER.GetName]Принимает исследовательский обмен"
  ger_armor.810.d:0 ""
  ger_armor.810.a:0 "Превосходно"

  ger_armor.811.t:0 "[GER.GetName]Отклоняет исследовательский обмен"
  ger_armor.811.d:0 ""
  ger_armor.811.a:0 "Позор"

  ger_armor.812.t:0 "Рудольф Гесс спасен"
  ger_armor.812.d:0 "С нашим глубоким натиском на Великобританию наши солдаты наткнулись на тюремную камеру, в которой находится наш бывший глава партии Рудольф Гесс. Он казался восторженным, когда мы взяли под свой контроль здание, ссылаясь на немецкую славу и превосходство препятствовавшего года Рейха, но нельзя забывать о его действиях после падения Франции. Теперь остается вопрос, что с ним делать?"
  ger_armor.812.a:0 "Мы не можем смотреть мимо его действий."
  ger_armor.812.b:0 "Мы должны восстановить его звание."

  ger_armor.813.t:0 "[GER.GetName] требует Эльзаса Лоррейна"
  ger_armor.813.d:0 "Германия находится на пути к возвращению своей былой славы, и это ставит их в прямой конфликт с нами. В настоящее время они смотрят на Эльзас Лоррейн, законную французскую территорию, которой когда-то владели немцы. Нам выдвинули ультиматум, отдали землю или вступили в войну."
  ger_armor.813.a:0 "Пока это служит нашим интересам."
  ger_armor.813.b:0 "Это возмутительный запрос"

  ger_armor.814.t:0 "[FRA.GetName] передаёт Alsace Lorraine"
  ger_armor.814.d:0 "Франция считает бесплодным воевать с нами"
  ger_armor.814.a:0 "Сюрприз, чтобы быть уверенным, но добро пожаловать"

  ger_armor.815.t:0 "[FRA.GetName] отклоняет наш запрос"
  ger_armor.815.d:0 ""
  ger_armor.815.a:0 "Тогда мы заберем его силой."

  ger_armor.816.t:0 "[From.GetName] предлагает экономическую интеграцию"
  ger_armor.816.d:0 "Поскольку мы уже тесно переплетены, [From.GetNameDef] выступил с предложением помочь нам в расширении нашей военной экономики путем более полной интеграции наших экономик. Это очень помогло бы и нашему военному росту, и сблизило бы наши страны."
  ger_armor.816.a:0 "Отличная идея"
  ger_armor.816.b:0 "Мы думаем, что нет"

  ger_armor.817.t:0 "[From.GetName] принимает экономическую интеграцию"
  ger_armor.817.d:0 "Правительство [From.GetAdjective] сообщает нам, что они принимают наше предложение по интеграции наших военных экономик."
  ger_armor.817.a:0 "Под нашей опекой их армии разбухнут."

  ger_armor.818.t:0 "[From.GetName] отказывается от экономической интеграции"
  ger_armor.818.d:0 "Правительство [From.GetAdjective] сообщает нам, что они отвергают наше предложение об интеграции наших военных экономик."
  ger_armor.818.a:0 "Они отвергают величие!"

  ger_armor.819.t:0 "Выбор нового главы вермахта"
  ger_armor.819.d:0 "Наш первый шаг в обеспечении безопасности нашей нации - это реформирование и денацизм нашей армии. С очищением СС у нас есть три кандидата, которые могут справиться с задачей и помочь принести славу нашей новой армии."
  ger_armor.819.a:0 "Людвиг Бек оказался верным"
  ger_armor.819.b:0 "Франц Холдер может стать интересным"
  ger_armor.819.c:0 "Вальтер фон Браухич будет хорошим вариантом"

  ger_armor.820.t:0 "Выбор новой главы люфтваффе"
  ger_armor.820.d:0 "Наш люфтваффе был заражен эго Геринга, ниже приведены два кандидата, которые помогут вернуть честь люфтваффе и сделать его грозным мечом Германии."
  ger_armor.820.a:0 "Альберт Кессельринг – хороший кандидат"
  ger_armor.820.b:0 "Риттер фон Грейм может работать"

  ger_armor.821.t:0 "Выбираем новую голову кригсмарина"
  ger_armor.821.d:0 "Кригсмарин оказался верным Германии, а не нацистам. Они — гордость Германии, и мы должны выбрать кандидата, который поможет управлять ими в этом новом будущем."
  ger_armor.821.a:0 "Эрих Редер уничтожит флот"
  ger_armor.821.b:0 "Карл Дониц может нанести ущерб"

  ger_armor.823.t:0 "Объявление о 4-летнем плане"
  ger_armor.823.d:0 "Экономическое чудо Германского рейха поразило не только немецкий народ, но и международное сообщество, нам нужно встать на путь экономической организации, и Адольф Гитлер объявил о плане, который должен быть реализован в течение следующих четырех лет. Целью этого плана будет установления контроля над экономикой, а также устранение разногласий внутри министерства экономики между Яльмаром Шахтом и Германом Герингом."
  ger_armor.823.a:0 "Путь к величию!"

  ger_armor.824.t:0 "Немецкая взаимная помощь"
  ger_armor.824.d:0 "Германия хочет получить эксклюзивные права на материалы, которые мы производим. Взамен они позволят нам иметь исключительные права на их ресурсы. По сути, это беспроигрышная ситуация."
  ger_armor.824.a:0 "Мы принимаем эти условия"
  ger_armor.824.b:0 "Нет, спасибо, все будет хорошо."

  ger_armor.825.t:0 "Италия принимает"
  ger_armor.825.d:0 "Италия согласилась с нашими условиями, и между нашими странами открылась более свободная торговля, и инвесторы уже открылись в Южном Тироле. Надеюсь, это позволит обеим нашим странам помогать друг другу в перевооружении."
  ger_armor.825.a:0 "Превосходно"

  ger_armor.826.t:0 "Италия снижается"
  ger_armor.826.d:0 "Итальянцы отклонили наше предложение и дистанцировались от Германии. Это может означать только то, что они не хотят присоединяться к нам и, возможно, ищут политику, которая будет противоречить нашим планам."
  ger_armor.826.a:0 "Мы должны внимательно следить за ними."

  ger_armor.836.t:0 "Поддержка Циндао"
  ger_armor.836.d:0 "Германский рейх обратился к нам с предложением о дальнейшей поддержке с помощью танков и пехоты, как бы западные державы ни просили нас передать контроль над портовым городом Циндао. Хотя мысль об отказе от дальнейшей территории немыслима, она предотвратит попадание ее в руки японцев, если начнется война."
  ger_armor.836.e:0 "Германский рейх обратился к нам с предложением о дальнейшей поддержке с помощью танков и пехоты, как бы западные державы ни просили нас передать контроль над портовым городом Циндао. Хотя это противоречит нашей цели японской гегемонии, наличие союзника за пределами Японии может оказаться очень ценным."
  ger_armor.836.a:0 "Мы можем договориться об этом"
  ger_armor.836.b:0 "Неприемлемо"

  ger_armor.837.t:0 "Китай поддерживает Циндао"
  ger_armor.837.d:0 "Китай согласился на наше предложение, и в настоящее время осуществляются немедленные поставки оборудования в Китай. Территория за пределами Германии является большим национальным достижением и показала миру, что Рейх здесь, чтобы остаться."
  ger_armor.837.a:0 "Китай обладает огромным потенциалом"

  ger_armor.838.t:0 "Китай отказался от поддержки Циндао"
  ger_armor.838.d:0 "Китай решил, что наша поддержка не препятствует отказу от территории, и поэтому отказался принять наше предложение."
  ger_armor.838.a:0 "Они пожалеют об этом"

  ger_armor.839.t:0 "Вторгнуться в Польшу?"
  ger_armor.839.d:0 "Поскольку Польша, похоже, находится на проигравшей стороне в их войне и не имеет крупных союзников, чтобы помочь им, нам была предоставлена прекрасная возможность воспользоваться любыми претензиями, которые мы можем иметь на их страну, прежде чем они попадут в опасные руки."
  ger_armor.839.a:0 "Мы будем защищать немецкий народ."
  ger_armor.839.b:0 "Это слишком рискованно."

  ger_armor.827.t:0 "Германия выдвинула ультиматум"
  ger_armor.827.d:0 "Германия пришла к выводу, что [From.GetName] больше не может функционировать как эффективный член Оси независимо и выдвинула нам ультиматум. Либо принять контроль Германии над нашим правительством и военными, по сути, став марионеткой, либо рискнуть более решительной резолюцией."
  ger_armor.827.a:0 "Они должны уважать нашу силу!"
  ger_armor.827.b:0 "Мы будем торговаться за лучшую позицию."
  ger_armor.827.c:0 "У нас нет другого выбора, кроме как принять"

  ger_armor.828.t:0 "[From.GetName] отказывается"
  ger_armor.828.d:0 "[From.GetName] полностью отвергает ультиматум."
  ger_armor.828.a:0 "Теперь мы прибегаем к силе"
  ger_armor.828.b:0 "Мы отступим"

  ger_armor.829.t:0 "[From.GetName] требует большей автономии"
  ger_armor.829.d:0 "[From.GetName] утверждает, что, хотя мы и правы в своей оценке, они хотели бы запросить больше автономии, чем мы предлагаем."
  ger_armor.829.a:0 "Мы позволим этому"
  ger_armor.829.b:0 "Мы принимаем только полный контроль."

  ger_armor.830.t:0 "[From.GetName] соглашается"
  ger_armor.830.d:0 "[From.GetName] считает, что ситуация нестабильна и ведет к потенциальному кризису. Таким образом, они приняли наш ультиматум в обмен на немедленную военную поддержку."
  ger_armor.830.a:0 "Это для большего блага"

  ger_armor.835.t:0 "Германия отвергает наше предложение"
  ger_armor.835.d:0 "Германия отвергла все, кроме тотального контроля, у нас осталось два варианта."
  ger_armor.835.a:0 "Мы просто не можем принять это."
  ger_armor.835.b:0 "У нас нет другого выбора, кроме как встать на колени."

  germany.98.e:0 "Сделать хорватскую куклу. Вырежьте остальное."
  germany.99.e:0 "Раскол Греции между Болгарией и Италией"

  italy_empire:0 "Итальянская империя"

  ger_armor.831.t:0 "Германия объявляет войну!"
  ger_armor.831.d:0 "Похоже, что Германия хочет пойти на эти абсурдные требования..."
  ger_armor.831.a:0 "Наши шансы невелики"

  ger_armor.832.t:0 "Германия взяла под полный контроль"
  ger_armor.832.d:0 "После нашего ответа Германия поставила нас под удар, и у нас нет другого выбора, кроме как оставаться на поводке. Может быть, есть надежда восстановить нашу автономию, если мы докажем, что способны"
  ger_armor.832.a:0 "Это для большего блага"

  ger_armor.833.t:0 "Германия доминирует"
  ger_armor.833.d:0 "После нашего ответа Германия предоставила нам некоторую автономию и утвердила свой контроль над нашей страной. Может быть, есть надежда восстановить нашу автономию, если мы докажем, что способны"
  ger_armor.833.a:0 "Мы обречены"

  ger_armor.834.t:0 "Германия отступила"
  ger_armor.834.d:0 "Германия признает абсурдность их требований и отступает. Несмотря на то, что мы остаемся союзниками, напряженность стала высокой, и было бы неразумно доверять Германии."
  ger_armor.834.a:0 "Мы избежали катастрофы"

  ger_armor.840.t:0 "Судьба Югославии"
  ger_armor.840.d:0 "Как лидер оси, Германия реорганизовала оккупированную страну Югославию, чтобы успокоить претензии всех своих союзников. Это также привело к созданию нового государства Хорватия для продвижения интересов Гермны."
  ger_armor.840.a:0 "Мы благодарим Германию за поддержку."

  ger_armor.841.t:0 "Судьба Югославии"
  ger_armor.841.d:0 "Как лидер оси, Германия реорганизовала оккупированную страну Югославию, чтобы успокоить претензии всех своих союзников. Это также привело к созданию нового государства Хорватия для продвижения интересов Гермны."
  ger_armor.841.a:0 "Мы благодарим Германию за поддержку."

  ger_armor.842.t:0 "Судьба Югославии"
  ger_armor.842.d:0 "Как лидер оси, Германия реорганизовала оккупированную страну Югославию, чтобы успокоить претензии всех своих союзников. Это также привело к созданию нового государства Хорватия для продвижения интересов Гермны."
  ger_armor.842.a:0 "Нам следовало бы дать больше"

  ger_armor.843.t:0 "Судьба Греции"
  ger_armor.843.d:0 "Как лидер оси, Германия реорганизовала оккупированную страну Грецию, чтобы успокоить претензии всех своих союзников."
  ger_armor.843.a:0 "Мы благодарим Германию за поддержку."

  ger_armor.844.t:0 "Судьба Греции"
  ger_armor.844.d:0 "Как лидер оси, Германия реорганизовала оккупированную страну Грецию, чтобы успокоить претензии всех своих союзников."
  ger_armor.844.a:0 "Мы благодарим Германию за поддержку."

  ger_armor.845.t:0 "[GER.GetName] подталкивает нас к закрытию экономики"
  ger_armor.845.d:0 "Поскольку Германия находится под контролем Норвегии и важного маршрута Нарвика, они дали нам приказ сократить всю торговлю с другими странами, которые не являются частью Оси. Если мы возразим, это будет означать войну."
  ger_armor.845.a:0 "Реального выбора здесь нет."
  ger_armor.845.b:0 "Мы останемся непокорными до конца!"

  ger_armor.846.t:0 "[SWE.GetName]Принять наши требования"
  ger_armor.846.d:0 "Швеция приняла наше предложение и начала накладывать эмбарго на Германию, мы должны защитить их за эту помощь в военных усилиях."
  ger_armor.846.a:0 "Отличные новости"

  ger_armor.847.t:0 "[SWE.GetName]Отклонить наши требования"
  ger_armor.847.d:0 "Шведы отказались, ссылаясь на свой нейтралитет, и продолжают помогать любой стране, которая спрашивает, может ли она помочь в военных усилиях против нас. Наш единственный вариант - вторгнуться."
  ger_armor.847.a:0 "Мы раздавим их через несколько дней."
  ger_armor.847.b:0 "Война со Швецией слишком опасна"

  ger_armor.848.t:0 "Германия требует исключительных поставок вольфрама"
  ger_armor.848.d:0 "После капитуляции Франции Германия господствует в Западной Европе и требует прекратить продажу вольфрама государствам вне Оси. Вольфрам приносит нам огромные доходы, однако открытый отказ от германских требований может поставить под угрозу наш нейтралитет."
  ger_armor.848.a:0 "У нас нет возможности отказать"

  ger_armor.849.t:0 "Португалия принимает наши требования"
  ger_armor.849.d:0 "Лиссабон согласился ограничить внешнюю торговлю. Португальский вольфрам отныне будет служить германской военной промышленности, а не нашим противникам."
  ger_armor.849.a:0 "Превосходно"

  ger_armor.851.t:0 "Германия требует исключительных поставок хрома"
  ger_armor.851.d:0 "После установления контроля над балканскими путями Германия требует прекратить продажу хрома государствам вне Оси. Этот металл критически важен для германского производства вооружений, но выполнение требования поставит под угрозу наши отношения с Великобританией и Соединёнными Штатами."
  ger_armor.851.a:0 "Сохраним нейтралитет ценой уступки"

  ger_armor.852.t:0 "Турция принимает наши требования"
  ger_armor.852.d:0 "Анкара согласилась ограничить внешнюю торговлю. Поставки турецкого хрома германской промышленности теперь защищены от закупок и давления противника."
  ger_armor.852.a:0 "Наша промышленность получит необходимый хром"

  ger_armor.855.t:0 "Португалия прекращает поставки вольфрама"
  ger_armor.855.d:0 "Высадка союзников в Нормандии показала, что германское господство в Западной Европе больше не является неоспоримым. Лиссабон снял ограничения на торговлю с нашими противниками и ввёл эмбарго против всех стран Оси."
  ger_armor.855.a:0 "Португалия ответит за это"

  ger_armor.856.t:0 "Турция прекращает поставки хрома"
  ger_armor.856.d:0 "После утраты Осью всего Крыма Анкара более не считает Германию способной защитить свои позиции в Черноморском регионе. Турция сняла ограничения на торговлю с нашими противниками и ввела эмбарго против всех стран Оси."
  ger_armor.856.a:0 "Мы лишились важнейшего источника хрома"

  ger_armor.400.t:0 "Немецкие войска входят в Прибалтику"
  ger_armor.400.d:0 "Когда немецкие войска вошли в Прибалтику, местное население приветствовало их в надежде восстановить свою независимость. Оккупация при Советах была жестокой, и поэтому многие жители стремятся присоединиться к немцам в их борьбе против Советского Союза."
  ger_armor.400.a:0 "Мы освободим все земли большевистской власти."
  german_entry_baltic:0 "15Соответствие будет добавлено к каждому прибалтийскому государству, когда оно будет завоевано."

  ger_armor.1007.t:0 "Немецкие войска входят в Украину"
  ger_armor.1007.d:0 "Когда немецкие войска вошли на Украину, местное население приветствовало их в надежде получить независимость от Советского Союза, особенно после событий Голодомора. Многие жители стремятся присоединиться к немцам в их борьбе против Советского Союза."
  ger_armor.1007.a:0 "Мы освободим все земли большевистской власти."
  german_entry_ukraine:0 "15Соблюдение будет добавлено к каждому государству Украины, когда они будут завоеваны."

  ger_armor.424.t:0 "Италия просит у Хорватии Далмацию"
  ger_armor.424.d:0 "Итальянское правительство направило нам запрос об их прямой аннексии государства Далмация у нашего балканского марионеточного государства Хорватия. Они утверждают, что, поскольку первоначальное вторжение и последующая оккупация и марионеточное государство были технически сотрудничеством между немецкими и итальянскими силами, то, если они хотят этого государства от Хорватии, они должны получить его."
  ger_armor.424.a:0 "Они вежливо спросили, так что я полагаю"
  ger_armor.424.b:0 "Третьего рейха не должно беспокоить"

  soviet.13.b:0 "Мы должны отступить."

  soviet.65.t:0 "Советский Союз требует аннексии"
  soviet.65.d:0 "Чтобы восполнить стратегическую уступку Японии, Советский Союз требует нашей аннексии."
  soviet.65.a:0 "Давайте вместе строить наше будущее, товарищи."
  soviet.65.b:0 "Лучше мертвый, чем красный!"

  soviet.66.t:0 "Синьцзян согласился"
  soviet.66.d:0 "Правительство Синьцзяна приняло мудрое решение присоединиться к славному Союзу."
  soviet.66.a:0 "Добро пожаловать, товарищи."

  soviet.67.t:0 "Синьцзян отрицает"
  soviet.67.d:0 "Правительство Синьцзяна приняло печальное решение не принимать наше очень щедрое предложение. Как они смеют!"
  soviet.67.a:0 "Никто нам не откажет!"

  soviet.68.t:0 "Советский Союз требует подчинения"
  soviet.68.d:0 "После того, как оставшиеся китайские войска были изгнаны, армия Шэн Шикай и советские войска взяли под свой контроль страну. Коммунисты основали наше новое правительство под сильным советским влиянием. Поскольку мы получили их помощь, они требуют еще большего контроля."
  soviet.68.a:0 "Мы присоединимся к нашим братьям, чтобы отплатить им за их неоценимую помощь."
  soviet.68.b:0 "Мы им ничего не должны!"

  soviet.69.t:0 "Синьцзян согласился"
  soviet.69.d:0 "Правительство Шэн Шикай приняло наше любезное предложение. Это должно быть адекватной оплатой за нашу помощь."
  soviet.69.a:0 "Союз становится все больше!"

  soviet.70.t:0 "Синьцзян отрицает"
  soviet.70.d:0 "Правительство Шэн Шикай отклонило наше предложение о членстве в Союзе. Они утверждают, что мы уже полностью погашены."
  soviet.70.a:0 "Они заплатят. Так или иначе."

  soviet.71.t:0 "США одобрили аренду еды для нас"
  soviet.71.d:0 "Вашингтон объявил, что они одобрили кредитную аренду столь необходимого продовольствия, чтобы помочь в нашей Славной борьбе. В течение ближайших нескольких лет для питания населения Советского Союза будет поставлено более тонн продовольствия 3,000, 000. Голодомор уже уничтожил нашу способность производить пищу. С потерей украинских территорий кровожадным немцам мы не смогли бы продержаться без помощи капиталистов."
  soviet.71.a:0 "Очень щедрые американцы"

  soviet.72.t:0 "США планируют построить железные дороги"
  soviet.72.d:0 "Вашингтон объявил, что они одобрили кредитную аренду и назначение инженеров в Советский Союз для строительства и модернизации нашей железнодорожной сети. Поскольку большинство районов с высокой инфраструктурой в Европе были захвачены нацистами, мы отчаянно нуждаемся в цепочках поставок между Москвой и промышленными комплексами на Урале. США планируют удвоить количество железных дорог в Советском Союзе, чтобы мы могли адекватно реагировать на фашистскую угрозу."
  soviet.72.a:0 "Отправить комментарий к FDR"

  soviet.73.t:0 "США планируют обеспечить нас топливом"
  soviet.73.d:0 "Вашингтон объявил, что одобрил аренду высокооктанового топлива для наших самолетов. Хотя мы продолжаем производить большую часть нефти и топлива, которые нам нужны, наши методы очистки отсутствуют. Поскольку мы не в состоянии производить высококачественное и высокооктановое топливо, необходимое для современных самолетов, США вступают, чтобы помочь нам. Поскольку они планируют обеспечить более половины нашего авиатоплива за счет строительства для нас нефтеперерабатывающих заводов, мы сможем производить соответствующее топливо, необходимое для уничтожения люфтваффе."
  soviet.73.a:0 "Довольно внимательные капиталисты"

  soviet.74.t:0 "США одобрили аренду стали и алюминия"
  soviet.74.d:0 "Вашингтон объявил, что одобрил аренду высококачественной стали и алюминия для помощи в Великой Отечественной войне. Пока мы сосредоточены на экстренном массовом производстве военных материалов для оснащения Красной Армии, качество пострадало. К счастью, американцы планировали производить большую часть стальной брони для наших танков и более половины необходимого алюминия авиационного класса. С помощью этих дополнительных ресурсов мы сможем отбиться от нацистского вторжения."
  soviet.74.a:0 "Мы должны дать американцам понять, что мы благодарны."

  soviet.75.t:0 "США планируют предоставить нам гражданские заводы"
  soviet.75.d:0 "Вашингтон объявил, что они одобрили аренду упакованных заводов и назначение инженеров в Советский Союз, чтобы помочь нам улучшить наше гражданское производство. Помогая нам перемещать и строить гражданские заводы, мы можем значительно увеличить темпы восстановления нашей гражданской экономики после первоначального натиска немцев."
  soviet.75.a:0 "Большое спасибо, США"

  soviet.76.t:0 "США планируют предоставить нам военные заводы"
  soviet.76.d:0 "Вашингтон объявил, что они одобрили аренду высококачественного военного производственного оборудования. Благодаря более высокому качеству оборудования и инструментов наше производство будет значительно увеличено. Нам необходимо перепроизводить немцев, если у нас есть шанс победить. С помощью американского промышленного потенциала наша промышленность будет запущена, и мы сможем выиграть войну."
  soviet.76.a:0 "Тост за американцев"

  soviet.77.t:0 "США строят Персидский коридор"
  soviet.77.d:0 "Вашингтон объявил, что одобрил строительство крупной железнодорожной системы в Персии, чтобы помочь напрямую кредитовать аренду через Кавказ, чтобы избежать немецких подводных лодок."
  soviet.77.a:0 "Отличный маршрут для аренды"

  sov_armor.853.t:0 "Германия отступает от Востока"
  sov_armor.853.d:0 "После того, как мы оказали давление на Германию, чтобы она поддалась нашим законным требованиям в отношении Восточной Польши, они согласились уступить то, что мы требовали, без дальнейшего конфликта. Германия – друг Советского Союза"
  sov_armor.853.a:0 "Приветствуем наших польских друзей!"

  sov_armor.854.t:0 "Германия отказалась уступить Восток"
  sov_armor.854.d:0 "Несмотря на наши усилия по мирному урегулированию спора с Германией, они отказались уступить Восточную Польшу. Это ясно показывает их намерение продолжать завоевывать восток, и мы следуем за ними. Мы должны мобилизовать наши силы и решительно надавить на Запад, прежде чем Германия успеет завершить какие-либо приготовления."
  sov_armor.854.a:0 "Нет никаких сомнений"

  sov_armor.800.t:0 "Профессор Евгений Оскарович Патон"
  sov_armor.800.d:0 "Патон был первопроходцем в области технологии соединения и сварки. Чтобы сделать сварку надежным технологическим процессом, необходимо было провести комплексные исследования механики сварных конструкций, связанных с ними металлургических процессов и физики дуги, а также разработать сварочное оборудование, инструменты и приемы. Патон создал методы проектирования рациональных пролетных строений мостов, исследовал условия их эксплуатации, предложил методы восстановления поврежденных мостов. Он провел исследования по основам сварки, расчетам прочности сварных конструкций, механизации сварочных процессов. Руководил разработкой автоматической сварки под флюсом. В годы Великой Отечественной войны руководил разработкой и изготовлением оборудования и технологии для автоматической сварки специальных стали для танков, бомб и другой военной техники."
  sov_armor.800.a:0 "Присвоить ему звание Героя Социалистического Труда!"

  sov_armor.700.t:0 "Бомбардировка Горького"
  sov_armor.700.d:0 "Cерия бомбовых авиаударов со стороны немецкой авиации с осени 1941 привело к разрушению промышленного потенциала города. Наибольшие повреждения получил автомобилестроительный завод им. Молотова. За всё время войны вражеские бомбардировщики совершили 43 налёта, из них 26 налётов ночью. На город было сброшено 33 934 зажигательных бомб и 1631 фугасная."
  sov_armor.700.a:0 "Вот незадача!"

  sov_armor.801.t:0 "Великобритания предложила Ирану вторжение"
  sov_armor.801.d:0 "Великобритания предлагает совместные усилия по оккупации Ирана, чтобы лишить Германию и ее союзников доступа к ее запасам нефти. В случае успеха мы займем север, соединяющий Кавказ с Центральной Азией, а британцы — юг."
  sov_armor.801.a:0 "Мы принимаем эти планы"
  sov_armor.801.b:0 "Мы не можем пощадить рабочую силу"

  sov_armor.804.t:0 "Социалистический реализм"
  sov_armor.804.d:0 "Наше Министерство культуры стремилось к тому, чтобы мы могли контролировать не только наше искусство, но и нашу музыку и культуру в целом, чтобы сосредоточиться на самом главном, на повседневном пролетариате. Социалистический реализм покажет труд мужчин и женщин, чья работа сделала Советский Союз такой страной, какой она является сегодня, и помогла продолжить идеалы коммунизма. Благодаря нашему партнерству с Ассоциацией художников революционной России, Обществом художников-станковистов и Союзом советских писателей мы можем продвигать нашу культуру, побуждая наших людей продвигать вперед нашу нацию. Нам нужно определить, на какой области должно быть сосредоточено наше искусство."
  sov_armor.804.a:0 "Вдохновить рабочих"
  sov_armor.804.b:0 "Вдохновить народ"
  sov_armor.804.c:0 "Вдохновить армию"
  sov_armor.804.e:0 "Вдохновить партизан"

  sov_armor.809.t:0 "Возвращение Западной Белоруссии и Украины"
  sov_armor.809.d:0 "Нашими недавними победами мы вернули себе территорию, утраченную в результате войны с поляками, и снова включили этот регион в союз. Давайте поприветствуем наших освобожденных рабочих!"
  sov_armor.809.a:0 "Добро пожаловать в Союз, товарищи!"

  sov_armor.817.t:0 "Набрано 10 резервных дивизий"
  sov_armor.817.d:0 "Не расширяя нашу постоянную армию, наши офицеры выполнили задачу подготовки 100 тысяч человек для использования в наших резервах. Эти люди будут жизненно необходимы в случае начала войны, когда нам потребуется срочное расширение армии."
  sov_armor.817.a:0 "Превосходно"
  sov_armor.817.b:0 "Продолжить подготовку резервистов"

  sov_armor.851.t:0 "[SOV.GetName] предлагает мир"
  sov_armor.851.d:0 "После долгих месяцев войны обеим сторонам было нанесено много кровопролития с бессмысленными выгодами. Советы заявляют, что пришло время прекратить военные действия и отступить к границам каждой страны. Это огромная победа для нас и доказывает, что Финляндия может противостоять даже могуществу гигантского медведя!"
  sov_armor.851.a:0 "Мы добились победы!"

  sov_armor.820.t:0 "Талантливые новые рабочие"
  sov_armor.820.d:0 "По мере роста нашей промышленности, наш персонал становится все более и более способным в наш век индустриализации и выполняет свои обязанности на хорошем уровне. Со временем все больше и больше рабочих приобретают опыт, и мы можем в полной мере использовать нашу крупную промышленность."
  sov_armor.820.a:0 "Восхитительно"
  sov_armor.820.a_tt:0 "Уменьшает штраф от §YНизкоквалифицорованных рабочих§!"

  sov_armor.830.t:0 "Восстановление производства"
  sov_armor.830.d:0 "По мере эвакуации промышленности, наши военные заводы налаживают выпуск военной техники необходимой для ведения войны. Со временем все больше и больше предприятий выходят на высокие показатели производительности труда, и мы можем в полной мере использовать наш военнопромышленный комплекс."
  sov_armor.830.a:0 "Принято к сведению"
  sov_armor.830.a_tt:0 "Уменьшает штраф от §YЭвакуации промышленности§!"

  SOV_can_be_infiltrated:0 "§HВнедрение агентуры возможно§!.\n"


  sov_armor.829.t:0 "[SOV.GetAdjective] Победа в Перми"
  sov_armor.829.d:0 "После столкновения сил [SOV.GetAdjective] и [GER.GetAdjective] в приграничной зоне вокруг Перми линия [GER.GetAdjective] сломалась. Подразделения [SOV.GetAdjective] быстро взяли на себя инициативу по отправке партизан, оборудования и поставок через пробелы и созданию антигерманских активистов в Перми."
  sov_armor.829.a:0 "Мы медленно наращиваем нашу контратаку."
  sov_armor.829.b:0 "Мы должны подготовить соответствующий ответ."

