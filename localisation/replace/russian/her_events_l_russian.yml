  zzz.996.t:0 "Страны Бенилюкса передают управление территориями"
  zzz.996.d:0 "В рамках подготовки к вторжению в Европу правительства Бельгии, Люксембурга и Нидерландов согласились после освобождения своих европейских территорий временно передать управление ими Великобритании. Это позволит британцам возводить новые сооружения и эффективно устранять разрушения в ходе наступления."
  zzz.996.a:0 "Мы их не подведём"

  zzz.997.t:0 "Страны Бенилюкса требуют вернуть управление"
  zzz.997.d:0 "После окончания войны в Европе Бельгия, Люксембург и Нидерланды потребовали вернуть им управление европейскими территориями."
  zzz.997.a:0 "Безусловно"

  zzz.998.t:0 "Франция передаёт управление территориями"
  zzz.998.d:0 "В рамках подготовки к вторжению в Европу французское правительство согласилось после освобождения метрополии временно передать управление её территориями Соединённым Штатам. Это позволит американцам возводить новые сооружения и эффективно устранять разрушения в ходе наступления."
  zzz.998.a:0 "Мы их не подведём"

  zzz.999.t:0 "Франция требует вернуть управление"
  zzz.999.d:0 "После окончания войны в Европе Франция потребовала вернуть ей управление территориями метрополии."
  zzz.999.a:0 "Безусловно"
