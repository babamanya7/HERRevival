  GER_autobahn_tt:0 "\nРегионы с §GМаксимальным§! уровнем §YИнфраструктуры§!:\nБудет получено §G1§! ед. сооружения §YИнфраструктура§!.\n\nРегионы с уровнем §YИнфраструктуры§! больше §G7§!, но меньше §Gмаксимума§!:\nБудет получено §G2§! ед. сооружения §YИнфраструктура§!.\n\nРегионы уровнем §YИнфраструктуры§! ниже §G7§!:\nБудет получено §G1§! ед. сооружения §YИнфраструктура§!.\n"
