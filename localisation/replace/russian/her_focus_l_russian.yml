  JAP_interservice_rivalry_against_toseiha_1_tt:1 "£faction_jap_toseiha §YФракция контроля§! станет более §RОслабленной§! уменьшая §YПроизводительность заводов§! на §R10%§! и уменьшая §YСкорость строительства заводов§! на §R5%§!\n"

