  SOV_navy_reform_1_tt:0 "$SOV_modify_red_fleet_ns_intro$ \n£attack_texticon  Атака палубной авиации: §G+20.00%§! \n£attack_battleship_texticon  Атака крупных кораблей: §G+10.00%§! \n£defence_battleship_texticon  Броня крупных кораблей: §G+5.00%§! \n£attack_submarine_texticon  Атака подводных лодок: §G+10.00%§! \n£defence_submarine_texticon  Защита подводных лодок: §G+5.00%§! \n£attack_screen_texticon  Атака охранения: §G+10.00%§! \n£defence_screen_texticon  Защита охранения: §G+5.00%§! \n£navy_doctrine_cost_texticon  Стоимость морской доктрины: §G-50.00%§!\n\n"
