  JAP_interservice_rivalry_towards_kantaiha_4_tt:1 "£faction_jap_kantaiha §YФракция флота§! станет более §GУполномоченным§! увеличивая §YПроизводительность верфей§! на §G10%§! и увеличивая §YСкорость строительства верфей§! на §G5%§!, §Yстабильность§! на §G15%§!\n"

  JAP_interservice_rivalry_towards_toseiha_1_tt:1 "£faction_jap_toseiha §YФракция контроля§! станет более §GУполномоченным§! увеличивая §YПроизводительность заводов§! на §G10%§! и увеличивая §YСкорость строительства заводов§! на §G5%§!\n"

  JAP_interservice_rivalry_towards_toseiha_2_tt:1 "£faction_jap_toseiha §YФракция контроля§! станет более §GУполномоченным§! увеличивая §YПроизводительность заводов§! на §G10%§! и увеличивая §YСкорость строительства заводов§! на §G5%§!\n"

  JAP_interservice_rivalry_towards_toseiha_3_tt:1 "£faction_jap_toseiha §YФракция контроля§! станет более §GУполномоченным§! увеличивая §YПроизводительность заводов§! на §G10%§!, увеличивая §YСкорость строительства заводов§! на §G5%§! и §Yстабильность§! на §G10%§!\n"

