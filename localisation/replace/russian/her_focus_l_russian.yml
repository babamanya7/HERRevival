  ENG_centralize_the_merchant_fleet:0 "Централизовать торговый флот"
  ENG_centralize_the_merchant_fleet_desc:0 ""

  ENG_found_the_sas:0 "Найдено SAS"
  ENG_found_the_sas_desc:0 "Офицер по имени Дэвид Стирлинг (David Stirling) придумал идею о том, что небольшое подразделение спецназа может нанести противнику огромный урон. Наименование их «Воздушной службой» имеет дополнительное преимущество, заставляя противника полагать, что он также должен защищаться от десантников. В этой идее вполне могут быть достоинства."

  ENG_who_dares_wins:0 "Кто победит Дарье"
  ENG_who_dares_wins_desc:0 ""

  ENG_unrelenting_persuit_of_excellence:0 "Неумолимое стремление к совершенству"

  ENG_bedrock_of_prosperity:0 "Основы процветания"
  ENG_bedrock_of_prosperity_desc:0 ""
  ENG_bedrock_of_prosperity_tt:0 "Ждал 270 дней, чтобы манифест Мосли принёс свои плоды."
  upper_class_rebellion:0 "Восстание высшего класса"

  ENG_no_further_appeasement_tt:1 "§YШтраф на стабильность уменьшаются на 5% на каждые 5% мировой напряжённости§! после 10%."
  ENG_no_further_appeasement_tt_1:1 "£faction_eng_labour Лейбористы и £faction_eng_conservative консерваторы станут §Rменее дружелюбными§!, снизив §Yстабильность§! на §R15%§!."
  ENG_no_further_appeasement_tt_2:1 "£faction_eng_labour Лейбористы и £faction_eng_conservative консерваторы станут §Rменее дружелюбными§!, снизив §Yстабильность§! на §R10%§!."
  ENG_no_further_appeasement_tt_3:1 "£faction_eng_labour Лейбористы и £faction_eng_conservative консерваторы станут §Rменее дружелюбными§!, снизив §Yстабильность§! на §R15%§!."
  ENG_no_further_appeasement_tt_4:1 "£faction_eng_labour Лейбористы и £faction_eng_conservative консерваторы станут §Rменее дружелюбными§!, снизив §Yстабильность§! на §R20%§!."
  ENG_no_further_appeasement_tt_5:1 "£faction_eng_labour Лейбористы и £faction_eng_conservative консерваторы станут §Rменее дружелюбными§!, снизив §Yстабильность§! на §R25%§!."

  ENG_kickstart_the_war_industry_tt:1 "§Yстабильность Penalties are dependant on the War situation§!."

  uk_mediterranean_focus_tt:0 "§GДаёт решение для улучшения возможностей этих островов.\n§!"

  new_military_projections:0 "Новые военные прогнозы"
  new_military_projections_desc:0 "Наша нынешняя военная организация не отражает новую доктрину, которую мы разрабатываем. Наш начальник штаба рекомендует пересмотреть все аспекты нашей военной стратегии, чтобы следовать нашему процессу перевооружения."
  new_military_projections_tt:1 "Даёт §Yшаблон тяжёлой танковой дивизии§! и §Yшаблон средней танковой дивизии§!.\n"

  shadow_scheme_focus_tt:1 "Даёт §G12§! ячеек для строительства и §Y12 военных заводов§! всего в трёх регионах, когда начинается война.\n"
  CAN_shadow_scheme_focus_tt:1 "Даёт §G6§! ячеек для строительства и §Y6 военных заводов§! всего в трёх регионах, когда начинается война.\n"

  USA_call_up_the_national_guard:0 "Вызвать Национальную гвардию"
  USA_call_up_the_national_guard_desc:0 "Будет развертываться и обходить автоматически, если война"
  national_guard_tt:1 "развертывать§G18§!§YДивизии Национальной гвардии§!по всем штатам.\n"
  national_guard_deployed:0 "Национальная гвардия уже развернута"

  USA_progress_the_wpa:0 "Продолжить УОР"
  USA_progress_the_wpa_desc:0 "Мы должны продолжить WPA и сосредоточиться на общественных парках, общественных зданиях, коммунальных услугах, аэропортах и транспорте. Также должен быть создан федеральный писательский проект."

  USA_modernize_the_army:0 "Модернизировать армию"
  USA_modernize_the_army_desc:0 "Наша армия плохо подготовлена и до сих пор сражается тактикой Великой войны. Мы консультировались с нашими инженерами и тактиками, чтобы улучшить наше понимание этих новых военных машин."

  USA_restructure_the_national_army:0 "Реструктурировать национальную армию"
  USA_restructure_the_national_army_desc:0 "Наша армия десятилетиями пребывала в состоянии застоя и спячки. Пришло время начать реструктуризацию армии, чтобы новые рекруты могли быть приведены в лоно."

  USA_USACE_investments:0 "Инженерные войска США"
  USA_USACE_investments_desc:0 "Инженерный корпус армии США имеет богатую историю в Соединенных Штатах в строительных проектах как в мирное, так и в военное время. Поскольку сложность военных действий продолжает расти, мы можем ожидать, что их технический опыт будет чрезвычайно полезным."

  USA_carpet_bombing:0 "Ковровые бомбардировки"
  USA_carpet_bombing_desc:0 "Также известный как бомбардировка насыщением, ковровая бомбардировка предназначена для уничтожения целых участков земли. Наши стратегические бомбардировщики закроют солнце над небом наших врагов. Они не будут знать ни безопасности, ни мира."

  USA_morgenthau_plan:0 "План Моргентау"
  USA_morgenthau_plan_desc:0 "Секретарь казначейства Херни Моргентау-младший разработал план ликвидации любой способности Германии вести войну, удалив всю свою промышленную мощность. В то время как радикальный, расслабленный вариант его плана может быть реализован, чтобы ограничить военные возможности Германии."

  USA_heavy_tank_doctrine:0 "Доктрина тяжелых танков"
  USA_heavy_tank_doctrine_desc:0 "Странно, что мы, как самая индустриализированная страна в мире, не имеем возможности поставлять самые большие танки. Зачем стремиться к количеству, а не к качеству, если у нас есть и то, и другое?"


  USA_create_unit_airborne_tt:0 "Даёт шаблон элитной дивизии парашутистов."

  USA_the_global_super_power:0 "Глобальная сверхдержава"
  USA_the_global_super_power_desc:0 "Соединенные Штаты являются оплотом демократии в западном мире. Достигая от моря до сияющего моря, мы являемся маяком надежды, освещающим небо, как город на холме."

  USA_focus_on_asia_tt:0 "Начинает миссию §Yпроекции силы§! в тихом океане, когда другая великая дерважа становится угрозой."

  USA_intervention_mandate_tt:0 "Открывает §Yмандаты на интервенцию§!, позволяя Конгессу начинать военные действия против другой страны."

  USA_war_foundations:0 "Основы войны"
  USA_war_foundations_desc:0 "Наша нынешняя армия неопытна и устарела. Опираясь на отчеты о продолжающейся войне, мы сможем информировать о наших военных решениях."

  USA_join_the_allies:0 "Присоединиться к союзникам"
  USA_join_the_allies_desc:0 "Америка достаточно долго оставалась безучастным наблюдателем. Когда вы видите гремучего змея, готового нанести удар, вы не ждете, пока он ударит, чтобы раздавить его. Американцы будут защищать свободу и свободу независимо от того, где они находятся."

  USA_start:0 "Продолжить новый курс"
  USA_start_desc:0 "Учитывая, что страна находится в руинах, Рузвельту удалось вернуть США на ноги благодаря первому новому курсу. Однако, в отличие от широкой поддержки Первого Нового курса, Рузвельт потерял некоторую поддержку, хотя его нацеленность на бизнес началась во Втором Новом Курсе. Тем не менее, большая часть населения по-прежнему поддерживает Рузвельта, несмотря на снижение энергии Нового курса."

  USA_renew_the_neutrality_act:0 "Продлить действие Закона о нейтралитете 1935 г."
  USA_renew_the_neutrality_act_desc:0 "С ростом напряженности в Европе и Азии и сильной историей изоляционизма кажется естественным, что США продолжат идти по пути невмешательства, и обе стороны поддерживают эти меры."

  USA_spanish_civil_war_amendment:0 "Поправка к гражданской войне в Испании"
  USA_spanish_civil_war_amendment_desc:0 "Используя лазейку в действующих законах о нейтралитете в отношении гражданских войн, американским компаниям удалось продать значительное количество оружия националистам в Испании. Это не может продолжаться."

  USA_hatch_act:0 "Закон о предотвращении пагубной политической деятельности"
  USA_hatch_act_desc:0 "Чтобы исправить коррупцию в правительстве, Закон Хэтча запрещает запугивание или подкуп избирателей и ограничивает политическую деятельность кампании федеральными служащими. Он запрещает использовать любые государственные средства, предназначенные для помощи или общественных работ в избирательных целях, и запрещает должностным лицам, получающим оплату из федеральных фондов, использовать обещания работы, продвижения по службе, финансовой помощи, контрактов или любой другой выгоды для принуждения взносов на кампанию или политической поддержки."

  USA_rural_electrification_act:0 "Управление электрификации сёл"
  USA_rural_electrification_act_desc:0 "В связи с тем, что пыльная чаша растет на Великих равнинах, а бедные фермеры страдают в сельских районах, необходимы инвестиции в эти районы. Администрация по электрификации сельских районов должна приступить к реализации амбициозного плана по электрификации сельской местности, что считается непрактичным и дорогостоящим."

  USA_wagner_steagall_act:0 "Закон Вагнера-Стигалла"
  USA_wagner_steagall_act_desc:0 "Закон о жилье, или Закон Вагнера-Стиголла, будет опираться на предыдущие программы помощи, такие как Национальный жилищный акт 1934, чтобы облегчить финансирование и строительство домов для бедных семей."

  USA_WPA_roads:0 "Расширение сельских дорог"
  USA_WPA_roads_desc:0 "Используя ресурсы ВПА и в целях оказания помощи Администрации по электрификации сельских районов, мы создадим сельские дорожные сети для повышения эффективности транспортировки сельскохозяйственных культур и материалов через сельские районы."

  USA_robinson_patman_act:0 "Закон Робинсона Патмана"
  USA_robinson_patman_act_desc:0 "Закон Робинсона Пэтмена и закон о борьбе с ценовой дискриминацией призваны помешать поставщикам продавать на разные рынки по разным ценам для дальнейшей борьбы с трастами."

  USA_boulder_dam:0 "Завершить строительство плотины Боулдера"

  USA_expand_tva:0 "Расширить Администрацию долины Теннесси"
  USA_expand_tva_desc:0 "Управление долины Тенесси уже доказало жизнеспособность коммунальных компаний, находящихся в федеральной собственности. Дальнейшие инвестиции в эту корпорацию принесут пользу регионам в долине Тенесси, которые особенно сильно пострадали от Великой депрессии."

  USA_napalm:0 "Испытать напалмовые бомбы"
  USA_napalm_desc:0 "Napalm был первоначально разработан командой во главе с химиком Луи Физером для Службы химической войны США в 1942 в секретной лаборатории Гарвардского университета. Это зажигательная смесь гелеобразующего агента и летучего нефтехимического (обычно бензина (бензина) или дизельного топлива)."

  USA_depression_fix:0 "§GПостепенно уменьшает последствия Великой депрессии§!\n"

  USA_price_control_act:0 "Федеральный закон о справедливом ценообразовании"
  USA_price_control_act_desc:0 "Вместо косвенного подхода к контролю над рынком мы можем устанавливать прямые цены на товары, чтобы лучше удовлетворять потребности фермеров и избегать ненужных отходов материалов."

  USA_second_agricultural_adjustment_act:0 "Второй Закон о регулировании сельского хозяйства"
  USA_second_agricultural_adjustment_act_desc:0 "Для того, чтобы продолжить план FDR по облегчению фермеров и соблюдать постановление от США против Батлера, Второй закон о корректировке сельского хозяйства будет финансировать себя, используя государственное финансирование вместо налогов на переработчиков."

  USA_federal_works_administration:0 "Создание Федерального агентства по труду"
  USA_federal_works_administration_desc:0 "Федеральное агентство по строительству объединит несколько строительных программ, в первую очередь WPA, в единую администрацию, чтобы упростить планирование и администрирование строительства, а также открыть больше возможностей для межпрограммного сотрудничества."

  USA_interstate_road_board:0 "Создание Межгосударственного дорожного совета"
  USA_interstate_road_board_desc:0 "В целях оказания помощи Администрации по электрификации сельских районов, а также дальнейшего подключения бедных фермеров к рынкам, была выдвинута идея создания большой межгосударственной дорожной сети для облегчения транспортировки товаров."

  USA_farmer_relief_act:0 "Закон о помощи фермерам"
  USA_farmer_relief_act_desc:0 "С пыльной чашей, терроризирующей Великие равнины, прямое облегчение должно быть доступно для борющихся фермеров, чтобы вернуть их на ноги."

  USA_farm_bankruptcy_act:0 "Акт о банкротстве ферм"
  USA_farm_bankruptcy_act_desc:0 "В первые годы своего президентства Рузвельт уделял большое внимание защите фермеров. Если мы хотим сохранить их поддержку, нам нужно будет пройти далеко идущие меры защиты, которые будут восприняты как спорные некоторыми представителями американской общественности."
  USA_farm_bankruptcy_act_tt:0 "§YПредотвратит образование нейтрального блока в случае гражданской войны.§!"

  USA_judicial_reform:0 "Законопроект о реформе судебных процедур"
  USA_judicial_reform_desc:0 "Поскольку консервативный Верховный суд отменяет жизненно важные новые программы сделок, необходимо принять меры для защиты американского народа и оказания помощи другим ветвям власти 2. Запустив амбициозный план \\"Court Packing\\", мы можем получить контроль над судом для обеспечения безопасности наших программ."

  USA_nira_act:0 "NIRA акт"
  USA_nira_act_desc:0 "Теперь, когда мы смогли осуществить так много радикальных изменений в нашей стране, президент считает, что пришло время пересмотреть аннулирование NIRA. Если мы сможем восстановить его, это будет иметь большое и различное влияние в нашей стране."

  USA_accumulated_wealth_tax:0 "Налог на накопленное богатство"
  USA_accumulated_wealth_tax_desc:0 "Чтобы финансировать программы Нового курса, богатые должны платить свою долю американскому народу, чтобы поддержать его. Для этого будет введен налог на состояние свыше $500,000, чтобы предотвратить огромное накопление праздного богатства."

  USA_fair_labor_standards_act:0 "Закон о справедливых трудовых стандартах"
  USA_fair_labor_standards_act_desc:0 "Чтобы защитить права трудящихся, а также предотвратить эксплуататорские отношения, работники должны иметь четкие права, в первую очередь минимальную заработную плату."

  USA_worker_autonomy_act:0 "Закон об автономии рабочих"
  USA_worker_autonomy_act_desc:0 "Чтобы лучше представлять американский народ, заводы будут иметь определенные ограничения на то, как они могут регулировать поведение заводов, в первую очередь запрет на вступление рабочих в профсоюзы."

  USA_union_recognition_act:0 "Закон о признании Союза"
  USA_union_recognition_act_desc:0 "Чтобы помочь среднему американскому работнику, должен быть принят закон, который заставит владельцев фабрик признавать профсоюзы, которые составляют больше, чем 25% любой отрасли."

  USA_business_relations_act:0 "Закон о деловых отношениях"
  USA_business_relations_act_desc:0 "Для налаживания более тесного сотрудничества между работниками и бизнесом необходимо принять законы, направленные на примирение этих двух сторон и открытый диалог о том, как лучше управлять промышленностью."

  USA_board_of_business_management:0 "Совет по улучшению бизнеса"
  USA_board_of_business_management_desc:0 "Чтобы начать дальнейшее обсуждение, необходимо создать совет, который представляет как профсоюзы, так и предприятия, для обсуждения надлежащих протоколов ведения бизнеса."

  USA_cash_and_carry_act:0 "Программа «Кэш энд Керри»"
  USA_cash_and_carry_act_desc:0 "В то время как предыдущие акты нейтралитета препятствовали продаже оружия странам, находящимся в состоянии войны, было сделано исключение, позволяющее продавать товары до тех пор, пока эта страна оплачивала транспортировку. Хотя это положение с тех пор истекло, мы можем призвать Конгресс возобновить это положение для снабжения союзников."
  USA_cash_and_carry_act_tt:0 "§GРазрешит Британии закупать военную технику у США§!"

  USA_lend_lease_act:0 "Программа ленд-лиза"
  USA_lend_lease_act_desc:0 "С успехом программы денежных средств, а также растущей общественной поддержкой войны, дальнейшие поставки должны быть направлены союзникам за рубежом. Закон о ленд-лизе предоставит таким странам, как Великобритания и Советский Союз, военные материалы в обмен на оплату после войны. Это сделало бы нас ненейтральной нацией."

  USA_CRA:0 "Создание АРК"
  USA_CRA_desc:0 "После завершения строительства плотины Боулдер район вокруг реки может стать как сельскохозяйственным, так и, возможно, даже крупным городом. при создании Администрации реки Колорадо мы можем организовать крупные инвестиционные проекты"

  USA_invest_in_junior_colleges:0 "Инвестиции в юношеские колледжи"
  USA_invest_in_junior_colleges_desc:0 "Закон Смита-Хьюза 1917 года оказал большое влияние на предоставление профессионального образования и подготовку студентов к специализированным работам. на увеличение финансирования этих программ через младшие колледжи, мы можем и дальше поднимать людей из низших классов на высокооплачиваемую и квалифицированную работу"

  USA_wait_out_the_recession:0 "Переждать рецессию"
  USA_wait_out_the_recession_desc:0 "Хотя рецессия может выглядеть ужасной, это просто ожидаемый результат перехода американской экономики от государственных расходов, и не о чем беспокоиться"
  USA_wait_out_the_recession_tt:0 "§GЭтот фокус завершится, если вы переждете рецессию Рузвельта вместо того, чтобы пытаться исправить ее с помощью кейнсианской экономики.§!\nОткрывает последовательную цепочку из §Y3 инвестиционных решений§!.\n§YСтрана свободных людей§!: прирост финансов §G+25%§!.\nПри спокойном отношении §YGM/DuPont§! получает бонусы к боеприпасам, артиллерии и резине.\nПри дружелюбном отношении §YKaiser§! получает бонусы к строительству инфраструктуры и верфей."
  USA_JPMorgan_new_deal_decisions_tt:0 "Открывает решения §YПереговоры с J.P. Morgan§! и §YУлучшить отношения с J.P. Morgan§! во вкладке §YВнутренние фракции§!."
  USA_TVA_Ford_faction_bonus_tt:0 "При дружелюбном отношении §YFord/Chrysler§! получит §G+7,5%§! к максимальной эффективности производства, §G+10%§! к скорости строительства военных заводов и §G+10%§! к росту эффективности производства."

  USA_keynesian_economics:0 "Кейнсианская экономика"
  USA_keynesian_economics_desc:0 "В условиях ухудшения состояния экономики после недавнего сокращения бюджета необходимо использовать другие варианты. Теория Джона Мейнарда Кейнса о том, что государственные расходы необходимы для стимулирования экономики, предлагает решение, включающее расширение многих государственных трудовых программ для перезапуска американской экономики."

  USA_budget_balancing:0 "Балансировка бюджета"
  USA_budget_balancing_desc:0 "Американская экономика, наконец, возвращается в нужное русло, и пришло время начать медленный процесс перехода занятости из государственного сектора в частный, сокращая финансирование многих государственных программ."
  USA_budget_balancing_tt:0 "§RМожет вызвать рецессию§!"

  USA_limited_rearmament:0 "Ограниченное перевооружение"
  USA_limited_rearmament_desc:0 "Общественность по-прежнему категорически против отправки наших мужиков умирать в чужие страны. Недавний запрос англичан на закупку американского оборудования дал нам повод увеличить производство вооружений. При достаточной поддержке мы можем еще больше увеличить эту сумму."

  USA_selective_service_act:0 "Закон о выборочной службе"
  USA_selective_service_act_desc:0 "Эта война оказалась гораздо более значимой, чем мы изначально думали. При достаточной политической поддержке мы можем провести призыв, который позволит нам подготовить резервную армию, если конфликт когда-либо достигнет берегов Америки."
  USA_selective_service_act_tt:0 "§GМожет обучать до 50 резервистов\nС началом войны переключит закон о рабочей силе на выборочную службу.§!"
  USA_selective_service_act_flag:0 "Есть Закон о выборочной службе"

  USA_rubber_reserve_company:0 "Резиновая резервная компания"
  USA_rubber_reserve_company_desc:0 "Наш доступ к запасам каучука в Юго-Восточной Азии с каждым днем становится все более рискованным. Мы не можем позволить себе полагаться исключительно на запасы каучука в Южной Америке, чтобы питать нашу военную машину. Мы должны немедленно приступить к созданию программы производства синтетического каучука в США."

  USA_naval_rearmament_act:0 "Закон о военно-морском перевооружении"
  USA_naval_rearmament_act_desc:0 "Если война когда-либо перерастет в глобальные масштабы, самым большим преимуществом Соединенных Штатов будет наш контроль над обширными районами океана, отделяющими нас от конфликта. Мы должны гарантировать, что американские воды всегда будут в безопасности."

  USA_flint_strike_support:0 "Не вмешивался в сидячую забастовку Флинта"
  USA_flint_strike_breakup:0 "Вмешался в сидячую забастовку Флинта"

  congress_massive_support_trigger_tt:0 "Требуется поддержка как минимум §Y65 Сенаторов§W (текущие: [?senators_support|W0])§W и §Y303 Представителей §W(текущие: [?representatives_support|W0])"

  USA_waited_out_roosevelt_recession:0 "Переждала рецессию"
  USA_delt_with_roosevelt_recession:0 "Вмешался в рецессию"


  USA_undistributed_profits_tax:0 "Налог на нераспределенную прибыль"
  USA_undistributed_profits_tax_desc:0 "Налог на нераспределенную прибыль был еще одним видом налога на богатство, включенным в Закон о доходах 1936. В законопроекте установлен принцип, согласно которому удерживаемая корпоративная прибыль может облагаться налогом. Идея заключалась в том, чтобы заставить крупные предприятия распределять прибыль в виде дивидендов и заработной платы, а не экономить или реинвестировать их. Это предназначалось для получения дохода для оплаты программ Нового курса Рузвельта."

  USA_banking_industry_loans:0 "Кредиты банковской отрасли"
  USA_banking_industry_loans_desc:0 "С момента своего избрания Рузвельт боролся с банковской отраслью, особенно против монополии J.P. Morgan. Однако расходы на программы «Нового курса» накапливаются, и у федерального правительства заканчиваются способы их оплаты. Принятие кредитов в этих банках обогатило бы их, но предотвратило бы давление на бизнес через новые налоги."

  USA_emergency_shipbuilding_program:0 "Программа аварийного судостроения"
  USA_emergency_shipbuilding_program_desc:0 "Видя возможную угрозу грядущей войны между двумя океанами, Морская комиссия вводит программу, чтобы обеспечить Соединенным Штатам достаточное производство торговых и военных кораблей. Генри Кайзеру поручено создать такие большие производственные мощности для кораблей, каких еще не было в истории."

  USA_veteran_employement:0 "Ветераны труда"
  USA_veteran_employement_desc:0 "FDR попытался остановить Скорректированный закон о компенсации через вето на том основании, что к здоровым ветеранам следует относиться не иначе, чем к среднему гражданину. Вместо того, чтобы платить ветеранам подачки, альтернативой является гарантия их работы. Мы просто не можем гарантировать их лечение на свободном рынке."

  USA_tva_ford_cooperation:0 "Сотрудничество TVA-Ford"
  USA_tva_ford_cooperation_desc:0 "Хотя Форду было отказано в возможности построить энергетическую утилиту для обслуживания долины Теннесси, их капитал и инженерный опыт могут быть полезны. С раздуванием федерального бюджета и увеличением долга, частная промышленность может помочь, даже если это даст Титанам больше власти."

  USA_appoint_william_knudsen:0 "Назначить Уильяма Кнудсена"
  USA_appoint_william_knudsen_desc:0 "Уильям Кнудсен (William Knudsen) — бывший исполнительный директор автомобильной промышленности, имеющий опыт, необходимый для того, чтобы убедить титанов отрасли, таких как Ford, Chrysler и GM, внести свой вклад в их огромные промышленные базы. Благодаря своему опыту он может быстро нарастить производство."

  USA_keynesian_militarism:0 "Кейнсианский милитаризм"
  USA_keynesian_militarism_desc:0 "С наступлением кейнсианства как начальной школы экономической мысли в США, он также может быть использован в военном отношении. После восстановления после Великой депрессии все рабочие программы могут быть перемещены в сторону подготовки Соединенных Штатов к будущему конфликту. В духе кейнсианства, так же как финансируемые правительством программы улучшили страну для гражданских лиц, они могут улучшить нашу военную готовность таким же образом."

  USA_tva_alcoa_cooperation:0 "Сотрудничество с TVA-Alcoa"
  USA_tva_alcoa_cooperation_desc:0 "Поскольку TVA является доминирующим поставщиком энергии для долины реки Теннесси, частные компании, такие как Aluminum Company of America, Alcoa, могут использовать эти огромные возможности производства энергии для строительства крупнейшего в мире алюминиевого завода. Этот алюминий пригодится во время конфликта."

  USA_Kaiser_Positive_1_tt1:1 "£faction_usa_kaiser §YKaiser's Industries§! становится более §Gвлиятельным§!, увеличивая £GFX_faction_construction_civilian_icon §Yскорость строительства§! на §G5%§! и увеличивая вероятность того, что они внесут свой вклад в будущей войне."

  USA_Kaiser_Dockyard_Swap_tt:1 "£faction_usa_kaiser §YKaiser's Industries§! становится более §Gвлиятельным§! и полностью переключается на кораблестроение,, §Rтеряя§! все бонусы на £GFX_faction_construction_civilian_icon §Yскорость строительства§! и §Gдаёт§! £GFX_faction_construction_dockyard_icon §Yскорость строительства верфей§! и £GFX_faction_dockyard_icon §Yпроизводительность верфи§!"

  USA_Ford_Chrysler_negative_1_tt1:1 "£faction_usa_chrysler_ford §YFord/Chrysler§! становится более §Rвраждебным§!, снижая £GFX_faction_construction_civilian_icon §Yскорость строительства фабрик§! на §R5%§! и вероятность поддержки в будущей войне."

  USA_JPMorgan_Positive_1_tt1:1 "£faction_usa_jpmorgan §YJ.P. Morgan§! становится более §Gдружелюбным§!, увеличивая £GFX_faction_stability_icon §Yстабильность§! на §G+5%§! и уменьшая £GFX_faction_consumer_goods §Yфабрики, производящие товары народного потребления§! на §Y-4%§! и увеличивая вероятность того, что они внесут свой вклад в будущей войне."

  USA_Public_positive_1_tt1:1 "£faction_usa_public_support §YОбщество§! становится более §Gдружелюбным§!, увеличивая £GFX_faction_pol_power_icon §Yизменение политической власти§! на §G+0.10§! и £GFX_faction_stability_icon §Yстабильность§! на §G+5%§! и увеличивая вероятность того, что они внесут свой вклад в будущей войне."

  USA_Public_negative_1_tt1:1 "£faction_usa_public_support §YОбщество§! становится более §Rвраждебным§!, уменьшая £GFX_faction_pol_power_icon §Yизменение политической власти§! на §R-0.10§! и £GFX_faction_stability_icon §Yстабильность§! на §R-5%§! и увеличивая вероятность того, что они внесут свой вклад в будущей войне."

  USA_Titan_negative_1_tt1:1 "£faction_usa_chrysler_ford §YFord/Chrysler§!, £faction_usa_gm_dupont §YGM/DuPont§! и £faction_usa_jpmorgan §YJ. P. Morgan§! становятся более §Rвраждебными§!, совместно снижая £GFX_faction_stability_icon §Yстабильность§! на §R5%§! и £GFX_faction_construction_civilian_icon §Yскорость строительства фабрик§! на §R10%§!, а также повышая вероятность их выступления против нас в будущей войне."

  USA_Titan_positive_1_tt1:1 "£faction_usa_chrysler_ford §YFord/Chrysler§!,£faction_usa_gm_dupont §YGM/Dupont§!, и £faction_usa_jpmorgan §YJ.P. Morgan§! становятся более §Gдружелюбными§!, вместе увеличивая £GFX_faction_stability_icon §Yстабильность§! на §G+5%§! и£GFX_faction_construction_civilian_icon §Yскорость строительства фабрик§! на §G+10%§!, и увеличивая вероятность того, что они внесут свой вклад в будущей войне."

  USA_Ford_GM_positive_1_tt1:1 "£faction_usa_chrysler_ford §YFord/Chrysler§! и £faction_usa_gm_dupont §YGM/Dupont§! становятся более §Gдружелюбными§!, вместе увеличивая £GFX_faction_construction_civilian_icon §Yскорость строительства фабрик§! на §G+10%§! и увеличивая вероятность того, что они внесут свой вклад в будущей войне."

  USA_Ford_positive_1_tt1:1 "£faction_usa_chrysler_ford §YFord/Chrysler§! становится более §Gдружелюбным§!, увеличивая £GFX_faction_construction_civilian_icon §Yскорость строительства фабрик§! на §G+5%§! и увеличивая вероятность того, что они внесут свой вклад в будущей войне."

