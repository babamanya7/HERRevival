  SOV_army_reform_3_tt:0 "$SOV_modify_the_red_army_ns_intro$ \n£organization_texticon  Организация дивизии: §G+10.00%§! \n£army_experience  Получаемый опыт армии: §G+10.00%§! \n£army_doctrine_cost_texticon  Стоимость сухопутной доктрины: §G+50.00%§! \n\n"

