  FRA_national_centre_for_scientific_research_desc:0 "Мы обязаны обьединить все центры исследователей под одной крышей, увеличив их эффективность."

  FRA_richelieu_tt:0 "Добавляет 2 линкора класса Richelieu Class в очередь производства с §Y50%§! и §Y35%§! прогрессом соответственно"

