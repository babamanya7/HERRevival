  ENG_mass_mechanization:0 "Массовая механизация"
  ENG_mass_mechanization_desc:0 ""
  ENG_mass_mechanization_tt:0 "§YВсе конструкторы танков снизят стоимость производства механизированной техники на 10%.§!"

  ENG_advancments_in_infantry_designs:0 "Достижения в дизайне пехоты"
