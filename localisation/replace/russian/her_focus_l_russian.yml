  JAP_interservice_rivalry_against_toseiha_4_tt:1 "£faction_jap_toseiha §YФракция контроля§! взбунтуется, снизив §Yпроизводительность заводов§! на §R10%§!, §Yскорость строительства фабрик§! на §R5%§! и §Yстабильность§! на §R15%§!.\n"

  JAP_preparations_to_secure_the_islands:0 "Подготовка к захвату островов"
  JAP_preparations_to_secure_the_islands_desc:0 "Богатые ресурсами острова Голландской Ост-Индии являются главной целью нашей войны в южной части Тихого океана. Американцы и их марионетки на Филиппинах блокируют нас от наших целей. Наши солдаты должны быть обучены захватывать и удерживать эти регионы."

  JAP_tojos_cabinet:0 "Кабинет Тодзио"
  JAP_tojos_cabinet_desc:0 "Коноэ оказался слишком слабым и трусливым, чтобы вести Японию против западных держав. Тодзё понимает, что для будущего Японии нет слишком больших затрат. Банзай!"

  JAP_reform_the_officers:0 "Реформа офицеров"
  JAP_reform_the_officers_desc:0 "Тодзё является популярным лидером в нашей армии, с его новыми полномочиями в правительстве он может, наконец, реформировать офицеров и привести армию к пятке."

  JAP_imperial_rule_association:0 "Имперская ассоциация правления"
  JAP_imperial_rule_association_desc:0 "Ассоциация имперского правления под руководством Фумимаро Коноэ предоставит ему платформу для продвижения целей его движения «Новый порядок». Это позволит нам милитаризировать население, чтобы максимизировать эффективность общих военных усилий Японии."

  JAP_konoes_cabinet:0 "Кабинет Коноэ"
  JAP_konoes_cabinet_desc:0 "Япония больше не может позволить себе заигрывать с декадентскими западными идеями либерализма. Янки и англо-американцы показали, что они не готовы сотрудничать с Японией. Коноэ выведет Японию против всего мира!"

  JAP_strike_north_doctrine:0 "Ударная северная доктрина"
  JAP_strike_north_doctrine_desc:0 "Армия считает, что вторжение Советского Союза на Север будет намного проще, чем принуждение себя к войне с западными державами. Ресурсы Сибирской равнины станут ответом на нашу нехватку ресурсов."

  JAP_german_technological_exchange:0 "Немецкая технологическая биржа"
  JAP_german_technological_exchange_desc:0 "Немцы очень далеки от нас, но они проявили готовность к сотрудничеству. Если мы хотим сотрудничать, чтобы уничтожить советского медведя, то имеет смысл поделиться некоторыми нашими технологиями."

  JAP_the_korean_project:0 "Корейский проект"
  JAP_the_korean_project_desc:0 "Корея является воротами Японии на континент. Без этого наши мечты об империи никогда не осуществятся. Они должны быть привязаны к нам."

  JAP_industrialize_the_north:0 "Индустриализация Севера"
  JAP_industrialize_the_north_desc:0 "Северные регионы Кореи создают хорошие условия для индустриализации. Мы можем использовать это пространство для строительства заводов, которые мы не смогли бы разместить на наших родных островах."

  JAP_fully_integrate_korea:0 "Полностью интегрировать Корею"
  JAP_fully_integrate_korea_desc:0 "Корейцы были успешно перевоспитаны, чтобы следовать японским традициям и культуре. Им пора признать свой статус в составе Японии."

  JAP_industrialize_the_south:0 "Индустриализация Юга"
  JAP_industrialize_the_south_desc:0 "Южный конец Корейского полуострова станет местом для гражданских промышленных проектов, которые мы не можем найти на внутренних островах."

  JAP_support_menjiang_claims:0 "Поддержите претензии Мэнцзяна"
  JAP_support_menjiang_claims_desc:0 "У нашей монгольской марионетки не хватало легитимности, чтобы навязать свои претензии всей Монголии. С нашей помощью они смогут вновь заявить о себе на территории, потерянной Китаю и Советам."

  JAP_crush_the_remaining_warlords:0 "Сокрушить оставшихся военачальников"
  JAP_crush_the_remaining_warlords_desc:0 "Националисты потерпели поражение, а их мелкий Объединенный фронт в руинах. Пришло время закрепить нашу власть над Китаем!"

  JAP_exploit_the_southern_resource_area:0 "Эксплуатация завоёванных территорий"
  JAP_exploit_china_desc:0 "Наши войны дорого обходятся нашей экономике. Мы разработали планы по эксплуатации подконтрольных нам районов Китая, чтобы лучше контролировать нашу экономическую ситуацию."

  JAP_modernization_effort:0 "Усилия по модернизации"
  JAP_modernization_effort_desc:0 "Война продолжает развиваться, и мы не можем быть пойманы без нее. Более тяжелые бронированные и транспортные варианты дадут нам преимущество в борьбе с врагами Японии."

  JAP_kokura_arsenal:0 "Арсенал Кокура"
  JAP_kokura_arsenal_desc:0 "Kokura Arsenal — один из крупнейших оружейных заводов в Японии. Их возможности будут расширены, чтобы вооружить наших солдат."

  JAP_advanced_weaponary:0 "Расширенное вооружение"
  JAP_advanced_weaponary_desc:0 "Хотя предпочтительным оружием наших солдат являются арисака и штык, нам требуется современное оружие для борьбы с современными врагами. Для выполнения этой задачи должны быть разработаны более тяжелые артиллерийские и противотанковые платформы."

  JAP_new_bomber_projections:0 "Новые проекты бомбардировщиков"
  JAP_new_bomber_projections_desc:0 "Наши нынешние бомбардировщики оказались неэффективными против тяжелобронированных морских и наземных целей. Требуются новые бомбардировщики, способные нести более тяжелые боеприпасы."

  JAP_the_imperial_japanese_air_force:0 "Императорские ВВС Японии"
  JAP_the_imperial_japanese_air_force_desc:0 "Конфликт между IJN и IJA привел к развитию двух различных военно-воздушных сил с их собственной тактикой и самолетами. Это мелкое соперничество должно быть сметено ради нашей империи, и будут сформированы новые объединенные и независимые военно-воздушные силы."

  JAP_project_z:0 "Проект Z"
  JAP_project_z_desc:0 "Американские бомбардировки наших городов вызвали трещины в вере нашего народа в империю. Мы должны иметь возможность отомстить Соединенным Штатам и создать собственный стратегический бомбардировщик дальнего действия."

  JAP_synthetic_resource_studies:0 "Исследования синтетических ресурсов"
  JAP_synthetic_resource_studies_desc:0 "В то время как недостаток нашей промышленности можно решить, просто построив больше заводов, мы не можем решить проблему нехватки природных ресурсов, просто создав их. Или можем?"

  JAP_imperial_synthetic_programme:0 "Имперская синтетическая программа"
  JAP_imperial_synthetic_programme_desc:0 "Мы достигли того, что раньше считалось невозможным. Резина и нефть теперь могут быть сделаны из угля. Потребности Японии требуют от нас расширения их производства."

  JAP_operation_ketsugo:0 "Операция Кецуго"
  JAP_operation_ketsugo_desc:0 "Иностранные захватчики высадились на нашей родной земле. Каждый гражданин Японии должен быть готов отдать свою жизнь за нашу страну. Сто миллионов умрут славно, прежде чем Япония потерпит поражение!"

  JAP_strike_at_china:0 "Удар по Китаю"
  JAP_strike_at_china_desc:0 "[Root.GetNameDefCap] беден ресурсами, но наши соседи - нет. Мы должны отнять у них то, чего нам не хватает, и для этого нам нужно только предлог. Такое оправдание могли дать несколько предприимчивых солдат, после чего у императора не останется иного выбора, кроме как согласиться на войну, как бы плохо она ни была подготовлена..."

  JAP_hideo_iwakuros_order:0 "Заказ генерала Ивагуро"
  JAP_hideo_iwakuros_order_desc:0 "Генерал Ивакуро запросил разработку тяжелых танков, больше, чем мы когда-либо видели. Эти стальные звери повернут любую битву в нашу пользу."

  JAP_kijiro_nambus_works:0 "Работы Кидзиро Намбу"
  JAP_kijiro_nambus_works_desc:0 "Kijrio Nambu - один из самых талантливых дизайнеров оружия. Его конструкции должны иметь дополнительный приоритет, чтобы они могли быть произведены и отправлены на нашу линию фронта раньше."

  JAP_integrate_takasago_volunteers:0 "Интеграция волонтеров Такасаго"
  JAP_integrate_takasago_volunteers_desc:0 "Наши верные подданные в Формозе больше подходят для тропического климата, чем мы. Мы набрали ряд добровольцев, которые будут специально подготовлены для боевых действий в суровых условиях южной части Тихого океана."

  JAP_investment:0 "Инвестиции"
  JAP_investment_desc:0 "Зайбацус является краеугольным камнем японской экономики. Мы должны инвестировать в тяжелую промышленность и переработку ресурсов, чтобы эти компании могли работать на пике производительности."

  JAP_subsidize_the_okura:0 "Субсидировать Okuragumi Shokai"
  JAP_subsidize_the_okura_desc:0 "Компания Okuragumi Shokai является одним из наших крупнейших zaibatsus. Их опыт в строительстве позволит нам реализовывать более крупные промышленные проекты."

  JAP_nationalize_civilian_industry:0 "Национализировать гражданскую промышленность"
  JAP_nationalize_civilian_industry_desc:0 "Воля императора есть закон. Имперский контроль должен осуществляться над нашей гражданской промышленностью, чтобы направить ее на благо Японии."

  JAP_torpedo_ships:0 "Торпедные корабли"
  JAP_torpedo_ships_desc:0 "Торпеда является ценным инструментом. Руководствуясь волей императора, торпеды даже самых маленьких кораблей могут сбивать самые большие из линкоров."

  JAP_auxiliary_carriers:0 "Вспомогательные авианосцы"
  JAP_auxiliary_carriers_desc:0 "Хотя самолеты слабые и хрупкие машины, они будут полезны в наших военно-морских операциях. Мы должны сосредоточиться на создании небольших перевозчиков, чтобы не допустить чрезмерных инвестиций."

  JAP_super_submarines:0 "Супер подводные лодки"
  JAP_super_submarines_desc:0 "Скрываясь под водой, эти подводные лодки смогут нарушать вражеские коммуникации, пока основные силы флота ведут бой."

  JAP_heavy_escorts:0 "Тяжелый эскорт"
  JAP_heavy_escorts_desc:0 "Огромные океаны вокруг Японии представляют как наши самые сильные стороны, так и наши самые большие слабости. Мы должны обеспечить безопасность наших морских путей от любых иностранцев."

  JAP_island_bulwarks:0 "Острова-Бастионы"
  JAP_island_bulwarks_desc:0 "Наши острова обеспечивают естественную буферную зону между нашими островами и любой потенциальной угрозой. Необходимо провести большую работу по предотвращению попадания их в руки противника."
  JAP_island_bulwarks_tt:0 "§G Добавляет решения для дальнейшего обновления возможностей этих островов.\n§!"

  JAP_ensure_military_loyalty:0 "Обеспечить военную лояльность"
  JAP_ensure_military_loyalty_desc:0 "Хотя военный переворот был желанным, мы не можем позволить себе более опрометчивых действий со стороны армии. С таким количеством армейских офицеров на правительственных должностях мы должны принять решительные меры, чтобы устранить их влияние."

  GER_issue_weapon_contracts_tt:1 "£faction_ger_industrialists §YПромышленники§! станут более §GЛояльнее§! и §GВлиятельнее§!\n\n"

  GER_death_before_defeat_tt:0 "\n£faction_ger_ss СС станет более §GВлиятельным§!, увеличивая прирост §YПолитической власти§! на §G5%§! и §Yстабильность§! на §G5%§!"

  GER_safeguard_the_balkans:0 "Защита Балкан"
  GER_safeguard_the_balkans_desc0:0 "Балканы неслучайно называют пороховой бочкой Европы. Если коммунизм попытается закрепиться в Европе, вероятнее всего, он начнёт именно там. Этого необходимо избежать любой ценой."

  GER_four_year_plan:0 "Четырёхлетний план"

  GER_appoint_hermann_goring_tt:0 "§RВоенные облигации теперь выполняются в два раза быстрее, однако они дают только половину снижения усталости экономики.§!"

  GER_auxiliary_autobahn:0 "Вспомогательный автобан"
  GER_auxiliary_autobahn_desc:0 "Теперь, когда мы сформировали централизованное кольцо инфраструктуры между нашими крупными городами, нам нужно выйти и соединить наши второстепенные города и наши новые территории и привести их в лоно нашего промышленного комплекса."

  GER_invest_in_ig_farben_schact:0 "Инвестиции в И.Г. Фарбен"
  GER_invest_in_ig_farben_desc:0 "Компания I.G. Farben является основным производителем синтетической продукции и разработала эффективную тактику производства этих изделий. Мы отправим финансирование в виде контрактов в I.G. Farben, чтобы позволить им расширить свои отрасли и предоставить нам больше ресурсов, которые они могут производить."

  GER_nazi_economics:0 "Нацистская экономика"
  GER_nazi_economics_desc:0 "Экономическое министерство может выступать только как орудие продвижения идеалов партии и не быть препятствием для сопротивления воле фюрера. Заполнение этих экономических позиций людьми в партии поможет размазать орудия перевооружения."

  GER_deutsche_albriet_front:0 "Немецкий трудовой фронт"
  GER_deutsche_albriet_front_desc:0 "Организация представительства рабочего в одной организации может обеспечить простоту политической организации и легкое влияние, чтобы обеспечить контроль над рабочей политикой рабочего для предотвращения забастовок и повышения производительности и помочь получить больше материалов."

  GER_reichsarbeitsdienst:0 "Служба труда Рейха"
  GER_reichsarbeitsdienst_desc:0 "Имперская служба труда (Reichsarbeitsdienst/RAD) — крупная организация, созданная для смягчения последствий безработицы для немецкой экономики, милитаризации рабочей силы и привития ей нацистской идеологии. Во время войны РАД будет заниматься снабжением фронтовых войск продовольствием и боеприпасами, ремонтом поврежденных дорог и строительством и ремонтом взлетно-посадочных полос."

  GER_expand_domestic_mining:0 "Развитие добычи ресурсов"
  GER_expand_domestic_mining_desc:0 "Нынешние горнорудные работы в наших регионах должны вместить затерянную территорию и выполнить требования автаркии. Для этого мы будем использовать DAF и нашу новую инфраструктуру."

  GER_explotation_of_acquired_resources:0 "Эксплуатация завоеванных территорий"
  GER_explotation_of_acquired_resources_desc:0 "Теперь, когда мы обрели новые территории, мы должны интегрировать объекты горнодобывающей промышленности в нашу систему инфраструктуры и обеспечить приток рабочей силы для обеспечения производительности и использования приобретенных ресурсов."
  GER_explotation_of_nations:0 "Разблокирует решения по эксплуатации завоёванных государств в целях §GСнижения экономической усталости§!"

  GER_continue_autarky:0 "Продолжить автаркию"
  GER_continue_autarky_desc:0 "Аутаркия — это единственный путь вперед, чтобы мы не торговали своими промышленными мощностями с сельхозугодьями Востока. Мы должны проглотить таблетку, даже если это болезненно, чтобы Германия могла оставаться самодостаточной."

  GER_nationalize_synthetic_industries:0 "Национализация синтетических производств"
  GER_nationalize_synthetic_industries_desc:0 "Несмотря на то, что компании преуспели в обеспечении производства синтетических ресурсов, нам нужен прямой доступ к ресурсам, необходимым для нашей военной машины. Хотя они будут сумасшедшими, нам нужно национализировать их объекты."

  GER_invest_in_ig_farben:0 "Инвестиции в И.Г. Фарбен"
  GER_invest_in_ig_farben_desc:0 "Компания I.G. Farben является основным производителем синтетической продукции и разработала эффективную тактику производства этих изделий. Мы отправим финансирование в виде контрактов в I.G. Farben, чтобы позволить им расширить свои отрасли и предоставить нам больше ресурсов, которые они могут производить."

  GER_issue_more_oil_contracts:0 "Подписать больше нефтяных контрактов"
  GER_issue_more_oil_contracts_desc:0 "Наша контрактная система надлежащим образом работает с I.G. farben, чтобы получить много синтетических ресурсов, теперь нам нужно расширить их с более крупными контрактами и дать им вертикальную интеграцию ресурсов."

  GER_kdf_wagen_scheme_mil:0 "Схема «Сила через радость»"
  GER_kdf_wagen_scheme_mil_desc:0 "Мы разработали схему для развития нашей военной промышленности, выпустив программу, чтобы убедить немцев купить наш Volkswagen или Народный автомобиль на будущее, но вместо этого использовать их деньги для финансирования нашей растущей военной промышленности."

  GER_hermann_goring_werke:0 "Рейхсверке «Герман Геринг»"
  GER_hermann_goring_werke_desc:0 "Конгломерат Геринга-Верке приобретет и национализирует нашу несостоявшуюся сталелитейную промышленность и другие заводы и превратит их в средство перевооружения Германии для достижения целей Гитлера для вермахта."

  GER_nationalize_german_arms_industries:0 "Национализация военной промышленности"
  GER_nationalize_german_arms_industries_desc:0 "Компании, отвечающие за закупки оружия, некомпетентны и замедляют экономику Германии, мы должны действовать, чтобы захватить их заводы и производить более высокими темпами, чем когда-либо! Хотя нам придется разбить несколько яиц, это нам очень поможет."

  GER_issue_weapon_contracts:0 "Выдача контрактов на оружие"
  GER_issue_weapon_contracts_desc:0 "Развитие оружейной промышленности – это задача, которая требует организации. Руководящие компании эффективны, но должны быть созданы стимулы для достижения производственных целей, которые заставляют их напрягать свои компании до предела и за его пределами для производства для рейха. Платежи будут организованы, и оружие будет течь."

  GER_a_continental_army:0 "Континентальная армия"
  GER_a_continental_army_desc:0 "Теперь, когда мы приобрели компании, нам необходимо интегрировать их в нашу инфраструктурную сеть, расширить их мощности и обеспечить доступность всех необходимых ресурсов для ускорения производства."

  GER_Peenemunde_Army_Research_Centre:0 "Армейский исследовательский центр Пенемюнде"
  GER_Peenemunde_Army_Research_Centre_desc:0 "Мы должны найти центр чисто военных исследований, чтобы быть на шаг впереди наших врагов."

  GER_vertical_industrial_arms_integration:0 "Вертикальная интеграция военной промышленности"
  GER_vertical_industrial_arms_integration_desc:0 "Вооружённая промышленность делает экстраординарную работу с этой повышенной скоростью, но узкие места возникают на переходных этапах от шахты к заводу, к обучению, к заводу, к запасам. Разрешение этим компаниям контролировать эти аспекты отрасли уменьшит узкие места и поможет нашей немецкой эффективности."

  GER_organization_todt:0 "Организация Тодта"
  GER_organization_todt_desc:0 "Организация Тодт отвечает за наши приобретенные отрасли и организацию некоторых из наших собственных. Мы должны закрепить его в качестве контролера в эту эпоху войны."

  GER_rmbum:0 "Имперское министерство вооружения и боеприпасов"
  GER_rmbum_desc:0 "qq"

  GER_mobilize_the_workforce:0 "Мобилизация рабочей силы"
  GER_mobilize_the_workforce_desc:0 "Немецкий народ должен был привыкнуть к упадку мира. Рейх больше не может позволить своим гражданам быть ленивыми и слабыми. Каждый гражданин должен стать частью военных усилий."

  GER_wehrmachtshelferinnen:0 "Помощницы Вермахта"
  GER_wehrmachtshelferinnen_desc:0 "Хотя мы никоим образом не сможем убедить фюрера разрешить женщинам служить на передовых позициях, мы сможем решить некоторые из наших кадровых проблем, позволив им выполнять вспомогательные функции."

  GER_appoint_albert_speer:0 "Назначить Альберта Шпеера"
  GER_appoint_albert_speer_desc:0 "Альберт Шпеер займет пост министра экономики и будет «использовать» людей, которых мы завоевали, чтобы дополнить наши отрасли до полной мощности. Работают 24/7, 365 дни в году."
  todt_died:0 "Тодт умер"

  GER_expand_kummersdorf_research_centre:0 "Расширить исследовательский центр Куммерсдорф"
  GER_expand_kummersdorf_research_centre_desc:0 "Куммерсдорф всегда был центром разработки оружия. Инвестируя больше средств в оборудование и обучение персонала, мы можем значительно увеличить темпы развития наших новейших проектов."

  GER_city_festungs:0 "Города крепости"
  GER_city_festungs_desc:0 "Западная стена должна быть улучшена, чтобы включить любую атаку из района Бенилюкса, а также укрепить французскую линию."
  GER_city_festungs_tt:0 "§OОткрывает решения по созданию укреплённых районов для отчаянной обороны.§!"

  GER_flak_towers:0 "Зенитные башни"
  GER_flak_towers_desc:0 "Наша Родина уязвима для крупномасштабных бомбардировок. Инвестируя в крупномасштабные программы по строительству башен Flak, мы можем уничтожить вражеские формирования, защищающие наши промышленные центры."

  GER_realization_of_the_wehrmacht:0 "Реализация Вермахта"
  GER_realization_of_the_wehrmacht_desc:0 "На протяжении десятилетий Германия бездействовала без реальной армии. Сильная Германия нуждается в сильной армии."

  GER_reestablish_jager_training:0 "Восстановить обучение Егерей"
  GER_reestablish_jager_training_desc:0 "Ягеры, или легкая пехота, имеют особую историю в немецкой армии. Их традиции будут продолжены созданием элитного и специализированного горнопехотного подразделения «Гебиргсджагерс»."

  GER_reestablish_jager_training_tt:0 "§YЛюдвиг Кюблер§! станет доступен в качестве генерала\n\n"

  GER_fallschirmjager:0 "Десантные дивизии"
  GER_fallschirmjager_desc:0 "Создание элитного подразделения, способного проводить крупномасштабные воздушно-десантные операции и атаковать противника с непоколебимой лояльностью и высокой степенью мастерства, необходимо для войн, которые стоят перед нами."

  GER_the_heers_new_era:0 "Новая эра армии"
  GER_the_heers_new_era_desc:0 "Наша армия оказалась в новой эре техники и тактики. Мы должны решить, каким путем идти."

  GER_war_of_movement:0 "Война движения"
  GER_war_of_movement_desc:0 "Наш опыт в Великой войне показал нам, что наступление, которое прекращается, является наступлением, которое терпит неудачу. Бронеавтомобили станут ответом на достижение Bewegungskrieg."

  GER_observations_from_spain:0 "Наблюдения из Испании"
  GER_observations_from_spain_desc:0 "Наш опыт победы в Испании был хорошим источником знаний для наших теоретиков брони."

  GER_creation_of_the_panzertruppe:0 "Создание танковой группы"
  GER_creation_of_the_panzertruppe_desc:0 "С введением в вермахт большего количества и разновидностей бронетехники стало очевидно, что необходимо создать новое специальное командование для наших бронетанковых войск."

  GER_refinement_of_bewegungskrieg:0 "Уточнение войны движения"
  GER_refinement_of_bewegungskrieg_desc:0 "Хотя мы добились успеха без танков, мы не достигли совершенства. Bewegungskrieg следует постоянно изучать и совершенствовать."

  GER_a_mechanized_army:0 "Механизированная армия"
  GER_a_mechanized_army_desc:0 "Война за движение является ключом к успеху. Вместо того, чтобы ограничивать наши танки скоростью пехоты, мы должны увеличить скорость пехоты, чтобы идти в ногу с танками!"

  GER_establish_combined_arms:0 "Создание общевойсковых войск"
  GER_establish_combined_arms_desc:0 "Хотя танки выглядят как центр поля боя, они уязвимы и слабы при использовании в одиночку. Их слабости должны дополняться эффективной пехотой."

  GER_aggressive_artillery:0 "Агрессивная артиллерия"
  GER_aggressive_artillery_desc:0 "Мобильные артиллерийские силы должны быть в состоянии идти в ногу с нашими бронетанковыми колоннами и постоянно поддерживать их."

  GER_durchbruchwagen:0 "Машина прорыва"
  GER_durchbruchwagen_desc:0 "Концепция тяжелого прорывного танка началась в 1930 с Durchbruchswagen. Теперь, когда у нас достаточно опыта, мы можем, наконец, преобразовать эту концепцию в реальность."

  GER_plan_the_third_generation:0 "План третьего поколения"
  GER_plan_the_third_generation_desc:0 "С сообщениями о том, что другие страны используют тяжелобронированные танки, мы должны сделать то же самое, но иметь оружие, соответствующее этому."

  GER_luftwaffe_innovations:0 "Инновации ВВС"
  GER_luftwaffe_innovations_desc:0 "Из-за ограничений Версаля мы были вынуждены тайно готовить наши военно-воздушные силы. Теперь, когда мы работаем более открыто, мы можем инвестировать значительные ресурсы в исследования и разработки новых самолетов и тактики."

  GER_the_great_sky_war:0 "Великая небесная война"
  GER_the_great_sky_war_desc:0 "Небо Великой войны было источником большого опыта в отношении сильных сторон и ограничений самолетов. Использование этих знаний поможет в подготовке люфтваффе."

  GER_invest_in_GEMA:0 "Инвестиции в Общество электроакустических и механических аппаратов"
  GER_invest_in_GEMA_desc:0 "Общество электроакустических и механических приборов"

  GER_aeronautic_funding:0 "Авиационное финансирование"
  GER_aeronautic_funding_desc:0 "Никаких расходов на наращивание наших военно-воздушных сил быть не может. Необходимо выделять больше средств, чтобы мы могли выпускать больше самолетов."

  GER_sturzbomber_programm:0 "Программа пикирующего бомбардировщика"
  GER_sturzbomber_programm_desc:0 "Дайв-бомбардировка требует значительных навыков и обучения, чтобы осуществить, но обеспечить почти точную точность. Наши пикирующие бомбардировщики станут ключом к поддержке нашей армии в решающих сражениях."

  GER_long_range_escorts:0 "Истребитель-перехватчик FW-190D"
  GER_long_range_escorts_desc:0 ""

  GER_air_fw:0 "Отдать предпочтение Bf-109"
  GER_air_fw_desc:0 ""

  GER_air_bf:0 "Развитие Bf-109"
  GER_air_fw_desc:0 ""

  GER_improve_the_enigma_machine:0 "Улучшить Энигму"
  GER_improve_the_enigma_machine_desc:0 "Наши разведывательные отчеты показали, что союзники пытаются взломать нашу загадку и расшифровать наши сообщения. Этого нельзя допустить."
  lar_encryption_bonus_tt:0 "§G+1 Криптологический уровень§!"

  GER_v_bomb_project:0 "Проект бомбы V"
  GER_v_bomb_project_desc:0 "Эти летающие бомбы V способны достигать и уничтожать вражеские цели, не требуя плана их доставки. Это оружие позволит нам отомстить тем, кто пытается бомбить немецкую землю."

  GER_collaborations_with_the_japanese:0 "Сотрудничество с японцами"
  GER_collaborations_with_the_japanese_desc:0 "Хотя Китай был союзником Германии на протяжении десятилетий, мы были бы наивны, если бы думали, что они способны помочь нам в любом случае. С другой стороны, японский флот достаточно велик, чтобы угрожать западным державам и может помочь облегчить часть бремени для нас."

  GER_german_luftwaffe_assistance:0 "Помощь Люфтваффе Германии"
  GER_german_luftwaffe_assistance_desc:0 "Японии не хватает промышленности для поддержки большого количества самолетов, необходимых для победы в Тихом океане. Мы поможем им заполнить этот пробел нашими собственными самолетами."

  GER_explotation_of_annexed_nations:0 "В случае успеха произойдет §GМассовое снижение экономической усталости§!\n"

  GER_western_war_plans:0 "Западные военные планы"
  GER_western_war_plans_desc:0 "Мы изначально не ожидали, что Великобритания и Франция сохранят свои обязательства по защите Польши. Теперь, когда наши генералы успели подготовиться, мы можем предпринять необходимые шаги для обеспечения безопасности Западной Европы."


  GER_fate_of_yugoslavia_required_states_tt:0 "§YОсь§! должна контролировать все югославские регионы."



  GER_approach_turkey:0 "Подходит к Турции"
  GER_approach_turkey_desc:0 "Турция существует в ключевом географическом положении как мост к нашим североафриканским владениям, ближневосточной нефти и южному подбрюшью России. Они позиционируют себя как нейтральный игрок, но, возможно, мы можем повлиять на них, чтобы изменить их мнение."

  GER_prepare_barbarossa:0 "Подготовить Барбароссу"
  GER_prepare_barbarossa_desc:0 "Наши враги на Севере, Юге и Западе потерпели поражение. Наш враг на Востоке огромен, и наша армия и логистика должны подготовиться против них."

  GER_eastern_lebensraum:0 "Война с СССР"
  GER_eastern_lebensraum_desc:0 "Гермахт не видел ничего, кроме победы, в то время как большевики тонут в собственной некомпетентности. Нам нужно только выбить дверь, и вся гнилая конструкция рухнет."
  GER_mol_rib_pact_des:0 "Устраняет злых врагов с Советами"

  GER_celebration_of_the_olympics:0 "Празднование Олимпийских игр"
  GER_celebration_of_the_olympics_desc:0 "Олимпиада имела огромный успех. Превосходство немецкой расы и нации было выставлено на всеобщее обозрение."
  olympics_1936:0 "Олимпийские игры 1936 состоялись"



  GER_recruit_from_the_hitler_youth:0 "Вербовка из Гитлерюгенда"
  GER_recruit_from_the_hitler_youth_desc:0 "Гитлерюгенд учит немецкую молодежь идеалам нацистской партии. Из множества потенциальных новобранцев эти дети наиболее фанатичны и готовы пожертвовать собой ради Речи."

  GER_volkssturm:0 "Батальоны фольксштурма"
  GER_volkssturm_desc:0 "В нашей отчаянной защите отечества мы можем поспешно завербовать наших стариков и нашу молодежь в дивизии и заполнить пробелы на линии фронта."

  GER_death_before_defeat:0 "Смерть перед поражением"
  GER_death_before_defeat_desc:0 "Эта война является войной уничтожения. Либо мы уничтожим выродившихся капиталистов и большевиков, либо они уничтожат Германию. Никакой капитуляции быть не может."
  death_before_defeat:0 "Смерть перед поражением"

  SOV_father_of_nations:0 "Отец Русов"
  SOV_father_of_nations_desc:0 "Наш Союз — большая семья русов, а в каждой семье должен быть глава. Этот глава — товарищ Сталин, который следит, чтобы все его многочисленные дети обучались социалистическому мышлению, и ведет нас в светлое будущее. При необходимости он бывает строг, но всегда справедлив и честен."

  GER_split_yugoslavia:0 "Раздел Югославии"
  GER_split_yugoslavia_desc:0 "После завоевания Югославии мы должны поровну разделить страну между Осью."

  GER_split_greece:0 "Раздел Греции"
  GER_split_greece_desc:0 "После завоевания Греции мы должны поровну разделить страну между Осью."

  GER_integrate_romanian_war_economies:0 "Интегрировать Румынию"
  GER_integrate_romanian_war_economies_desc:0 "Румыния превратилась в сферу нашего влияния и стала зависимой от немецкой экономики. Мы могли бы использовать это, чтобы установить контроль над их экономикой и забрать их ресурсы. Это потребует немецких инвестиций взамен, но получение всех прав на их нефть будет огромной помощью для нашей нефтяной ситуации."

  GER_integrate_hungarian_war_economies:0 "Интегрировать Венгрию"
  GER_integrate_hungarian_war_economies_desc:0 "Венгрия превратилась в сферу нашего влияния и стала зависимой от немецкой экономики. Мы могли бы использовать это, чтобы установить контроль над их экономикой и забрать их ресурсы. Это потребует немецких инвестиций в обмен, но, получив все права на венгерские ресурсы, мы решим любые проблемы бокситов, которые у нас могут быть, и поможем нашей железной ситуации."

  GER_proclaim_the_axis_powers:0 "Провозгласить страны Оси"
  GER_proclaim_the_axis_powers_desc:0 "Нет сомнений, что в этот момент ось европейской истории проходит через Берлин."

  GER_condor_legion:0 "Легион Кондор"
  GER_condor_legion_desc:0 "Националистический переворот Франко благоприятен для наших интересов в регионе. Мы должны направить им военную помощь, чтобы они победили коммунистов."

  GER_treaty_of_mutual_assistance:0 "Договор о взаимопомощи"
  GER_treaty_of_mutual_assistance_desc:0 "Италия, родина фашизма, может служить нам важным союзником. Мы должны быть первыми, кто улучшит наши отношения с ними."

  GER_puppet_italy:0 "Кукольная Италия"
  GER_puppet_italy_desc:0 "Мы должны установить окончательную власть в рамках альянса оси и больше не можем позволить Италии действовать независимо от нас. Пришло время выдвинуть ультиматум. Чем больше проблем в Италии, тем выше наши шансы на успех."

  GER_puppet_hungary:0 "Кукольная Венгрия"
  GER_puppet_hungary_desc:0 "Мы должны установить окончательную власть в рамках альянса оси и больше не можем позволить Венгрии действовать независимо от нас. Пришло время выдвинуть ультиматум. Чем больше проблем у Венгрии, тем выше наши шансы на успех."

  GER_puppet_romania:0 "Кукольная Румыния"
  GER_puppet_romania_desc:0 "Мы должны установить окончательную власть в рамках альянса оси и больше не можем позволить Румынии действовать независимо от нас. Пришло время выдвинуть ультиматум. Чем больше проблем в Румынии, тем выше наши шансы на успех."

  GER_puppet_bulgaria:0 "Кукольная Болгария"
  GER_puppet_bulgaria_desc:0 "Мы должны установить окончательную власть в рамках альянса оси и больше не можем позволить Болгарии действовать независимо от нас. Пришло время выдвинуть ультиматум. Чем больше проблем в Болгарии, тем выше наши шансы на успех."

  GER_befriend_sweden:0 "Защитить поставки шведского железа"
  GER_befriend_sweden_desc:0 "Шведское железо жизненно важно для нашей военной машины, без него мы наблюдаем за закрытием большинства наших сталелитейных заводов."

  GER_alliance_with_finland:0 "Альянс с Финляндией"
  GER_alliance_with_finland_desc:0 "Финляндия зарекомендовала себя как компетентная военная сила, даже когда сталкивается с огромными трудностями. Мы должны достучаться до них, готовясь к нашей войне против Советского Союза."

  GER_nationalist_spain_befriend:0 "Подружиться с Испанией"
  GER_nationalist_spain_befriend_desc:0 "Несмотря на то, что мы еще далеки от вступления в войну, мы можем улучшить отношения, обеспечивая постоянную экономическую помощь."

  GER_amphibious_assault_crafts:0 "Амфибийная война"
  GER_amphibious_assault_crafts_desc:0 "Чтобы взять на себя Соединенные Штаты, нам нужно улучшить научно-исследовательское специализированное оборудование для наших военно-морских вторжений."

  GER_endsieg:0 "Endsieg"
  GER_endsieg_desc:0 "С нашим Лебенсраумом у польского и чешского народа нет другого выбора, кроме как принять постоянный немецкий контроль, и процесс ассимиляции может начаться. Это, несомненно, очень поможет в восстановлении нашей территории от великого завоевания Востока, и теперь мы можем сосредоточить все наши усилия на устранении любых угроз для Запада."

  GER_a_new_europe:0 "Новая Европа"
  GER_a_new_europe_desc:0 ""
  GER_reichsprotectorate_tt:0 "Позволяет формировать новые супергосударства на завоёванных территориях §RC В настоящее время не работает §!\n"

  GER_naval_rearmament_tt:0 "§RПеревооружение флота отменится с началом войны§!"

  GER_expand_the_naval_dockyards:0 "Расширьте военно-морские верфи"
  GER_expand_the_naval_dockyards_desc:0 "Наш флот бледнеет по сравнению с западными державами. Если мы хотим иметь возможность вести войну на водах, то наши верфи должны быть расширены для удовлетворения спроса."

  GER_surface_raiders:0 "Поверхностные рейдеры"
  GER_surface_raiders_desc:0 "Наши быстро движущиеся корабли способны преследовать вражеские конвои и уничтожать стандартные флотилии сопровождения. Использование этих доктрин заставит наших врагов раскинуть свои столичные корабли, где их можно будет легко победить в деталях."

  GER_dipose_hitler:0 "Убить Гитлера"
  GER_dipose_hitler_desc:0 "Гитлер ведет страну к катастрофе. Мы не можем больше ждать, чтобы добиться окончательной победы, мы должны очиститься от нацистов и направить нашу нацию в другом направлении."

  GER_form_the_reichskommissariats:0 "Создать Рейхскомиссариаты"
  GER_mol_rib_pact:0 "Пакт Молотова-Риббентропа"

  GER_democratic_party_assassination:0 "Германская империя"

  GER_reintegrate_wwi_territories:0 "Реинтеграция территорий Первой мировой войны"
  GER_reintegrate_wwi_territories_desc:0 "Версаль был отомщен! Немецкие люди, живущие на территориях, которые были украдены у нас, теперь могут быть возвращены в Германию."

  ENG_imperial_conference_tt:0 "Разблокировать§YИмператорская конференция§!Решения для40дней.\n§GРазвивающаяся промышленность в Содружестве обеспечит там прием имперских конференционных бонусов§!\n§OУбедитесь, что у вас есть политическая власть, чтобы использовать их!§!\n"

  SOV_great_purge_tt3:1 "£faction_sov_army §YАрмия§! §Rпотеряет значительную часть влияния§!, снизив прирост §Yполитической власти§! на §R15%§!.\n"

  SOV_emergency_powers_tt:1 "£Faction_sov_workers §YРабочие§! §GПолучают влияние§! и становятся и становится §Gболее лояльными§"






  SOV_formation_of_the_nkvd_tt:0 "£faction_sov_commissars §YКомиссары§! становятся §Gлояльными§! повышая §Yстабильность§! на §G5%§! и увеличивая §Yприрост политической власти§! на §G20%§!."

  SOV_nkvd_divisions_tt:1 "£faction_sov_commissars §YКомиссары§! стали §GНамного более влиятельными§!\n"

  SOV_socialist_science_tt:1 "£Faction_sov_workers §YРабочие§! становятся более §GМотивированными§! увеличивая §YОбъёмы заводского производства§! на §G20%§!"

  SOV_progress_cult_tt:1 "£faction_sov_army §YАрмия§! стала более §Gмотивированной и эффективной§! увеличивая §Yскорость исследований§! на §G8%§!"

  SOV_reinstall_the_Patriarchate_tt:1 "£faction_sov_peasants §YКрестьяне§! становятся §Gлояльными§! §Yстабильность§! увеличивается до §G+10%§!"

  SOV_great_patriotic_war_tt:1 "£faction_sov_army §YАрмия§! §Gполучает влияние§! и становится §Gболее лояльной§!.\n"

  SOV_form_the_stavka_tt:1 "\n£faction_sov_army §YАрмия§! §GПовысит влияние§! и станет §Gболее лояльной§! Увеличив §Yприрост политической власти§! на §G25%§!\n"

