  FRA_unify_the_government:0 "Объединить правительство"
  FRA_unify_the_government_desc:0 "Политика слишком сильно вовлечена в военные дела, при сильном правительстве мы можем добиться большей свободы для наших генералов и учёных."

  FRA_national_centre_for_scientific_research:0 "Национальный центр научных исследований"
  FRA_national_centre_for_scientific_research_desc:0 "Мы обязаны обьединить все центры исследователей под одной крышей, увеличив их эффективность."

  FRA_richelieu_tt:0 "Добавляет 2 линкора класса Richelieu Class в очередь производства с §Y50%§! и §Y35%§! прогрессом соответственно"

  FRA_joffre_tt:0 "Добавляет 1 авианосец класса Joffre Class в очередь производства с §Y40%§! прогрессом"

  FRA_industrial_expansion_effect_tt:0 "Добавляет 6 §YГражданских Фабрик§! в ранее проинвестированные регионы метрополии."
  FRA_military_factories_effect_her_tt:0 "Добавляет 6 §YВоенных заводов§! в ранее проинвестированные регионы метрополии и 4 §YВоенных завода§! в ранее проинвестированные колониальные регионы."
  FRA_colonial_industry_effect_her_tt:0 "Добавляет 4 §YГражданских фабрик§! в ранее проинвестированные колониальные регионы."

  FRA_border_defense:0 "Оборона на границах"
  FRA_border_defense_desc:0 "Мы должны подготовиться к борьбе на нашей земле, используя наши преимущества нашей земли, тогда мы сможем вести битву с врагом на наших условиях."

  FRA_air_based_sea_supremacy:0 "Воздушно-морское превосходство"
  FRA_air_based_sea_supremacy_desc:0 "Уничтожать корабли другими кораблями - дорого. Дешевле использовать авиацию для уничтожения вражеского флота, пока наши находятся в относительной безопасности в порту."

  FRA_develop_colonial_dockyards:0 "Развить метропольные верфи"
  FRA_develop_colonial_dockyards_desc:0 "У нас огромная колониальная империя. Чтоб убедиться, что наши воды в безопасности, нам нужно больше кораблей, и соответсвенно больше верфей."

  FRA_send_officers_to_the_uk:0 "Отправить офицеров в Великобританию"
  FRA_send_officers_to_the_uk_desc:0 "Британское высшее командование предложило нам тренировку некоторых наших офицеров, для специальных операций."

  FRA_special_forces_joint_training:0 "Присоединиться к тренировкам спец войск"
  FRA_special_forces_joint_training_desc:0 "Мы были приглашены присоединиться к тренировкам британских спец войск в Шотландии"

  FRA_special_forces:0 "Реорганизовать Иностранный Легион"
  FRA_special_forces_desc:0 "Французский Иностранный Легион - элитные войска, собранные с помощью волонтёров со всего мира. Может мы сможем улучшить их боевые качества, соединив разные подразделения в одну дивизию."

  FRA_new_army_bureau:0 "Новое армейское бюро"
  FRA_new_army_bureau_desc:0 "Стратегии войны эволюционировали быстрее, чем мы могли себе представить. Дополнительные силы были выделены армии, с целью улучшения нашей стратегии и тактики."

