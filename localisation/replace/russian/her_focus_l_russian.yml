  JAP_interservice_rivalry_against_kantaiha_1_tt:1 "£faction_jap_kantaiha §YФракция флота§! станет более §RОслабленной§! уменьшая §YПроизводительность верфей§! на §R10%§! и уменьшая §YСкорость строительства верфей§! на §R5%§!\n"

