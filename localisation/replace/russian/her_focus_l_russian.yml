  ENG_rations_from_india:0 "Рационы из Индии"
  ENG_rations_from_india_desc:0 ""

  ENG_create_unit_airborne_tt:0 "Получить шаблон элитной воздушно-десантной дивизии."

  ENG_mountaineers:0 "Королевские горцы"
  ENG_mountaineers_desc:0 "Требуется опыт боевых действий в горных районах. Опыт горных отрядов САС должен дать нам знания, чтобы мы могли начать подготовку целых дивизий."
  ENG_create_unit_mountaineer_tt:0 "Получить шаблон элитной горной дивизии."

  ENG_disunite_the_french_union:0 "Разъединить Французский Союз"
