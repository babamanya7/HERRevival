  SOV_air_reform_2_tt:0 "$SOV_modify_airforce_ns_intro$ \n£experience_neutral_combat_texticon Получаемый опыт за задания авиакрыла: §G+40.00%§! \n£air_doctrine_cost_texticon Стоимость воздушной доктрины: §G-50.00%§! \n£speed_air_texticon Маневренность: §G+10.00%§! \n£attack_air_texticon Воздушная атака: §G+10.00%§! \n£defence_air_texticon Противовоздушная оборона: §G+10.00%§! \n£cas_texticon Коэффициент авиаштурмовой атаки: §G+20.00%§!\n£air_experience Получаемый опыт авиации: §G+20.00%§! \n\n"

  SOV_navy_reform_1_tt:0 "$SOV_modify_red_fleet_ns_intro$ \n£attack_texticon  Атака палубной авиации: §G+20.00%§! \n£attack_battleship_texticon  Атака крупных кораблей: §G+10.00%§! \n£defence_battleship_texticon  Броня крупных кораблей: §G+5.00%§! \n£attack_submarine_texticon  Атака подводных лодок: §G+10.00%§! \n£defence_submarine_texticon  Защита подводных лодок: §G+5.00%§! \n£attack_screen_texticon  Атака охранения: §G+10.00%§! \n£defence_screen_texticon  Защита охранения: §G+5.00%§! \n£navy_doctrine_cost_texticon  Стоимость морской доктрины: §G-50.00%§!\n\n"
  SOV_navy_reform_2_tt:0 "$SOV_modify_red_fleet_ns_intro$ \n£attack_texticon  Атака палубной авиации: §G+20.00%§! \n£attack_battleship_texticon  Атака крупных кораблей: §G+10.00%§! \n£defence_battleship_texticon  Броня крупных кораблей: §G+5.00%§! \n£attack_submarine_texticon  Атака подводных лодок: §G+10.00%§! \n£defence_submarine_texticon  Защита подводных лодок: §G+5.00%§! \n£attack_screen_texticon  Атака охранения: §G+10.00%§! \n£defence_screen_texticon  Защита охранения: §G+5.00%§! \n£navy_doctrine_cost_texticon  Стоимость морской доктрины: §G-50.00%§!\n\n"

