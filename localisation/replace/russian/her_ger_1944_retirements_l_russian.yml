l_russian:
 her_ger_retirements.1.t: "Отставка Манштейна и Клейста"
 her_ger_retirements.1.d: "Положение группы армий «Юг» и группы армий «А» на Украине стало критическим. Советские войска вернули Винницу и Проскуров, прорвались к Южному Бугу и освободили Николаев. После новых разногласий с Гитлером генерал-фельдмаршалы Эрих фон Манштейн и Эвальд фон Клейст отстранены от командования и отправлены в отставку. Их группы армий переходят к другим командующим."
 her_ger_retirements.1.a: "Их время прошло."

 GER_dismantle_maginot_desc: "снести это бетонное уебище"
