l_russian:
 her_ger_retirements.1.t: "Отставка Манштейна и Клейста"
 her_ger_retirements.1.d: "После тяжёлых поражений на Восточном фронте и новых разногласий с Гитлером генерал-фельдмаршалы Эрих фон Манштейн и Эвальд фон Клейст отстранены от командования. 30 марта 1944 года оба были вызваны в ставку, награждены и отправлены в отставку. Их группы армий переходят к другим командующим."
 her_ger_retirements.1.a: "Их время прошло."

 GER_dismantle_maginot_desc: "Снести это бетонное уебище."
