  USA_agricultural_adjustment_act_1_desc:0 "Первый закон о сельскохозяйственной корректировке, направленный на повышение цен на продукты питания, был системой, в которой федеральное правительство платило фермерам за сельскохозяйственную продукцию только для того, чтобы избавиться от них, снижая излишки и повышая цены, а также платя фермеру не сажать сельскохозяйственные культуры и финансируя это через налог на производителей продуктов питания."

