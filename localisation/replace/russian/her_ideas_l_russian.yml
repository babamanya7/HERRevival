  FRA_structured_doctrines:0 "Структурированные доктрины"
  FRA_structured_doctrines_desc:0 "Поскольку каждый резервист во Франции должен был регулярно переделывать некоторые тренировки, французские военные решили принять очень структурные, фиксированные и постоянные доктрины, чтобы убедиться, что каждый солдат будет хорошо подготовлен в случае мобилизации. Позволяя французским солдатам иметь достаточную подготовку, это также усложнило модернизацию французских доктрин."
  FRA_structured_doctrines_1:0 "Структурированные доктрины"
  FRA_structured_doctrines_1_desc:0 "Поскольку каждый резервист во Франции должен был регулярно переделывать некоторые тренировки, французские военные решили принять очень структурные, фиксированные и постоянные доктрины, чтобы убедиться, что каждый солдат будет хорошо подготовлен в случае мобилизации. Позволяя французским солдатам иметь достаточную подготовку, это также усложнило модернизацию французских доктрин."
  FRA_structured_doctrines_2:0 "Структурированные доктрины"
  FRA_structured_doctrines_2_desc:0 "Поскольку каждый резервист во Франции должен был регулярно переделывать некоторые тренировки, французские военные решили принять очень структурные, фиксированные и постоянные доктрины, чтобы убедиться, что каждый солдат будет хорошо подготовлен в случае мобилизации. Позволяя французским солдатам иметь достаточную подготовку, это также усложнило модернизацию французских доктрин."

  GER_SS_redirection_of_war_production:0 "Перенаправление военного производства в СС"
  GER_SS_redirection_of_war_production_desc:0 "В соответствии с соглашением Гиммлера-Спира, между 5% и 8% военного производства Германии был перенаправлен на Waffen-SS."

  GER_SS_redirection_of_war_production_1:0 "Перенаправление военного производства в СС"
  GER_SS_redirection_of_war_production_1_desc:0 "В соответствии с соглашением Гиммлера-Спира, между 5% и 8% военного производства Германии был перенаправлен на Waffen-SS."

  SELECT_DESIGN_COMPANY_DESC:0 "\nВыбрав это§YДизайнерская компания§!Это улучшит производство на всех типах оборудования, перечисленных выше, даже если они уже были исследованы.\n"
  DESIGN_COMPANY_DESC:0 "§YКонструкторская компания§! постоянно улучшает производство всех перечисленных выше типов техники, даже если они уже исследованы.\n"

  FRA_protected_by_the_maginot_line_1:0 "Под защитой линии Мажино"
  FRA_protected_by_the_maginot_line_1_desc:0 "Укрепление границы дает Франции возможность тщательно планировать и готовиться, но при этом жертвует некоторой гибкостью в случае чего-то неожиданного."
