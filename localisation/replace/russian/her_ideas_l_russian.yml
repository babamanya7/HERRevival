  inexperienced_work_force:0 "Неопытная рабочая сила"
  inexperienced_work_force_desc:0 "Вынуждение многих крестьян и фермеров работать на фабриках привело к большим потерям в эффективности и производстве. Мы должны провести некоторые реформы и дать рабочим время адаптироваться к новым постоянным рабочим местам."

  SOV_second_five_year_plan_12_dynamic_modifier:0 "Советская промышленность"
  SOV_second_five_year_plan_12_dynamic_modifier_desc:0 "Вытеснение многих крестьян и фермеров на фабрики привело к большим потерям в эффективности и производстве. Мы должны провести некоторые реформы и дать рабочим время адаптироваться к новым постоянным рабочим местам. Наша великая промышленность остается слабой, пока мы не сможем завершить пятилетний план и привести нашу страну в современную эпоху."
