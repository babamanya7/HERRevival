 sp_air_reward_option_upgrades_focus:0 "Турбокомпрессор или Нагнетатель?"
 sp_air_reward_option_upgrades_focus_desc:0 "Турбокомпрессор или Нагнетатель? Нагнетатель — механический агрегат, осуществляющий сжатие газа без его охлаждения. Компрессоры, в отличие от нагнетателей, охлаждают газ."
 sp_air_reward_option_supercharger:0 "Нагнетатель"
 sp_air_reward_option_turbocharger:0 "Турбокомпрессор"
 sp_air_supercharger_tt:0 "Исследования и разработки Нагнетателей"
 sp_air_turbocharger_tt:0 "Исследования и разработки Турбокомпрессоров"
 sp_air_engine_upgrades_2:0 "Улучшенные механические агрегаты"
 sp_air_engine_upgrades_2_desc:0 "Улучшенные механические агрегаты"
 
 sp_land_alloying_armor:0 "Легирование брони"
 sp_land_alloying_armor_desc:0 "Легирование брони танков — это процесс добавления в сталь легирующих элементов для улучшения её механических свойств, в частности, прочности и ударной вязкости, что необходимо для защиты от современных боеприпасов. Легирующие элементы, такие как хром, никель, молибден, ванадий, марганец и кремний, меняют структуру стали, делая её более устойчивой к деформации и разрушению при попадании снарядов."
 
 sp_battlecarrier: "Боевой авианосец"
 sp_battlecarrier_desc: "Боевой авианосец — гибридный корабль с чертами как линкора, так и авианосца. Идея была предложена некоторыми военно-морскими архитекторами из разных стран с акцентом на оба типа кораблей."
 sp_subcarrier: "Подлодка-носитель"
 sp_subcarrier_desc: "Подлодка-носитель на самом деле является большой подводной лодкой, способной запускать самолеты. Несмотря на более легкие и меньшие самолеты, их нелегко разместить в узком пространстве подлодок, что ограничивает вместимость подлодки примерно 2."
 sp_nuclear_torpedo: "Ядерная торпеда"
 sp_nuclear_torpedo_desc: "Подводный ядерный взрыв может быть смертельным для надводных кораблей и подводных лодок. Установка мини-ядерной боеголовки на торпеду сделает ее самым мощным оружием, когда-либо использовавшимся на подводных лодках."
 sp_super_heavy_guns: "Сверхтяжелое морское орудие"
 sp_super_heavy_guns_desc: "Сверхтяжелая корабельная артиллерия — это орудие калибром более 18 дюймов (460 мм)."
 sp_mega_carrier: "Стратегический ударный авианосец"
 sp_mega_carrier_desc: "Ударный авианосец — это истинное воплощение плавучего аэродрома, способного запускать тяжелые реактивные самолеты с больших расстояний."
 sp_arsenal_ship: "Корабль-арсенал"
 sp_arsenal_ship_desc: "Поскольку ракеты все больше признаются будущим военного дела, возникает концепция корабля-арсенала с сотнями пусковых установок ракет."
 sp_early_informatization_system: "Система ранней информатизации"
 sp_early_informatization_system_desc: "В отличие от морских войн прошлого, форма будущих войн демонстрирует сильную зависимость от сбора и обработки данных, находящихся за пределами человеческого понимания, и информатизация является единственным путем к победе в ближайшие десятилетия."
 sp_high_speed_light_engine: "Котёл высокого давления"
 sp_high_speed_light_engine_desc: "Сочетание высокотемпературных пароперегревателей и мощных паровых турбин разгонит корабль до беспрецедентной скорости."

 sp_battlecarrier_unique_reward_a: "Дебаты о роли боевого авианосца"
 sp_battlecarrier_unique_reward_a_desc: "В процессе итерации боевого авианосца возникает вопрос: стоит ли нам сосредоточиться на его производительности или на координации с другими кораблями?"
 sp_battlecarrier_perference_a: "Производительность"
 sp_battlecarrier_perference_b: "Координация"
 sp_subcarrier_unique_reward_a: "Применение инженерного опыта"
 sp_subcarrier_unique_reward_a_desc: "В процессе итерации субконтейнера возникает вопрос: следует ли использовать опыт только по крейсерским подводным лодкам или по всем типам подводных лодок?"
 sp_subcarrier_perference_a: "Крейсерская подводная лодка"
 sp_subcarrier_perference_b: "Все подводные лодки"
 sp_nuclear_torpedo_unique_reward_a: "Ориентация проекта «Ядерная торпеда»"
 sp_nuclear_torpedo_unique_reward_a_desc: "Безопасность хранения ядерных боеголовок на подводных лодках остается под вопросом."
 sp_nuclear_torpedo_preference_a: "Безопасность прежде всего"
 sp_nuclear_torpedo_preference_b: "Расширенное хранилище"
 sp_super_heavy_guns_unique_reward_a: "В погоне за 20-дюймовым ружьем"
 sp_super_heavy_guns_unique_reward_a_desc: "В разработке сверхтяжелых морских орудий была предложена еще более дикая идея финансировать исследования более крупных орудий. Если мы решим добиться прорыва в этом направлении, то текущий прогресс будет затронут."
 sp_super_heavy_guns_preference_a: "Предоставить"
 sp_super_heavy_guns_preference_b: "Забудем это"
 sp_early_informatization_system_unique_reward_a: "Усилия по информатизации"
 sp_early_informatization_system_unique_reward_a_desc: "Ведущая группа НИОКР в области компьютерных наук предложила проект по расширению системы информатизации и объединению всех электронных устройств военно-морских судов в коллективную компьютерную систему. Это интересная идея, но она значительно замедлит исходную программу."
 sp_early_informatization_system_perference_a: "Соблюдайте умеренность."
 sp_early_informatization_system_perference_b: "Cэкономить немного бюджетов."
 
 
