l_russian:
 MTG_treaty_renew_mission: "Подписание второго Лондонского морского договора"
 MTG_treaty_renew_mission_desc: "Второй Лондонский морской договор был призван ограничить рост морских вооружений до истечения срока ее действия в 1942 году."
 MTG_naval_treaty_adherent: "Участник Лондонского морского договора"
 MTG_naval_treaty_adherent_desc: "Мы подписали Лондонский морской договор и, соответственно, ограничены в размерах наших капитальных кораблей. Кроме того, Лондонский протокол о подводных лодках (правила для крейсеров) ввел строгие правила для торгового рейдерства."
 MTG_naval_treaty_adherent_reduced: "Задействована особая оговорка"
 MTG_naval_treaty_adherent_reduced_desc: "После того как некоторые стороны, подписавшие Вашингтонский морской договор, отказались от Лондонского морского договора, мы задействовали особую оговорку, снизив ограничения на размер и вооружение наших крупных кораблей."
 MTG_naval_treaty_adherent_1936: "Участник Лондонского морского договора"
 MTG_naval_treaty_adherent_1936_desc: "Мы подписали Лондонский морской договор и, соответственно, ограничены в размерах наших капитальных кораблей. Кроме того, Лондонский протокол о подводных лодках (правила для крейсеров) ввел строгие правила для торгового рейдерства."
 MTG_treaty_rejoin_mission: "Повторное присоединение ко Второму Лондонскому морскому договору"
 MTG_treaty_rejoin_mission_desc: "Мы не подписали договор к установленному сроку. Теперь это наш последний шанс присоединиться к нему, иначе через год будет активирована особая оговорка."
 MTG_escalator_clause_condition: "Ни одна страна не отказалась продлить договор."
 fascism_renew_naval_treaty_tt: "§RПродолжение переговоров по морскому договору возмутит большинство членов нашего правительства.§!"
 democracy_renew_naval_treaty_tt: "§GПродолжение переговоров по морскому договору порадует общественность.§!"
 MTG_abandon_treaty_tt: "§RМы столкнемся с серьезными последствиями.§!"

 washington_treaty_article_xix: "Вашингтонский морской договор: Статья XIX"
 washington_treaty_article_xix_desc: "Статья XIX Вашингтонского морского договора запрещает нам строить новые морские базы или береговые бункеры на островах Тихого океана."