l_russian:
 submarine: "Подлодка"
 submarine_desc: "Подводные лодки - это скрытные рейдовые корабли. Тяжелые подводные лодки крупнее и мощнее, имеют большую дальность плавания и способны наносить бомбовые удары по поверхности и берегу."
 both_cruisers_desc: "Легкий крейсер - эволюционировал от защищенного крейсера и стал более гибким, его основная задача - защищать крупные корабли от вражеских легких кораблей, но он также может выпускать мощные торпеды, способные нанести урон более крупным кораблям.\n\nТяжелый крейсер - эволюционировал от защищенного крейсера и стал более крупным, большой крейсер оснащен 8-дюймовыми или более крупными орудиями и хорошей броней. Это хороший выбор для тех, кто не может позволить себе строить большие корабли."
 light_cruiser: "Легкий Крейсер"
 light_cruiser_desc: "Эволюционировав из защищенного крейсера и став более гибким, его основная задача - прикрывать крупные корабли от вражеских легких кораблей, но он также может выпускать мощные торпеды, способные повредить более крупные корабли."
 heavy_cruiser: "Тяжелый крейсер"
 heavy_cruiser_desc: "Эволюционировав из защищенного крейсера и увеличившись в размерах, тяжелый крейсер оснащен 8-дюймовыми орудиями и неплохой броней. Это хороший выбор для наций, которые не могут позволить себе построить более крупные корабли.\nЭтот тип кораблей работает в капитальной линии."
 medium_cruiser: "Тяжелый флотский крейсер"
 medium_cruiser_desc: "Эволюционировав из защищенного крейсера и увеличившись в размерах, тяжелый крейсер оснащен 8-дюймовыми орудиями и неплохой броней. Это хороший выбор для наций, которые не могут позволить себе построить более крупные корабли.\nЭтот тип кораблей действует в линии экрана."
 destroyer: "Эсминец"
 destroyer_desc: "Самый легкий корабль охранения. Его задача - защищать более крупные корабли, а также находить и уничтожать подводные лодки."
 ship_hull_light: "Легкий корпус"
 ship_hull_light_desc: "Самый легкий корабль охранения. Его задача - защищать более крупные корабли, а также находить и уничтожать подводные лодки."
 carrier: "Авианосец"
 carrier_desc: "Крупный корабль, способный нести в бой крылья мощных самолетов. Также полезен в качестве плавучего аэродрома, который можно расположить у побережья противника."
 battleship: "Линкор"
 battleship_desc: "Линкоры - это корабли среднего уровня с универсальными характеристиками. Они балансируют между скоростью, броней и огневой мощью, но не превосходят их ни в одной области."
 battle_cruiser: "Линейный крейсер"
 battle_cruiser_desc: "Крупный корабль с наступательными способностями, близкими к боевым, но с более слабой броней, замененной на более высокую скорость."
 convoy: "Конвой"
 convoy_desc: "Конвои используются для международной торговли товарами и ресурсами. Также используются для переброски войск и морских вторжений."
 sh_battleship: "Сверхтяжелый линкор"
 sh_battleship_desc: "Самый большой корабль с самыми большими пушками и самой прочной броней, которую только можно купить за деньги. Такое дорогое вложение заслуживает должной поддержки со стороны меньших кораблей."
 SH_battleship: "Сверхтяжелый линкор"
 SH_battleship_desc: "Самый большой с самыми большими пушками и самой прочной броней, которую только можно купить за деньги. Такое дорогое вложение заслуживает должной поддержки со стороны меньших кораблей."
 battlecarrier: "Линейный Авианосец"
 battlecarrier_desc: "Большой, часто гипотетический, гибридный корабль, призванный сочетать в себе черты авианосца и линкора или крейсера."
 auxiliary_ship: "Вспомогательный корабль"
 auxiliary_ship_desc: "Вспомогательное судно гражданского образца, отвечающее за поддержку флота."
 
 cv_cas: "Пикирующий бомбардировщик (авианосец)"
 cv_CAS_equipment_desc: "Пикирующий бомбардировщик - это бомбардировщик, который пикирует прямо на цель, чтобы обеспечить большую точность сброса бомбы."
 cv_nav_bomber: "Торпедоносец (авианосец)"
 cv_nav_bomber_equipment_desc: "Бомбардировщик-торпедоносец - это военный самолет, предназначенный в основном для атаки кораблей с помощью авиационных торпед."

 damaged_fire_control: "Поврежденная система управления огнем"
 damaged_wooden_flight_deck: "Поврежденная деревянная летная палуба"
 damaged_armored_flight_deck: "Поврежденная бронированная летная палуба"
 gas_leakage: "Утечка газа"