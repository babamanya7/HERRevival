 local_logicist_center:0 "Стратегическая база снабжения"
 local_logicist_center_plural:0 "Стратегическая база снабжения"
 local_logicist_center_desc:0 "Заблаговременное планирование создания стратегических баз снабжения может улучшить ситуацию с местным снабжением, увеличить количество войск, которые могут быть поддержаны в регионе, и уменьшить чрезмерную зависимость региона от поставок из столицы. Обычно они строятся на какой-нибудь очень важной территории, на охрану которой приходится тратить много армий. Каждый раз при их постройке потолок местного снабжения будет увеличиваться в 2 раза, а максимум можно увеличить в 10 раз.\n§g(После завершения строительства вступит в силу в течение недели.)§!"
 
