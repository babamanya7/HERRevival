 left_rubber_text:0 "§MПодробная информация о стратегическом запасе резины§!"
 left_rubber_desc:0 "Текущие запасы резины: [?left_rubber] (Вместимость: [?rubber_cap])\n§g(Вместимость зависит от количества складов резины × 100000)§!\nДневная пропускная способность: [?rubber_speed|H]\n§g(Пропускная способность зависит от количество складов × 500)§!\nИспользуется: [?rubber_storage_use|R]\nОтправляется на склад: [?daily_left_rubber|G]\n§g------------§!\n§gКогда запросы производства превышают добычу - использование со склада начнется автоматически.\nЕсли добыча резины превышает текущие запросы - излишки будут перемещены на склад.§!"
 
