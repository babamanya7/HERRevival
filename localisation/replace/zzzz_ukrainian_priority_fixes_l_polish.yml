l_polish:
 GER_reintegrate_wwi_territories:0 "Реінтеграція територій Першої світової війни"
 GER_reintegrate_wwi_territories_desc:0 "За Версаль відплачено! Німці, що живуть на територіях, які в нас відібрали, тепер можуть повернутися до Німеччини."
 GER_form_the_reichskommissariats:0 "Створити райхскомісаріати"
 GER_form_the_reichskommissariats_desc:0 "Ми зможемо ефективніше розпоряджатися ресурсами, промисловими потужностями та робочою силою, якщо організуємо квазіавтономні підпорядковані нам уряди на окупованих територіях."
 GER_reichkommissariats_governments:0 "Райхскомісаріати"
 GER_reichkommissariats_governments_desc:0 "З утворенням різних райхскомісаріатів ми зможемо ефективніше боротися з опором."
 GER_reorganize_the_wehrmacht:0 "Реорганізація Вермахту"
 GER_reorganize_the_wehrmacht_desc:0 "Для того, щоби ми могли виконати фюрерові амбіційні плани, у Вермахті має відбутися масштабна реорганізація. Забагато нинішніх керівників витрачають свій час на висловлення дріб'язкових і безпідставних занепокоєнь замість виконувати фюрерові накази. Лише усунувши цих людей, ми зможемо досягти наших цілей!"
 SOV_war_heroes:0 "Герої війни"
 SOV_war_heroes_desc:0 "Росіяни завжди вміли й хотіли здійснювати вчинки надзвичайної хоробрості заради перемоги над будь-яким загарбником батьківщини. Хоча ми єдині в нашій боротьбі проти ворога, ми не повинні вдавати, що в нашій армії немає солдатів, які зробили значно більше, ніж вимагав службовий обов'язок."
 VICTORY_POINTS_13239:0 "Митищі"
