l_russian:
 hungary.7.t:0 "Венгрия присоединяется к Оси"
 hungary.7.d:0 "После пересмотра Трианонского договора и укрепления экономических связей с Германией венгерское правительство окончательно связывает внешнюю политику страны с Берлином. Венгрия присоединяется к державам Оси."
 hungary.7.a:0 "Наше место рядом с Германией."

 bulgaria.6.t:0 "Болгария присоединяется к Оси"
 bulgaria.6.d:0 "Возвращение Южной Добруджи и растущее германское влияние на Балканах подтолкнули Софию к присоединению к Тройственному пакту. Болгария вступает в состав держав Оси, сохраняя пока дистанцию от непосредственного участия в войне."
 bulgaria.6.a:0 "Присоединиться к Тройственному пакту."

 her_balkans.1.t:0 "Югославия и Тройственный пакт"
 her_balkans.1.d:0 "Окружённое державами Оси и испытывающее сильное давление со стороны Берлина югославское правительство согласилось присоединиться к Тройственному пакту. Этот шаг должен сохранить страну вне войны, но вызвал резкое недовольство противников сближения с Германией."
 her_balkans.1.a:0 "Подписать протокол о присоединении."

 her_balkans.2.t:0 "Переворот в Белграде"
 her_balkans.2.d:0 "Военные, выступавшие против соглашения с державами Оси, свергли правительство, подписавшее Тройственный пакт. В Берлине переворот воспринят как открытый вызов германской политике на Балканах."
 her_balkans.2.a:0 "Ситуация изменилась в одночасье."

 her_balkans.3.t:0 "Директива №25"
 her_balkans.3.d:0 "После переворота в Белграде германское руководство решило уничтожить Югославию как политический и военный фактор на Балканах. Подготовка завершена: войска получают приказ перейти границу. Одновременно, если война Италии против Греции продолжается, германские силы вступают в кампанию на греческом направлении."
 her_balkans.3.a:0 "Начать Балканскую кампанию."

 her_balkans.4.t:0 "Венгрия вступает в войну против Югославии"
 her_balkans.4.d:0 "После начала германского вторжения распад югославской обороны позволил Венгрии вступить в кампанию и предъявить свои территориальные претензии к северным районам Югославии."
 her_balkans.4.a:0 "Вперёд."
