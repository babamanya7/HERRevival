 her_general_staff.ack: "Принято."

 her_general_staff.1.t: "Смена главнокомандующего"
 her_general_staff.1.d: "Максим Вейган назначен главнокомандующим вооружёнными силами Франции вместо Мориса Гамелена."

 her_general_staff.10.t: "Смена начальника Имперского Генштаба"
 her_general_staff.10.d: "Джон Вирекер, лорд Горт, назначен начальником Имперского Генштаба."
 her_general_staff.11.t: "Смена начальника штаба ВВС"
 her_general_staff.11.d: "Сирил Ньюолл назначен начальником штаба Королевских ВВС."
 her_general_staff.12.t: "Новый Первый морской лорд"
 her_general_staff.12.d: "Дадли Паунд назначен Первым морским лордом."
 her_general_staff.13.t: "Перестановки в Имперском Генштабе"
 her_general_staff.13.d: "Эдмунд Айронсайд назначен начальником Имперского Генштаба, Рональд Адам — его заместителем."
 her_general_staff.14.t: "Перестановки в Имперском Генштабе"
 her_general_staff.14.d: "Джон Дилл назначен начальником Имперского Генштаба, Генри Паунолл — его заместителем."
 her_general_staff.15.t: "Смена начальника штаба ВВС"
 her_general_staff.15.d: "Чарльз Портал назначен начальником штаба Королевских ВВС."
 her_general_staff.16.t: "Перестановки в Имперском Генштабе"
 her_general_staff.16.d: "Алан Брук назначен начальником Имперского Генштаба, Арчибальд Най — его заместителем."
 her_general_staff.17.t: "Председатель Комитета начальников штабов"
 her_general_staff.17.d: "Алан Брук возглавил Комитет начальников штабов."
 her_general_staff.18.t: "Новый Первый морской лорд"
 her_general_staff.18.d: "Эндрю Каннингем назначен Первым морским лордом."

 her_general_staff.20.t: "Смена начальника штаба армии"
 her_general_staff.20.d: "Джордж Маршалл назначен начальником штаба армии США."
 her_general_staff.21.t: "Новое руководство армейской авиации"
 her_general_staff.21.d: "Генри Арнольд назначен командующим ВВС армии США."
 her_general_staff.22.t: "Начальник военно-морских операций"
 her_general_staff.22.d: "Гарольд Старк назначен начальником военно-морских операций."
 her_general_staff.23.t: "Начальник Отдела военных планов"
 her_general_staff.23.d: "Дуайт Эйзенхауэр назначен начальником Отдела военных планов Генерального штаба."
 her_general_staff.24.t: "Главнокомандующий флотом США"
 her_general_staff.24.d: "Эрнест Кинг назначен главнокомандующим флотом США."
 her_general_staff.25.t: "Начальник штаба ВВС армии"
 her_general_staff.25.d: "Карл Спаатс назначен начальником штаба ВВС армии США."
 her_general_staff.26.t: "Формирование командования Сухопутных войск"
 her_general_staff.26.d: "Лесли Макнейр назначен командующим Сухопутными войсками, Джозеф Макнарни — заместителем начальника штаба армии."
 her_general_staff.27.t: "Смена начальника военно-морских операций"
 her_general_staff.27.d: "Эрнест Кинг назначен начальником военно-морских операций."
 her_general_staff.28.t: "Смена начальника Оперативного отдела"
 her_general_staff.28.d: "Томас Хэнди возглавил Оперативный отдел Генерального штаба армии."
 her_general_staff.29.t: "Начальник штаба Главнокомандующего"
 her_general_staff.29.d: "Уильям Леги назначен начальником штаба Главнокомандующего и становится старшим военным советником президента."

 her_general_staff.40.t: "Генеральный инспектор авиации армии"
 her_general_staff.40.d: "Хидэки Тодзио назначен генеральным инспектором авиации армии."
 her_general_staff.41.t: "Смена генерального инспектора авиации"
 her_general_staff.41.d: "Ёримити Судзуки назначен генеральным инспектором авиации армии."
 her_general_staff.42.t: "Смена начальника Генштаба армии"
 her_general_staff.42.d: "Хадзимэ Сугияма назначен начальником Генерального штаба армии."
 her_general_staff.43.t: "Смена начальника Морского генштаба"
 her_general_staff.43.d: "Осами Нагано назначен начальником Морского генерального штаба."
 her_general_staff.44.t: "Смена генерального инспектора авиации"
 her_general_staff.44.d: "Кэндзи Доихара назначен генеральным инспектором авиации армии."
 her_general_staff.45.t: "Смена генерального инспектора авиации"
 her_general_staff.45.d: "Такэо Ясуда назначен генеральным инспектором авиации армии."
 her_general_staff.46.t: "Перестановки в высшем командовании"
 her_general_staff.46.d: "Хидэки Тодзио возглавил Генеральный штаб армии, Сигэтаро Симада — Морской генеральный штаб."
 her_general_staff.47.t: "Перестановки в высшем командовании"
 her_general_staff.47.d: "Ёсидзиро Умэдзу назначен начальником Генерального штаба армии, Косиро Оикава — начальником Морского генерального штаба."
