l_russian:
 sp_naval_light_medium_shells_1:0 "Совершенствование морских снарядов I"
 sp_naval_light_medium_shells_1_desc:0 "Разработка более эффективных боеприпасов для лёгкой и средней корабельной артиллерии позволит повысить бронепробиваемость и разрушительное действие без полной замены орудийных установок."
 sp_naval_light_medium_shells_1_output_tt:0 "§YЛёгкая и средняя корабельная артиллерия:§! атака и бронепробитие §G+5%§!.\n§YЛёгкие крейсеры:§! атака и бронепробитие лёгких орудий §G+10%§!."
 sp_naval_light_medium_shells_2:0 "Совершенствование морских снарядов II"
 sp_naval_light_medium_shells_2_desc:0 "Новые формы корпусов снарядов, улучшенные взрыватели и более совершенные бронебойные наконечники повышают эффективность лёгкой и средней артиллерии против современных целей."
 sp_naval_light_medium_shells_2_output_tt:0 "§YЛёгкая и средняя корабельная артиллерия:§! атака и бронепробитие §G+5%§!.\n§YЛёгкие крейсеры:§! атака и бронепробитие лёгких орудий §G+10%§!."
 sp_naval_heavy_shells_1:0 "Тяжёлые морские снаряды I"
 sp_naval_heavy_shells_1_desc:0 "Оптимизация тяжёлых бронебойных снарядов и их баллистики повышает эффективность главного калибра линейных кораблей в бою с защищёнными целями."
 sp_naval_heavy_shells_1_output_tt:0 "§YЛинкоры, линейные крейсеры, сверхтяжёлые линкоры и линейные авианосцы:§! атака и бронепробитие тяжёлых орудий §G+5%§!.\nОткрывает модуль §YВысокоскоростной снаряд§!."
 sp_naval_heavy_shells_2:0 "Тяжёлые морские снаряды II"
 sp_naval_heavy_shells_2_desc:0 "Дальнейшее развитие тяжёлых боеприпасов требует новых сплавов, улучшенной термообработки и более совершенных баллистических решений."
 sp_naval_heavy_shells_2_output_tt:0 "§YЛинкоры, линейные крейсеры, сверхтяжёлые линкоры и линейные авианосцы:§! атака и бронепробитие тяжёлых орудий §G+5%§!.\nОткрывает модуль §YСверхтяжёлый снаряд§!."

 sp_naval_sonar_1:0 "Улучшенный корабельный сонар"
 sp_naval_sonar_1_desc:0 "Совершенствование излучателей, обработки сигнала и размещения аппаратуры на корпусе повышает надёжность обнаружения подводных целей в боевых условиях."
 sp_naval_sonar_1_output_tt:0 "Открывает модуль §YКорабельный сонар II§!."
 sp_naval_sonar_2:0 "Продвинутый корабельный сонар"
 sp_naval_sonar_2_desc:0 "Более мощные излучатели, лучшее разделение сигналов и улучшенная интеграция с корпусом увеличивают дальность и точность обнаружения подводных лодок."
 sp_naval_sonar_2_output_tt:0 "Открывает модуль §YКорабельный сонар III§!."
 sp_naval_depth_charges_1:0 "Улучшенные глубинные бомбы"
 sp_naval_depth_charges_1_desc:0 "Улучшенные взрыватели, схемы сброса и способы применения делают атаки глубинными бомбами более эффективными и предсказуемыми."
 sp_naval_depth_charges_1_output_tt:0 "Открывает модуль §YГлубинные бомбы II§!."
 sp_naval_depth_charges_2:0 "Продвинутое противолодочное вооружение"
 sp_naval_depth_charges_2_desc:0 "Совершенствование пусковых устройств, увеличение зоны поражения и развитие методов атаки повышают эффективность кораблей сопровождения против подводных лодок."
 sp_naval_depth_charges_2_output_tt:0 "Открывает модуль §YГлубинные бомбы III§!."
 sp_naval_depth_charges_3:0 "Современные противолодочные системы"
 sp_naval_depth_charges_3_desc:0 "Специализированные противолодочные установки и зрелые системы глубинных бомб значительно увеличивают ударные возможности кораблей сопровождения."
 sp_naval_depth_charges_3_output_tt:0 "Открывает модули §YГлубинные бомбы IV§! и §YПротиволодочная батарея§!."

 sp_naval_fire_control_1:0 "Интегрированная система управления огнём"
 sp_naval_fire_control_1_desc:0 "Совершенствование дальномеров, приборов расчёта и электромеханических вычислителей позволяет корабельной артиллерии увереннее поражать цели на больших дистанциях."
 sp_naval_fire_control_1_output_tt:0 "Открывает модуль §YСистема управления огнём II§!."
 sp_naval_fire_control_2:0 "Совершенная система управления огнём"
 sp_naval_fire_control_2_desc:0 "Более развитые вычислители, стабилизация и централизованное управление огнём значительно повышают согласованность работы главного и вспомогательного калибра корабля."
 sp_naval_fire_control_2_output_tt:0 "Открывает модули §YСистема управления огнём III§! и §YДистанционное управление башнями§!."

 sp_naval_dual_purpose_mounts_1:0 "Улучшенные универсальные артиллерийские установки"
 sp_naval_dual_purpose_mounts_1_desc:0 "Повышенная скорость наведения, улучшенная подача боеприпасов и более тесная интеграция с системами управления огнём позволяют лёгкой корабельной артиллерии эффективнее действовать как по надводным, так и по воздушным целям."
 sp_naval_dual_purpose_mounts_1_output_tt:0 "Открывает модули улучшенной универсальной лёгкой артиллерии."
 sp_naval_dual_purpose_mounts_2:0 "Совершенная универсальная корабельная артиллерия"
 sp_naval_dual_purpose_mounts_2_desc:0 "Силовые приводы, централизованное управление огнём и более тяжёлые универсальные орудия значительно усиливают противовоздушную оборону корабля без отказа от эффективного огня по надводным целям."
 sp_naval_dual_purpose_mounts_2_output_tt:0 "Открывает модули совершенной универсальной лёгкой и базовой универсальной средней артиллерии."

 sp_naval_electric_torpedo:0 "Электрические торпеды"
 sp_naval_electric_torpedo_desc:0 "Электрическая силовая установка значительно уменьшает заметный след торпеды и повышает скрытность атак подводных лодок, но требует более сложной системы питания."
 sp_naval_electric_torpedo_output_tt:0 "Шанс обнаружения выпущенных торпед: §G-15%§!.\nВзаимоисключающе с проектом §YКислородные торпеды§!."
 sp_naval_oxygen_torpedo:0 "Кислородные торпеды"
 sp_naval_oxygen_torpedo_desc:0 "Использование обогащённого кислорода позволяет создавать дальнобойные и мощные торпеды с выдающимися характеристиками, однако требует особой конструкции и осторожного обращения."
 sp_naval_oxygen_torpedo_output_tt:0 "Пробитие охранения торпедами: §G+10%§!.\nВзаимоисключающе с проектом §YЭлектрические торпеды§!."
 sp_naval_homing_torpedo:0 "Самонаводящиеся торпеды"
 sp_naval_homing_torpedo_desc:0 "Акустические и автономные системы наведения позволяют торпеде корректировать курс после пуска и существенно повышают вероятность попадания по маневрирующей цели."
 sp_naval_homing_torpedo_output_tt:0 "§YЭсминцы, подводные лодки и крейсеры:§! шанс попадания торпед §G+5%§!."

 sp_naval_ship_radar_1:0 "Интеграция корабельной РЛС"
 sp_naval_ship_radar_1_desc:0 "Адаптация ранних радиолокационных станций к кораблям требует компактных антенн, стабилизированных установок и интеграции с корабельными системами управления."
 sp_naval_ship_radar_1_output_tt:0 "Открывает §YКорабельную РЛС II§!."
 sp_naval_ship_radar_2:0 "Усовершенствованная РЛС обнаружения"
 sp_naval_ship_radar_2_desc:0 "Более совершенные передатчики, приёмники и методы обработки отметок повышают дальность и надёжность обнаружения целей в море."
 sp_naval_ship_radar_2_output_tt:0 "Открывает §YКорабельную РЛС III§!."
 sp_naval_ship_radar_3:0 "Моноимпульсная корабельная РЛС"
 sp_naval_ship_radar_3_desc:0 "Высокоточная корабельная радиолокация заметно улучшает определение дальности и пеленга в современном морском бою."
 sp_naval_ship_radar_3_output_tt:0 "Открывает §YКорабельную РЛС IV§!."

 sp_naval_propulsion_engineering_1:0 "Совершенствование корабельных силовых установок"
 sp_naval_propulsion_engineering_1_desc:0 "Улучшенная компоновка турбин, валопроводов, систем смазки и машинных отделений повышает длительную скорость хода и надёжность без создания нового поколения корпуса."
 sp_naval_propulsion_engineering_1_output_tt:0 "§YЭсминцы, крейсеры, линейные крейсеры и подлодки:§! скорость §G+3%§!.\n§YЛинкоры и авианосцы:§! скорость §G+2%§!.\n§YВсе затронутые классы:§! надёжность §G+5%§!."
 sp_naval_propulsion_engineering_2:0 "Высокофорсированные корабельные силовые установки"
 sp_naval_propulsion_engineering_2_desc:0 "Силовые установки повышенных параметров и более совершенная компоновка механизмов увеличивают длительную мощность и снижают потери топлива на эксплуатационных режимах."
 sp_naval_propulsion_engineering_2_output_tt:0 "§YЭсминцы, крейсеры, линейные крейсеры и подлодки:§! скорость §G+3%§!.\n§YЛинкоры и авианосцы:§! скорость §G+2%§!.\n§YВсе затронутые классы:§! расход топлива §G-5%§!."

 sp_naval_survivability_1:0 "Развитое деление корпуса и борьба за живучесть"
 sp_naval_survivability_1_desc:0 "Улучшенное деление корпуса на отсеки, более совершенные водоотливные системы, пожарные магистрали и организация борьбы за живучесть позволяют кораблям лучше переносить боевые повреждения."
 sp_naval_survivability_1_output_tt:0 "§YНадводные боевые корабли:§! прочность §G+5%§!, надёжность §G+5%§!."
 sp_naval_survivability_2:0 "Улучшенная противоторпедная защита"
 sp_naval_survivability_2_desc:0 "Многослойная подводная защита, усовершенствованные пустотные и жидкостные отсеки и лучшая изоляция конструкции снижают последствия торпедных попаданий и затоплений."
 sp_naval_survivability_2_output_tt:0 "§YЛинкоры и линейные крейсеры:§! снижение торпедного урона §G+8%§!.\n§YКрейсеры и авианосцы:§! снижение торпедного урона §G+5%§!.\n§YВсе затронутые классы:§! шанс критических повреждений от торпед §G-5%§!."
 sp_naval_enhanced_torpedo_belt:0 "Улучшенный торпедный пояс"
 sp_naval_enhanced_torpedo_belt_desc:0 "Усовершенствованная многослойная противоторпедная защита повышает способность крупных кораблей локализовать взрыв и ограничивать затопления после попадания."
 sp_naval_enhanced_torpedo_belt_output_tt:0 "Открывает модуль §YУлучшенный торпедный пояс§!."

 sp_naval_carrier_deck_operations:0 "Палубные операции авианосцев"
 sp_naval_carrier_deck_operations_desc:0 "Совершенствование процедур на полётной палубе, обслуживания самолётов и организации авианосных операций."
 sp_naval_carrier_deck_operations_output_tt:0 "§YАвианосцы:§! организация §G+5§!, надёжность §G+3%§!."
 sp_naval_carrier_flight_deck_systems:0 "Усовершенствованные палубные системы"
 sp_naval_carrier_flight_deck_systems_desc:0 "Разработка улучшенных лифтов, аэрофинишёров, палубной логистики и комплексной организации полётов."
 sp_naval_carrier_flight_deck_systems_output_tt:0 "§YАвианосцы:§! организация §G+5§!, надёжность §G+3%§!, скорость §G+2%§!."
 sp_naval_armored_flight_deck:0 "Бронированная полётная палуба"
 sp_naval_armored_flight_deck_desc:0 "Концепция защищённой полётной палубы, жертвующая частью вместимости авиагруппы ради большей живучести корабля."
 sp_naval_enlarged_air_group:0 "Увеличенная авиагруппа"
 sp_naval_enlarged_air_group_desc:0 "Приоритет ангарной и палубной вместимости ради максимально возможной авиагруппы ценой защиты и эксплуатационной надёжности."
 her_naval_carrier_operations_1:0 "Палубные операции авианосцев"
 her_naval_carrier_operations_2:0 "Усовершенствованные палубные системы"

 sp_naval_submarine_snorkel_1:0 "Корабельный шноркель"
 sp_naval_submarine_snorkel_1_desc:0 "Шноркель позволяет дизель-электрической подводной лодке работать дизелями на перископной глубине, сокращая время пребывания на поверхности и повышая скрытность переходов."
 sp_naval_submarine_snorkel_1_output_tt:0 "Открывает модуль §YШноркель I§!."
 sp_naval_submarine_snorkel_2:0 "Усовершенствованный шноркель"
 sp_naval_submarine_snorkel_2_desc:0 "Более совершенные воздухозаборники, клапаны и системы отвода выхлопа позволяют дольше двигаться под дизелями на перископной глубине и снижают демаскирующие признаки."
 sp_naval_submarine_snorkel_2_output_tt:0 "Открывает модуль §YШноркель II§!."
 sp_naval_anechoic_tile:0 "Безэховое покрытие"
 sp_naval_anechoic_tile_desc:0 "Резиновые звукопоглощающие плитки уменьшают отражение гидроакустических импульсов и снижают акустическую заметность корпуса подводной лодки."
 sp_naval_anechoic_tile_output_tt:0 "Открывает модуль §YБезэховое покрытие§!."
