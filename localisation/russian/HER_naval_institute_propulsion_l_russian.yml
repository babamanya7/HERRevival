 sp_naval_propulsion_engineering_1:0 "Совершенствование корабельных силовых установок"
 sp_naval_propulsion_engineering_1_desc:0 "Улучшенная компоновка турбин, валопроводов, систем смазки и машинных отделений повышает длительную скорость хода и надёжность без создания нового поколения корпуса."
 sp_naval_propulsion_engineering_1_output_tt:0 "Повышает скорость и надёжность основных классов кораблей."
 sp_naval_propulsion_engineering_2:0 "Высокофорсированные корабельные силовые установки"
 sp_naval_propulsion_engineering_2_desc:0 "Силовые установки повышенных параметров и более совершенная компоновка механизмов увеличивают длительную мощность и снижают потери топлива на эксплуатационных режимах."
 sp_naval_propulsion_engineering_2_output_tt:0 "Дополнительно повышает скорость и снижает расход топлива основных классов кораблей."
