l_russian:
 sp_naval_electric_torpedo:0 "Электрические торпеды"
 sp_naval_electric_torpedo_desc:0 "Электрическая силовая установка значительно уменьшает заметный след торпеды и повышает скрытность атак подводных лодок, но требует более сложной системы питания."
 sp_naval_electric_torpedo_output_tt:0 "Открывает технологию §YЭлектрические торпеды§!. Эта ветвь взаимоисключающая с §YКислородными торпедами§!."
 sp_naval_oxygen_torpedo:0 "Кислородные торпеды"
 sp_naval_oxygen_torpedo_desc:0 "Использование обогащённого кислорода позволяет создавать дальнобойные и мощные торпеды с выдающимися характеристиками, однако требует особой конструкции и осторожного обращения."
 sp_naval_oxygen_torpedo_output_tt:0 "Открывает технологию §YКислородные торпеды§!. Эта ветвь взаимоисключающая с §YЭлектрическими торпедами§!."
 sp_naval_homing_torpedo:0 "Самонаводящиеся торпеды"
 sp_naval_homing_torpedo_desc:0 "Акустические и автономные системы наведения позволяют торпеде корректировать курс после пуска и существенно повышают вероятность попадания по маневрирующей цели."
 sp_naval_homing_torpedo_output_tt:0 "Открывает технологию §YСамонаводящиеся торпеды§!."
