l_russian:
 SOV_guards_support_category: "Усиление гвардейских корпусов"
 SOV_guards_support_category_desc: "По мере поступления самоходной артиллерии и истребителей танков их можно придавать гвардейским соединениям в качестве полковой поддержки, не меняя их боевую ширину."
 SOV_attach_light_spg_to_guards: "Придать лёгкие САУ гвардейским соединениям"
 SOV_attach_light_spg_to_guards_desc: "Лёгкие самоходные артиллерийские установки будут добавлены в полковую поддержку гвардейских стрелковых, кавалерийских, танковых и механизированных корпусов."
 SOV_attach_medium_spg_to_guards: "Придать средние САУ гвардейским соединениям"
 SOV_attach_medium_spg_to_guards_desc: "Средние самоходные артиллерийские установки будут добавлены в полковую поддержку гвардейских кавалерийских, танковых и механизированных корпусов."
 SOV_attach_heavy_spg_to_guards: "Придать тяжёлые САУ гвардейским соединениям"
 SOV_attach_heavy_spg_to_guards_desc: "Тяжёлые самоходные артиллерийские установки будут добавлены в полковую поддержку гвардейских танковых и механизированных корпусов."
 SOV_attach_light_td_to_guards: "Придать лёгкие ПТ-САУ гвардейским корпусам"
 SOV_attach_light_td_to_guards_desc: "Лёгкие самоходные противотанковые установки будут добавлены в полковую поддержку гвардейских танковых и механизированных корпусов."
 SOV_attach_medium_td_to_guards: "Придать средние ПТ-САУ гвардейским корпусам"
 SOV_attach_medium_td_to_guards_desc: "Средние самоходные противотанковые установки будут добавлены в полковую поддержку гвардейских танковых и механизированных корпусов."
 SOV_attach_heavy_td_to_guards: "Придать тяжёлые ПТ-САУ гвардейским корпусам"
 SOV_attach_heavy_td_to_guards_desc: "Тяжёлые самоходные противотанковые установки будут добавлены в полковую поддержку гвардейских танковых и механизированных корпусов."
 guards_light_sp_artillery_support: "Полковая поддержка лёгкими САУ"
 guards_medium_sp_artillery_support: "Полковая поддержка средними САУ"
 guards_heavy_sp_artillery_support: "Полковая поддержка тяжёлыми САУ"
