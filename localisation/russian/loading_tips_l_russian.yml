 LOADING_TIP_24: "*захлёбывающиеся кровью булькающие завывания нурглокхорнитов, погрязших в гнили разложения и источающие уничтожительную чумную заразу*  \n - бабка Жопина"
 LOADING_TIP_25: "Вычёркиваем два Челябинска  \n - BigBang"
 LOADING_TIP_26: "Рейхкомиссариаты... Нелепая затея... Я не только согласился с этим решением БигБенга, но и поддержал его, совершив одну из серьёзнейших своих ошибок. \n - Бабаманя"
 LOADING_TIP_27: "Йо... Сони Эриксон... Обзор на бабушку... ПРРРРРР ЧХЧХЧХ. \n - Бабаманя"
 LOADING_TIP_28: "«Спасибо Господу за немецкий лендлиз» \n - Турбохохол"
 LOADING_TIP_29: "Я выставил яйца на проветривание \n - uHCneKTop->l<onuH"
 LOADING_TIP_30: "«Никогда не спорь с Михаем. Вы опуститесь до его уровня, где он задавит вас опытом» \n - Preacher"
 LOADING_TIP_31: "«Броня толста как шматок украинского сала» \n - Нквдшник в процессе создания КВ-1"
 LOADING_TIP_32: "«Но я как бы дурак который любит умно говорить, но не делает так сам» \n - Михай"
 LOADING_TIP_33: "«Все новое это хорошое забытое старое и почти всегда придуманное немцами» \n - Туземный совет трудящихся"
 LOADING_TIP_34: "«Дядь, не в масть тебе такие котлы, давай снимай»"
 LOADING_TIP_35: "«Подразделения особой группы армии успешно ведут боевые действия на Донецком направлении, в результате их действий городская агломерация Донецкого Бассейна перешла под контроль Вермахта. Когда командующий 1-ым парашютным корпусом прибыл награждать бойцов, он застал десантников испивающим воду из Макеевского Родничка. За это генерал-лейтенант присвоил почётное название группе армий "Макеевский Родничок"» \n - Из личного дневника Фридриха Паулюса, командующего группой армии «Макеевский Родничок»"
 LOADING_TIP_36: "«Уймись, Геринга тебе не спихнуть. Он хоть и дутая фигура, но блестит, как медный таз. А ты, дружище, уж извини, фигура не для фасада» \n - Роберт Лей Эрхарду Мильху"
 LOADING_TIP_37: "«ААААА, ПАЖАР НА МАТОРНЫМ АДСЕКУ!» \n - Генерал-майор Лизюков перед гибелью"
 LOADING_TIP_38: "«Флот простоял в Яве, мать пролежала в канаве, Индус капает» \n - Preacher"
 LOADING_TIP_39: "«Просто не игра, а каторга какая-то» \n - Preacher"
 LOADING_TIP_40: "«Я долблюсь в задницу каждый день» \n - uHCneKTop->l<onuH"
 LOADING_TIP_41: "«Саушка тяжелая ни у кого не проучена?» \n - Preacher"
 LOADING_TIP_42: "«Долбаеба надо игнорировать, чтобы показаться умным» \n - Михай"
 LOADING_TIP_43: "«Крутой позитивный модик, всем советую! Но побеждает всегда разраб» \n - Полупокер о Хермоде"
