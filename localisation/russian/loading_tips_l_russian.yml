 LOADING_TIP_9: "«Я извиняюсь, за плохие слова, плохие поступки, петушиные поступки в частности. За агрессию необоснованную, больше так не буду».\n- Баба Маня"
 LOADING_TIP_10: "«Интересно там играть с тупым пендосом на автоматизированной инвалидной коляске с подачей бургеров и отсосом говна из под жопы?»\n- Лаки"
 LOADING_TIP_11: "«ААААААААААААААА!!!!».\n- Нквдешник"
 LOADING_TIP_12: "#ZдраVствуйте"
 LOADING_TIP_13: "Россия тут навсегда .\n- Херсон" 
 LOADING_TIP_14: "«Это петушиный поступок».\n- БигБенг"
 LOADING_TIP_15: "«Женщина? А сколько у неё дивизий?»\n- Олег Корнилов"
 LOADING_TIP_16: "«Не то главное, сколько веса в БигБенге, а сколько в нем боевитости».\n- Нквдешник"
 LOADING_TIP_17: "«Даймлер Бенц! Даймлер Бенц! Даймлер Бенц!»\n- Бабка, 7 декабря 1936 года"
 LOADING_TIP_18: "«Военная ситуация обернулась не вполне к пользе Нквдешника».\n- БигБенг, 1942 год"
 LOADING_TIP_19: "извини ты гетеро\n- Лаки (после известия о обиде Нквдешника)"
 LOADING_TIP_20: "«Лучший аргумент против Жопина — пятиминутный разговор с ним».\n- БигБенг"
 LOADING_TIP_21: "«Просторы БигБенга нас поглощают».\n- Нквдешник"
