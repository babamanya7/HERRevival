 LOADING_TIP_2: "«Главная проблема цитат в интернете в том, что люди сразу верят в их подлинность».\n- Владимир Ленин"
 LOADING_TIP_3: "«Тебя это ебать не должно».\n- Нквдешник"
 LOADING_TIP_4: "«Когда я умру, на мою могилу нанесут много мусора, но Лаки все сожрёт».\n- Инспектор Жопин"
