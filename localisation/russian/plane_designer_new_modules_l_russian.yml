 fb_rocket_rails_2: "Улучшенные ракетные направляющие" 
 fb_rocket_rails_2_desc: "Улучшенная версия ракет «воздух-земля» несет в себе много любви и уважения к нашим врагам или много взрывчатки, я не могу точно сказать, пожалуйста, дайте мне знать после того, как вы их испытаете.." 

