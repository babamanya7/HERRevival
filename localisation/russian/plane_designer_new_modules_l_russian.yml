 EQ_MOD_CAT_plane_special_module_jet_TITLE: "Реактивные специальные модули"
 swept_wings: "Стреловидные крылья"
 swept_wings_desc: "Cтреловидное крыло помогает снизить сопротивление при сверхзвуковых полетах." 
 improved_compressor: "Улучшенный компрессор"
 improved_compressor_desc: "Реактивные двигатели всасывают через воздухозаборник большое количество окружающего воздуха. За входным отверстием находится компрессорная секция. Задача компрессора заключается в повышении давления поступающего воздуха до того, как он достигнет секции сгорания." 
 supersonic_air_intake: "Сверхзвуковой воздухозаборник"
 supersonic_air_intake_desc: "Для сверхзвукового самолета впускное отверстие должно замедлить поток до дозвуковых скоростей, прежде чем воздух достигнет компрессора." 
 afterburner: "Форсаж"
 afterburner_desc: "" 
 
 leigh_light: "Leigh Light"
 leigh_light_desc: "Мощный прожектор с угольной дугой помогает обнаружить всплывшие подводные лодки в ночное время." 
 sonobuoy: "Гидроакустический буй"
 sonobuoy_desc: "Одноразовая гидроакустическая система, сбрасываемая с самолетов, ведущих противолодочную борьбу."
 magnetic_anomaly_detector: "Детектор магнитных аномалий"
 magnetic_anomaly_detector_desc: "Магнитометры обычно используются для поиска подводных лодок. Подводные лодки изготавливаются в основном из ферромагнитных материалов, поэтому их присутствие в магнитном поле Земли будет искажать поле вокруг них. Это в дополнение к присущей им остаточной намагниченности."
 asv_radar: "Корабельный радар «воздух-поверхность»"
 asv_radar_desc: "Базовый бортовой поисковой радар"
 
 fb_bomb_locks: "Бомбодержатели"
 fb_bomb_locks_desc: "Крепления для небольших бомб под крыльями или фюзеляжем позволяют самолету небезуспешно атаковать наземные цели."
 fb_heavy_bomb_locks: "Держатели для тяжелых бомб"
 fb_heavy_bomb_locks_desc: "Крепления для крупных бомб под крыльями или фюзеляжем позволяют самолету весьма успешно атаковать наземные цели."
 fb_small_bomb_bay: "Маленький бомбовый отсек"
 fb_small_bomb_bay_desc: "Небольшой отсек для бомб. Он не влияет на аэродинамику, так как расположен внутри фюзеляжа, однако конструкция самолета больше не позволяет ему выполнять сложные маневры в воздушном бою."
 
 medium_bomb_bay_cluster_bombs: "Кассетные бомбы"
 medium_bomb_bay_cluster_bombs_desc: "Кассетные бомбы выбрасывают разрывные бомбы, предназначенные для уничтожения личного состава и транспортных средств."

 small_cluster_bombs: "Бомбы-бабочки"
 small_cluster_bombs_desc: "Этот тип бомбы был одной из первых кассетных бомб, когда-либо использованных в бою, и оказался весьма эффективным оружием."
 
 supply_drops: "Снабженческое отделение"
 troop_compartment: "Десантное отделение"
 cargo_bay: "Грузовой отсек" 
 cargo_bay_desc: "" 
 
 jet_engine_improvements: "Улучшения реактивного двигателя"
 
 torpedo_mounting: "Легкие торпедные установки"
 torpedo_mounting_desc: "Узлы подвески, позволяющие установить под фюзеляжем легкую торпеду. Это дает самолету мощное оружие, которое можно использовать против кораблей противника."
 torpedo_mounting_2: "Средние торпедные установки"
 torpedo_mounting_2_desc: "Узлы подвески, позволяющие установить под фюзеляжем среднюю торпеду. Это дает самолету мощное оружие, которое можно использовать против кораблей противника."
 torpedo_mounting_3: "Тяжёлые торпедные установки"
 torpedo_mounting_3_desc: "Узлы подвески, позволяющие установить под фюзеляжем тяжёлую торпеду. Это дает самолету мощное оружие, которое можно использовать против кораблей противника."
 
 air_torpedoe_1: "Торпеды воздушного базирования"
 air_torpedoe_1_desc: "Необходимо разработать легкие торпеды, чтобы их можно было нести на наших самолетах."
 air_torpedoe_2: "Улучшенные торпеды воздушного базирования"
 air_torpedoe_2_desc: "Развитие авиации позволяет разрабатывать более крупные и мощные торпеды."
 air_torpedoe_3: "Передовые торпеды воздушного базирования"
 air_torpedoe_3_desc: "Объединив новейшие технологии, мы сможем создать высокотехнологичные торпеды для наших самолетов."
 
 NACA_cowling: "Капот NACA"
 NACA_cowling_desc: "Капот состоит из симметричного круглого профиля, обернутого вокруг двигателя. Это значительный шаг вперед в снижении аэродинамического сопротивления радиальных двигателей."
 EQ_MOD_CAT_plane_special_module_radial_engine_TITLE: "Специальные модули радиального двигателя"
