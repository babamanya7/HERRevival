 engine_1_1x_desc: "Рядные двигатели с жидкостным охлаждением - лёгче, чем радиальные двигатели, и позволяют устанавливать моторную пушку."
 engine_1_2x: "2x Рядный двигатель I"
 engine_1_2x_desc: "Двойные рядные двигатели дают самолету значительное увеличение тяги, но за это приходится платить."
 engine_1_3x: "3x Рядный двигатель I"
 engine_1_3x_desc: "Три рядных двигателя дают большую тягу, чем пара из них, без дополнительных затрат на четвертый рядный двигатель."
 engine_1_4x: "4x Рядный двигатель I"
 engine_1_4x_desc: "Квартет рядных двигателей обеспечивает достаточную тягу, чтобы поднять тяжелый самолет и нести значительную полезную нагрузку."
