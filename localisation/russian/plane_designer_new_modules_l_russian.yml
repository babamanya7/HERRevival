 high_octane_fuel: "Высокооктановая присадка" 
 high_octane_fuel_desc: "Авиационный бензин с более высоким октановым числом может использоваться в качестве топлива для высокопроизводительных авиационных двигателей, повышая летно-технические характеристики самолетов."

 remote_control_turret_system: "Турели с дистанционным управлением"
 remote_control_turret_system_desc: "Турели-стрелки могут сильно раздражать, если они мертвы или засыпают посреди воздушного боя, поэтому их очень удобно заменить централизованной системой управления."
 remote_control_turret_system_category: "Турели с дистанционным управлением" 
  
 pressurized_cockpit: "Герметичная кабина" 
 pressurized_cockpit_desc: "Герметизация кабины самолета позволяет летать на гораздо больших высотах с менее плотным воздухом. Тем самым увеличивая его скорость и маневренность."
 pressurized_cockpit_med: "Герметичная кабина" 
 pressurized_cockpit_med_desc: "Герметизация кабины самолета позволяет летать на гораздо больших высотах с менее плотным воздухом. Тем самым увеличивая его скорость и маневренность."
 
 
 
 water_injection: "Cистема впрыска воды" 
 water_injection_desc: "Впрыск двигателя используется для охлаждения топливно-воздушной смеси и, таким образом, достижения большей мощности." 
 fuel_injection: "Инжекторная система подачи топлива" 
 fuel_injection_desc: "Впрыск двигателя используется для охлаждения топливно-воздушной смеси и, таким образом, достижения большей мощности и снижения расхода топлива." 

 early_turbocharger: "Ранний турбокомпрессор"
 early_turbocharger_desc: "Турбокомпрессор — это устройство принудительной индукции с приводом от турбины, которое используется в поршневом двигателе для увеличения мощности."
 early_supercharger: "Ранний нагнетатель"
 early_supercharger_desc: "Нагнетатель — это устройство принудительной индукции с механическим приводом, которое используется в поршневом двигателе для увеличения мощности. Его назначение и функция аналогичны турбонагнетателю, с той принципиальной разницей, что он приводится в действие механическим путем, напрямую связанным с двигателем, тогда как турбонагнетатель приводится в действие турбиной, используя поток выхлопных газов двигателя." 


 turbocharger: "Турбокомпрессор"
 turbocharger_desc: "Турбокомпрессор — это устройство принудительной индукции с приводом от турбины, которое используется в поршневом двигателе для увеличения мощности."
 supercharger: "Нагнетатель"
 supercharger_desc: "Нагнетатель — это устройство принудительной индукции с механическим приводом, которое используется в поршневом двигателе для увеличения мощности. Его назначение и функция аналогичны турбонагнетателю, с той принципиальной разницей, что он приводится в действие механическим путем, напрямую связанным с двигателем, тогда как турбонагнетатель приводится в действие турбиной, используя поток выхлопных газов двигателя." 

 dive_brakes_medium: "Аэродинамический тормоз" 
 dive_brakes_medium_desc: "Набор интерцепторов вдоль задней кромки крыла раскрывается, когда самолет входит в пикирование, снижая общую скорость и позволяя самолету выйти из крутого пикирования, не отрывая крыльев. это, в свою очередь, позволяет самолету атаковать с почти вертикального пикирования, что резко повышает точность."
 
