 aerodynamic_pylons_small_desc: "Перетаскивание, как ни странно, не помогает летать быстрее, особенно если подвесить под крылья пару бомб."  
 aerodynamic_pylons_medium: "Аэродинамические пилоны"
 aerodynamic_pylons_medium_desc: "Перетаскивание, как ни странно, не помогает летать быстрее, особенно если подвесить под крылья пару бомб." 

 drop_tanks_medium: "Сбрасываемые баки"
 drop_tanks_medium_desc: "Много топлива всегда лучше, чем его отсутствие, большая дальность лучше, чем быть подстреленным. Быть авиаконструктором так просто, разве вы не знаете?"
 
